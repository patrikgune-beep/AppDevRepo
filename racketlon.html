<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <title>Racketlon – Tävlingsupplägg</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="racketlon.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Racketlon</h1>
      <p class="subtitle">Skapa ett tävlingsupplägg</p>
      <div class="nav-bar">
        <a class="nav-link" href="index.html">← Till Gym Coach</a>
      </div>
    </header>

    <section class="form-section" id="setup-section">
      <div class="form-group">
        <label for="player-count">Antal spelare <span class="label-hint">(2–24)</span></label>
        <input type="number" id="player-count" min="2" max="24" value="6" placeholder="2–24" inputmode="numeric" autocomplete="off" />
        <p class="count-hint" id="players-hint"></p>
      </div>

      <div class="form-group">
        <label>Spelarnamn <span class="label-hint">(valfritt – lämna tomt så blir det Spelare 1, 2 …)</span></label>
        <div class="name-grid" id="name-grid"></div>
      </div>

      <div class="form-group">
        <label>Sporter <span class="label-hint">(välj en eller flera)</span></label>
        <div class="type-grid" id="sport-grid"></div>
      </div>

      <div class="form-group">
        <label>Matchstyrning <span class="label-hint">(hur varje sport avgörs)</span></label>
        <div class="mode-toggle" id="mode-toggle">
          <button type="button" class="mode-btn active" data-mode="points">🎯 Poäng</button>
          <button type="button" class="mode-btn" data-mode="minutes">⏱ Minuter</button>
        </div>
        <div class="mode-value-row">
          <span class="mode-value-label" id="mode-value-label">Spela till</span>
          <input type="number" id="mode-value" min="1" max="180" value="21" inputmode="numeric" autocomplete="off" />
          <span class="mode-value-unit" id="mode-value-unit">poäng per sport</span>
        </div>
      </div>

      <div class="form-group">
        <label>Antal dagar</label>
        <div class="duration-grid days-grid" id="days-grid">
          <button type="button" class="duration-btn active" data-days="1">1 dag</button>
          <button type="button" class="duration-btn" data-days="2">2 dagar</button>
        </div>
      </div>

      <button class="generate-btn" id="generate-btn">Skapa tävlingsupplägg</button>
      <p class="error-msg" id="setup-error" style="display:none"></p>
    </section>

    <section class="results-section" id="results-section" style="display:none">
      <div class="results-header">
        <h2 id="results-title">Tävlingsupplägg</h2>
        <div class="results-header-actions">
          <button class="regenerate-btn" id="print-btn">🖨 Skriv ut</button>
          <button class="regenerate-btn" id="reset-btn">Nytt upplägg</button>
        </div>
      </div>
      <div class="summary" id="tournament-summary"></div>
      <p class="format-note" id="format-note"></p>
      <div id="standings-wrap"></div>
      <div id="schedule-wrap"></div>
    </section>
  </div>

  <script src="racketlon.js"></script>
</body>
</html>
