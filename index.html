<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Klubbmästerskap – Dalarö Tennisklubb</title>
<style>
  :root{
    --cream:#f4f1e6;
    --paper:#fbf9f1;
    --red:#b5362b;
    --red-dark:#8f2a21;
    --sky:#84b6d6;
    --green:#3f6b39;
    --ink:#26211c;
    --line:#d8d1bd;
    --gold:#c9a227;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.4;
  }
  header.app{
    background:var(--paper);
    border-bottom:4px solid var(--red);
    display:flex;align-items:center;gap:18px;
    padding:14px 22px;
    position:sticky;top:0;z-index:30;
  }
  header.app .logo{width:64px;height:64px;flex:0 0 auto}
  header.app h1{
    margin:0;font-size:22px;letter-spacing:.5px;
    font-family:"Arial Narrow",Arial,sans-serif;text-transform:uppercase;
    color:var(--red);
  }
  header.app .sub{margin:0;font-size:12px;color:#6b6356;text-transform:uppercase;letter-spacing:2px}
  header.app .spacer{flex:1}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tabs button{
    border:none;background:transparent;padding:10px 16px;cursor:pointer;
    font-size:14px;font-weight:600;color:#6b6356;border-radius:8px 8px 0 0;
  }
  .tabs button.active{background:var(--red);color:#fff}
  .tabs button:hover:not(.active){background:#eee5cf}
  main{max-width:1280px;margin:0 auto;padding:20px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  button.btn{
    background:var(--red);color:#fff;border:none;border-radius:7px;
    padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  button.btn:hover{background:var(--red-dark)}
  button.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
  button.btn.ghost:hover{background:#f7ece2}
  button.btn.mini{padding:4px 9px;font-size:12px}
  button.btn.gray{background:#776f60}
  button.btn.gray:hover{background:#5f584c}
  select,input,textarea{font-family:inherit;font-size:13px}
  select,input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
  textarea{width:100%;min-height:160px;padding:10px;border:1px solid var(--line);border-radius:8px;resize:vertical;background:#fff}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 10px;font-size:17px;color:var(--red)}
  .grid-classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .classcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:.15s}
  .classcard:hover{border-color:var(--red);box-shadow:0 3px 10px rgba(0,0,0,.07)}
  .classcard.active{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
  .classcard .ttl{font-weight:700;font-size:14px}
  .classcard .meta{font-size:12px;color:#6b6356;margin-top:4px}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
  .badge.youth{background:#e7f0f6;color:#2c6285}
  .badge.adult{background:#f6e9e0;color:var(--red)}
  .badge.done{background:#e3f1de;color:var(--green)}
  /* Bracket – absolut balanserat träd */
  .bracketwrap{overflow-x:auto;padding:6px 4px 20px}
  .bracket{position:relative}
  .bracket .rhead{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#6b6356;text-align:center;font-weight:700}
  .match{
    background:#fff;border:1px solid var(--line);border-radius:9px;
    position:absolute;z-index:1;box-sizing:border-box;
  }
  .match.champbox{border:none;background:transparent}
  .match .slot.swapsel{background:#fff3bf;outline:2px solid #f0a500;border-radius:5px}
  .mno{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:#6b6356;border-radius:4px;padding:0 5px;margin-right:5px;letter-spacing:.5px}
  .match .slot{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px dashed var(--line)}
  .match .slot:last-of-type{border-bottom:none}
  .match .slot .nm{flex:1;font-size:13px;cursor:pointer;border-radius:5px;padding:2px 4px}
  .match .slot .nm:hover{background:#f3eada}
  .match .slot.win .nm{font-weight:800;color:var(--green)}
  .match .slot.bye .nm{color:#b3aa98;font-style:italic}
  .match .slot.tbd .nm{color:#b3aa98;font-style:italic}
  .match .scorerow{display:flex;gap:6px;padding:6px 9px;background:#faf6ec;border-top:1px solid var(--line);align-items:center}
  .match .scorerow input{flex:1;min-width:0}
  .match .scorerow .winsel{flex:1;min-width:0;max-width:46%;border:1px solid var(--gold);border-radius:5px;background:#fff;font-weight:600}
  .match .sched-tag{font-size:10px;color:#6b6356;padding:2px 9px 6px}
  .champion{background:linear-gradient(#fff,#fbf4df);border:2px solid var(--gold);text-align:center;padding:14px;border-radius:10px}
  .champion .lbl{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--gold)}
  .champion .who{font-size:18px;font-weight:800;margin-top:4px}
  /* Schedule */
  .daybar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .daybar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;text-align:center;line-height:1.2}
  .daybar button.active{background:var(--red);color:#fff;border-color:var(--red)}
  .daybar button .dow{display:block;font-weight:700}
  .daybar button .dt{display:block;font-size:11px;opacity:.8}
  .daybar button .cnt{display:block;font-size:10px;margin-top:2px;color:var(--gold)}
  .schedtable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .schedtable th,.schedtable td{border:1px solid var(--line);padding:6px;vertical-align:top;font-size:12px}
  .schedtable th{background:var(--red);color:#fff;font-size:12px}
  .schedtable td.time{background:#faf6ec;font-weight:700;white-space:nowrap;text-align:center}
  .schedtable td.lunch{background:#f0eada;text-align:center;color:#8f8775}
  .slotcell{min-height:34px}
  .mtile{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:6px;padding:5px 7px;margin-bottom:4px}
  .mtile.conflict{background:#fde9e9;box-shadow:inset 0 0 0 2px #d11}
  .mtile .cls{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#6b6356}
  .mtile .cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .schedtable td.pausrow{background:#efe9db;color:#8a8270;text-align:center;font-size:11px;font-style:italic}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
  .legend .item{display:flex;align-items:center;gap:6px;font-size:12px}
  .legend .sw{width:13px;height:13px;border-radius:3px;display:inline-block;flex:0 0 auto}
  .classcard .sw{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:5px}
  .mtile .vs{font-size:12px;font-weight:600;margin:2px 0}
  .mtile .ctrls{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
  .mtile select{font-size:11px;padding:2px 3px}
  .unsched{display:flex;flex-wrap:wrap;gap:8px}
  .empty{color:#8a8270}
  .hint{font-size:12px;color:#6b6356;background:#faf6ec;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{font-size:11px;background:#eee5cf;border-radius:20px;padding:2px 9px}
  table.results{width:100%;border-collapse:collapse;background:#fff}
  table.results th,table.results td{border:1px solid var(--line);padding:7px 9px;font-size:13px;text-align:left}
  table.results th{background:#faf6ec}
  .muted{color:#8a8270}
  .small{font-size:12px}
  /* print */
  #printArea{display:none}
  .brpage{position:relative;overflow:hidden;background:#fff}
  @page land{ size:A4 landscape; margin:6mm }
  @media print{
    header.app,.tabs,.toolbar,.daybar,#app,.no-print{display:none !important}
    body{background:#fff}
    #printArea{display:block;padding:0}
    #printArea h1{color:#000}
    .mtile .ctrls{display:none}
    /* Stege som träd: en liggande A4 per klass */
    .brpage{width:1040px;height:730px;page:land;break-after:page;page-break-after:always}
    .brpage:last-child{break-after:auto;page-break-after:auto}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<header class="app">
  <div class="logo" id="logoHolder"></div>
  <div>
    <h1 id="appTitle">Klubbmästerskap</h1>
    <p class="sub" id="appSub">Dalarö Tennisklubb</p>
  </div>
  <div class="spacer"></div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="toolbar no-print">
    <button class="btn ghost mini" id="exportBtn">⬇ Exportera (säkerhetskopia)</button>
    <button class="btn ghost mini" id="importBtn">⬆ Importera</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" />
    <span class="spacer" style="flex:1"></span>
    <label class="small">Banor: <input type="number" id="courtsInput" min="1" max="8" style="width:56px"></label>
  </div>
  <div id="app"></div>
</main>

<div id="printArea"></div>

<script>
/* =========================================================
   Dalarö Tennisklubb – Klubbmästerskap. Lokal app (localStorage).
   ========================================================= */

const LS_KEY = "km_dalaro";

// --- Turneringsdagar beräknas från turneringens start- och slutdatum ---
const SV_DOW = ["Söndag","Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag"];
const SV_MON = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
function parseDate(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); const dt=new Date(y,m-1,d); return isNaN(dt)?null:dt; }
function isoDate(dt){ return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function fmtShort(dt){ return dt.getDate()+" "+SV_MON[dt.getMonth()]; }
function defaultTournament(){ const y=new Date().getFullYear(); return {start:`${y}-07-04`, end:`${y}-07-11`}; }
// Lista över turneringens dagar {date, dow, short}
function getDays(){
  const t=state.tournament||{};
  const start=parseDate(t.start), end=parseDate(t.end);
  const out=[];
  if(!start||!end||end<start) return out;
  let cur=new Date(start), guard=0;
  while(cur<=end && guard++<120){
    out.push({date:isoDate(cur), dow:SV_DOW[cur.getDay()], short:fmtShort(cur)});
    cur.setDate(cur.getDate()+1);
  }
  return out;
}
function adultFinalDay(){ const d=getDays(); return d.length?d[d.length-1].date:null; }            // sista dagen
function youthFinalDay(){ const d=getDays(); return d.length>1?d[d.length-2].date:(d[0]?d[0].date:null); } // näst sista dagen
function tournamentYear(){ const d=getDays(); return d.length?parseDate(d[0].date).getFullYear():""; }
function tournamentRangeText(){
  const d=getDays(); if(!d.length) return "datum ej satt";
  const a=parseDate(d[0].date), b=parseDate(d[d.length-1].date);
  return `${a.getDate()} ${SV_MON[a.getMonth()]} – ${b.getDate()} ${SV_MON[b.getMonth()]} ${b.getFullYear()}`;
}

const DEFAULT_CLASSES = [
  {name:"Damsingel",        type:"adult"},
  {name:"Herrsingel",       type:"adult"},
  {name:"Herrdubbel",       type:"adult"},
  {name:"Damdubbel",        type:"adult"},
  {name:"Mixeddubbel",      type:"adult"},
  {name:"Juniorveteran",    type:"adult"},
  {name:"Veteransingel",    type:"adult"},
  {name:"Generationsdubbel",type:"adult"},
  {name:"Pojksingel Äldre", type:"youth"},
  {name:"Flicksingel Äldre",type:"youth"},
  {name:"Juniordubbel",     type:"youth"},
  {name:"Pojksingel Yngre", type:"youth"},
  {name:"Flicksingel Yngre",type:"youth"},
  {name:"Minidubbel",       type:"youth"},
];

/* ---------- Klasser med seedning (endast top 4) ---------- */
const RANKED_CLASSES = new Set(["Herrsingel","Herrdubbel","Mixeddubbel","Juniorveteran"]);
const MAX_SEEDS = 4;

/* ---------- Tidsluckor (minuter från midnatt) ----------
   Ungdom: 30 min/match, vardagar 9–13, paus 30 min efter 3 matcher.
   Senior: 60 min/match, alla dagar 13–21, paus 60 min efter 3 matcher.
   Helg: seniorer spelar dessutom förmiddag 8–11 (3 matcher à 60 min, paus efter tre).
   Lunch 12–13. */
const MATCH_MIN_YOUTH = 30;
const MATCH_MIN_SENIOR = 60;
function buildZoneSlots(startMin, endMin, matchMin, perBreak, breakMin){
  const out=[]; let t=startMin, c=0, guard=0;
  while(t+matchMin<=endMin && guard++<400){
    if(t>=720 && t<780){ t=780; c=0; continue; }   // lunchpaus 12:00–13:00
    out.push(t); t+=matchMin; c++;
    if(c%perBreak===0) t+=breakMin;                 // paus efter 3 matcher
  }
  return out;
}
// AUTOMATISK planering (paus efter var 3:e match kvarstår):
//  Junior: vardag, första start 09:00, sista start ≤ 12:30 (lunch 12–13, 30 min match)
//  Senior vardag: första start 13:00, sista start ≤ 20:00 (60 min match)
//  Senior helg: första start 09:00, sista start ≤ 20:00 (60 min match)
const YOUTH_SLOTS   = buildZoneSlots(540,780,MATCH_MIN_YOUTH,3,30);    // junior vardag 9–13
const SENIOR_SLOTS  = buildZoneSlots(780,1260,MATCH_MIN_SENIOR,3,60);  // senior vardag 13–21
const SENIOR_WEEKEND= buildZoneSlots(540,1260,MATCH_MIN_SENIOR,3,60);  // senior helg 9–21 (start 9)
// Auto-tider för en klasstyp en given dag.
function slotsFor(type, day){
  if(type==="youth") return YOUTH_SLOTS;
  return (day && isWeekend(day)) ? SENIOR_WEEKEND : SENIOR_SLOTS;
}
// Alla auto-tider en given dag kan ha (helg = endast senior 9–; vardag = junior 9–13 + senior 13–).
function daySlots(day){
  return isWeekend(day) ? SENIOR_WEEKEND : [...YOUTH_SLOTS, ...SENIOR_SLOTS];
}
// MANUELL schemaläggning: 08:00–21:00 för både junior (30 min-steg) och senior (60 min-steg).
function manualSlots(type){
  const step = type==="youth" ? MATCH_MIN_YOUTH : MATCH_MIN_SENIOR;
  const out=[]; for(let t=480; t<=1260; t+=step) out.push(t); return out;
}
const ALL_SLOTS = [...new Set([...YOUTH_SLOTS,...SENIOR_WEEKEND,...SENIOR_SLOTS])].sort((a,b)=>a-b);
function fmtMin(m){ return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function matchMinFor(type){ return type==="youth"?MATCH_MIN_YOUTH:MATCH_MIN_SENIOR; }
// Radlängd i rutnätet (dagsberoende): helg = 60 min; vardag före 13:00 = 30, annars 60.
function slotDur(t, day){ if(day && isWeekend(day)) return MATCH_MIN_SENIOR; return t<780 ? MATCH_MIN_YOUTH : MATCH_MIN_SENIOR; }
function timeLabel(m, day){ return fmtMin(m)+"–"+fmtMin(m+slotDur(m, day)); }
function hourLabel(m, day){ return timeLabel(m, day); }   // bakåtkompatibelt namn
// Match-specifik tidsetikett (matchlängd utifrån klasstyp – korrekt även vid manuell placering).
function matchLabel(m){ const d=matchMinFor(getClass(m.classId).type); return fmtMin(m.time)+"–"+fmtMin(m.time+d); }

/* ---------- Spelarnamn ---------- */
// Ta bort rank "(n)" i slutet av ett namn (för jämförelse/gruppering).
function stripRank(name){ return String(name).replace(/\s*\(\d+\)\s*$/,"").trim(); }
// Individuella spelarnamn i en match (dubbelpar delas på "/").
function playersOf(m){
  const out=[];
  for(const side of [m.p1,m.p2]){
    if(!side) continue;
    for(const part of String(side).split("/")){
      const nm=stripRank(part);
      if(nm) out.push(nm);
    }
  }
  return out;
}

/* ---------------- State ---------------- */
let state = normalize(load() || newState());
let ui = { tab:"classes", classId: state.classes[0].id, day: null };
ensureDay();

function newState(){
  return {
    courts: 2,
    migratedV2: true,
    extraCourts: {},
    tournament: defaultTournament(),
    classes: DEFAULT_CLASSES.map((c,i)=>({
      id:"c"+i, name:c.name, type:c.type,
      ranked: RANKED_CLASSES.has(c.name), seeds: 4, catNo: i+1,
      participants:[], matches:[], champion:null
    }))
  };
}
// Säkerställ att äldre/importerade tillstånd har förväntade fält.
function normalize(s){
  if(!s.tournament) s.tournament=defaultTournament();
  if(!s.tournament.start||!s.tournament.end) s.tournament=defaultTournament();
  if(!s.extraCourts) s.extraCourts={};
  s.classes=s.classes||[];
  // Engångsmigrering (annars återskapas klasser som användaren tagit bort/döpt om).
  if(!s.migratedV2){
    const renameMap={"Pojksingel":"Pojksingel Äldre","Flicksingel":"Flicksingel Äldre"};
    s.classes.forEach(c=>{ if(renameMap[c.name]) c.name=renameMap[c.name]; });
    [["Pojksingel Yngre","youth"],["Flicksingel Yngre","youth"],["Minidubbel","youth"]].forEach(([name,type])=>{
      if(!s.classes.some(c=>c.name===name)){
        s.classes.push({ id:"c"+uid(), name, type, ranked:false, seeds:4, catNo:s.classes.length+1,
          participants:[], matches:[], champion:null });
      }
    });
    s.migratedV2=true;
  }
  (s.classes||[]).forEach((c,ci)=>{
    // Sätt/uppdatera seedningsflaggan utifrån klassnamnet (robust mot gammal data).
    if(c.ranked===undefined) c.ranked = RANKED_CLASSES.has(c.name);
    if(!(c.seeds>0)) c.seeds = 4;   // antal seedade (standard 4)
    if(!(c.catNo>0)) c.catNo = ci+1; // matchnummer-kategori (första siffran)
    // Migrera gamla heltimme-tider (9..20) till minuter (540..1200).
    for(const m of (c.matches||[])){
      if(m.time!=null && m.time>0 && m.time<60) m.time=m.time*60;
    }
  });
  return s;
}
// Synliga (ej dolda) klasser – används i väljare, statistik och listor.
function visibleClasses(){ return state.classes.filter(c=>!c.hidden); }
// Klasshantering: lägg till, döp om, dölj/visa, ta bort.
function addClass_(){
  const name=(prompt("Namn på den nya klassen:")||"").trim();
  if(!name) return;
  if(state.classes.some(c=>c.name===name)){ alert("Det finns redan en klass med det namnet."); return; }
  const youth=confirm("Är detta en juniorklass (spelas vardagar 9–13, 30 min/match)?\nOK = junior · Avbryt = senior");
  state.classes.push({ id:"c"+uid(), name, type: youth?"youth":"adult",
    ranked:false, seeds:4, catNo: state.classes.length+1,
    participants:[], matches:[], champion:null });
  ui.classId=state.classes[state.classes.length-1].id;
  save(); render();
}
function renameClass(cls){
  const nn=(prompt(`Nytt namn för klassen "${cls.name}":`, cls.name)||"").trim();
  if(!nn || nn===cls.name) return;
  if(state.classes.some(c=>c!==cls && c.name===nn)){ alert("Det finns redan en klass med det namnet."); return; }
  cls.name=nn; save(); render();
}
function toggleHideClass(cls){
  cls.hidden=!cls.hidden;
  save(); render();
}
function deleteClass(cls){
  const extra=cls.participants.length?` Klassen har ${cls.participants.length} deltagare och ${cls.matches.length} matcher som också tas bort.`:"";
  if(!confirm(`Ta bort klassen "${cls.name}" permanent?${extra} Detta kan inte ångras.`)) return;
  const i=state.classes.indexOf(cls);
  if(i>=0) state.classes.splice(i,1);
  if(!state.classes.length){ alert("Minst en klass måste finnas – skapar en ny tom klass."); state.classes.push({id:"c"+uid(),name:"Ny klass",type:"adult",ranked:false,seeds:4,catNo:1,participants:[],matches:[],champion:null}); }
  if(!getClass(ui.classId)) ui.classId=state.classes[0].id;
  save(); render();
}
// Ska klassen seedas?
function isRanked(cls){ return cls.ranked!==undefined ? cls.ranked : RANKED_CLASSES.has(cls.name); }
// Antal seedade i klassen (0 om ej seedad).
function seedCountOf(cls){ return isRanked(cls) ? (cls.seeds>0?cls.seeds:4) : 0; }
// Antal banor en specifik dag (bas + ev. extra 0–2).
function courtsForDay(day){
  const extra=(state.extraCourts && state.extraCourts[day]) || 0;
  return Math.max(1, Math.min(8, state.courts + extra));
}
function isWeekend(date){ const d=parseDate(date); const w=d?d.getDay():1; return w===0||w===6; }
// Ungdom auto-schemaläggs endast vardagar (lör/sön = endast seniorer).
function youthAllowedAuto(date){ return !isWeekend(date); }
// Se till att vald dag finns i turneringens datumintervall.
function ensureDay(){
  const days=getDays();
  if(!days.length){ ui.day=null; return; }
  if(!ui.day || !days.some(d=>d.date===ui.day)) ui.day=days[0].date;
}
function load(){ try{ const r=localStorage.getItem(LS_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function getClass(id){ return state.classes.find(c=>c.id===id); }
// Distinkt färg per klass (utifrån klassens ordning) för att skilja matcher åt.
const CLASS_COLORS = ["#d1495b","#3f88c5","#2e9e57","#8e44ad","#e07b16","#0e9aa7","#9A6324","#7a2e2e","#7f8c1e","#d81b8c","#5d6d7e"];
function classColor(cls){ const i=state.classes.indexOf(cls); return CLASS_COLORS[(i<0?0:i)%CLASS_COLORS.length]; }
function classColorId(id){ const c=getClass(id); return c?classColor(c):"#888"; }
// Visningsnamn: dölj seedningssiffran "(n)" överallt utom i Klasser & deltagare.
function dispName(x){ return x==null ? x : stripRank(x); }

/* ----- Matchnummer (kategori*100 + löpande) ----- */
function classCatNo(cls){ return cls.catNo>0 ? cls.catNo : state.classes.indexOf(cls)+1; }   // kategori (första siffran)
function isByeMatch(m){ return !m.manual && m.round===0 && (m.p1===null || m.p2===null); }
// Riktiga matcher i en klass i spelordning (byes räknas ej), bracket före manuella.
function orderedRealMatches(cls){
  const br=cls.matches.filter(m=>!m.manual && !isByeMatch(m)).sort((a,b)=>a.round-b.round||a.index-b.index);
  const man=cls.matches.filter(m=>m.manual);
  return [...br, ...man];
}
function matchNumber(m){
  const cls=getClass(m.classId); if(!cls) return null;
  const pos=orderedRealMatches(cls).indexOf(m);
  return pos<0 ? null : classCatNo(cls)*100 + (pos+1);
}
function matchNoTag(m){ const n=matchNumber(m); return n==null?"":`<span class="mno">#${n}</span>`; }
// Antal riktiga matcher som ska spelas i en klass (deltagare-1 + manuella).
function realMatchCount(cls){
  return Math.max(0, cls.participants.length-1) + cls.matches.filter(m=>m.manual).length;
}
// Ersätt en deltagare i en klass: nya deltagaren tar den gamlas plats i stege och schema.
function replaceParticipant(cls, oldEntry, newBase){
  newBase=(newBase||"").trim(); if(!newBase) return;
  const rm=String(oldEntry).match(/\s*(\(\d+\))\s*$/);   // behåll ev. seedning "(n)"
  const newEntry = newBase + (rm ? (" "+rm[1]) : "");
  const i=cls.participants.indexOf(oldEntry);
  if(i>=0) cls.participants[i]=newEntry;
  for(const m of cls.matches){
    if(m.p1===oldEntry) m.p1=newEntry;
    if(m.p2===oldEntry) m.p2=newEntry;
    if(m.winner===oldEntry) m.winner=newEntry;
  }
  if(cls.champion===oldEntry) cls.champion=newEntry;
  save(); render();
}

/* ---------------- Bracket / stege ---------------- */
function seedOrder(size){
  let s=[1];
  while(s.length<size){
    const len=s.length*2, n=[];
    for(const x of s){ n.push(x); n.push(len+1-x); }
    s=n;
  }
  return s;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildBracket(cls){
  const manuals = cls.matches.filter(m=>m.manual); // behåll manuellt inlagda matcher
  cls.matches=[]; cls.champion=null;
  // Rensa ev. tidigare rank, behåll ordning. Seedning (top 4) endast i utvalda klasser.
  let names = cls.participants.map(stripRank).filter(Boolean);
  const ranked = isRanked(cls);
  const nSeeds = ranked ? Math.min(seedCountOf(cls), names.length) : 0;
  // Notera rankade med siffra inom parentes bakom namnet och spara i deltagarlistan.
  for(let i=0;i<nSeeds;i++) names[i] = names[i] + ` (${i+1})`;
  cls.participants = names.slice();
  const n=names.length;
  if(n<2){ cls.matches.push(...manuals); return; }
  let size=1; while(size<n) size*=2;
  const order=seedOrder(size);              // slot-index -> seed-nummer (1..size)
  const slots=new Array(size).fill(null);   // null = BYE
  // Seeds på standardpositioner (1 & 2 i motsatta halvor osv) -> kan ej mötas tidigt.
  for(let s=1;s<=nSeeds;s++) slots[order.indexOf(s)] = names[s-1];
  // Byes ges till de högst seedade (slots med högst seed-nummer, ej seedplatser).
  const byes=size-n;
  const byeSlots=new Set();
  const byOrderDesc=[...Array(size).keys()].sort((a,b)=>order[b]-order[a]);
  for(const idx of byOrderDesc){
    if(byeSlots.size>=byes) break;
    if(order[idx]<=nSeeds) continue;        // seedplats får inte vara bye
    byeSlots.add(idx);
  }
  // Övriga (oseedade) spelare lottas slumpmässigt in i resterande platser.
  const rest=shuffle(names.slice(nSeeds));
  const emptyIdx=[...Array(size).keys()].filter(idx=>order[idx]>nSeeds && !byeSlots.has(idx));
  emptyIdx.forEach((idx,i)=>{ slots[idx]=rest[i] ?? null; });
  // Bygg ronderna.
  const rounds=Math.log2(size);
  for(let r=0;r<rounds;r++){
    const cnt=size/Math.pow(2,r+1);
    for(let i=0;i<cnt;i++){
      const m={ id:uid(), classId:cls.id, round:r, index:i,
        p1:null,p2:null, winner:null, score:"", day:null, court:null, time:null };
      if(r===0){ m.p1=slots[i*2]; m.p2=slots[i*2+1]; }
      cls.matches.push(m);
    }
  }
  cls.matches.push(...manuals);
  resolveByes(cls);
}
function matchOf(cls,r,i){ return cls.matches.find(m=>m.round===r&&m.index===i); }
// Skicka vinnaren till rätt plats i nästa omgång. Returnerar true om något ändrades.
function propagateSlot(cls,m){
  if(!m.winner) return false;
  const nr=m.round+1, ni=Math.floor(m.index/2), slot=m.index%2;
  const next=matchOf(cls,nr,ni);
  if(!next){ // finalen
    if(cls.champion!==m.winner){ cls.champion=m.winner; return true; }
    return false;
  }
  if(slot===0){ if(next.p1!==m.winner){ next.p1=m.winner; return true; } }
  else        { if(next.p2!==m.winner){ next.p2=m.winner; return true; } }
  return false;
}
// Iterativ upplösning: auto-vinst på BYE i omgång 0 + framåtflyttning av vinnare.
function resolveByes(cls){
  let changed=true, guard=0;
  while(changed && guard++<200){
    changed=false;
    for(const m of cls.matches){
      if(m.manual) continue;
      if(m.round===0 && !m.winner){
        if(m.p1!==null && m.p2===null){ m.winner=m.p1; m.score="WO"; changed=true; }
        else if(m.p2!==null && m.p1===null){ m.winner=m.p2; m.score="WO"; changed=true; }
      }
      if(m.winner && propagateSlot(cls,m)) changed=true;
    }
  }
}
function recompChampion(cls){
  cls.champion=null;
  const fm=cls.matches.find(x=>x.round===totalRounds(cls)-1);
  if(fm&&fm.winner) cls.champion=fm.winner;
}
function setWinner(cls,m,winner){
  m.winner=winner; m._wo=false;
  if(m.manual){ save(); render(); return; }   // manuell match: ingen stege-framflyttning
  clearDownstream(cls,m);   // ta bort ev. felaktig nedströms-placering
  resolveByes(cls);         // flytta vinnaren framåt -> nästa match blir spelklar
  recompChampion(cls);
  save(); render();
}
// Registrera/ändra resultat via vinnar-väljaren. key = 'p1' | 'p2' | '' (rensa).
function registerWinner(cls,m,key){
  if(key===""){                 // rensa vinnare
    m.winner=null;
    if(!m.manual){ clearDownstream(cls,m); resolveByes(cls); recompChampion(cls); }
    save(); render(); return;
  }
  setWinner(cls, m, key==="p1"?m.p1:m.p2);
}
function clearDownstream(cls,m){
  const nr=m.round+1, ni=Math.floor(m.index/2), slot=m.index%2;
  const next=matchOf(cls,nr,ni);
  if(!next) return;
  const cur = slot===0?next.p1:next.p2;
  // töm platsen och eventuell vinnare nedströms
  if(slot===0) next.p1=null; else next.p2=null;
  if(next.winner){ const w=next.winner; next.winner=null; next.score=""; clearDownstream(cls,next); }
}
function roundName(r,total){
  const fromEnd=total-1-r;
  if(fromEnd===0) return "Final";
  if(fromEnd===1) return "Semifinal";
  if(fromEnd===2) return "Kvartsfinal";
  return "Omgång "+(r+1);
}
function totalRounds(cls){
  const br=cls.matches.filter(m=>!m.manual);
  if(!br.length) return 0;
  return Math.max(...br.map(m=>m.round))+1;
}
function isReady(m){ return m.p1 && m.p2 && !m.winner; }
function isFinal(cls,m){ return !m.manual && m.round===totalRounds(cls)-1; }
// Skapa en manuell match (ej del av stegen) och placera den på dagen.
function createManualMatch(cls,p1,p2,day){
  const m={id:uid(),classId:cls.id,manual:true,round:null,index:null,
           p1,p2,winner:null,score:"",day:null,court:null,time:null};
  cls.matches.push(m);
  const res=manualPlace(m,day);
  if(!res.ok) alert(res.msg+' Matchen lades under "Ej schemalagda".');
  else if(res.warn) alert(res.warn);
  save(); render();
}
function deleteMatch(id){
  for(const c of state.classes){
    const i=c.matches.findIndex(x=>x.id===id);
    if(i>=0){ c.matches.splice(i,1); break; }
  }
  save(); render();
}

/* ----- Tab: Statistik ----- */
function renderStats(){
  const days=getDays(), classes=visibleClasses();
  if(!days.length){ app.innerHTML=`<div class="card"><h2>Statistik</h2><p class="muted">Ange turneringens datum under <b>Klasser &amp; deltagare</b> först.</p></div>`; return; }
  const all=realMatches();
  const schedOf=(cid,date)=> all.filter(m=>m.classId===cid && m.day===date).length;

  // Fördela klassens kvarvarande (oschemalagda) matcher jämnt över dagarna t.o.m. finalen.
  function suggestPerDay(cls){
    const arr=days.map(()=>0);
    const fd=cls.type==="youth"?youthFinalDay():adultFinalDay();
    const fi=days.findIndex(d=>d.date===fd);
    const D=fi<0?days.length:fi+1;
    const kvar=Math.max(0, realMatchCount(cls) - all.filter(m=>m.classId===cls.id && m.day).length);
    if(D<=0 || kvar<=0) return arr;
    const base=Math.floor(kvar/D), extra=kvar%D;
    for(let di=0; di<Math.min(D,days.length); di++) arr[di]=base + (di >= D-extra ? 1 : 0);
    return arr;
  }
  // 1) Matris kategori × dag (schemalagda matcher) + Kvar + förslag/dag (rött inom parentes)
  let colTot=days.map(()=>0), grand=0, tKvar=0;
  let rowsHtml="";
  classes.forEach(c=>{
    let rowTot=0, cells="";
    const sugg=suggestPerDay(c);
    days.forEach((d,di)=>{
      const n=schedOf(c.id,d.date); rowTot+=n; colTot[di]+=n;
      const s=sugg[di];
      cells+=`<td>${n||''}${s>0?` <span style="color:#c0392b;font-weight:700">(${s})</span>`:''}</td>`;
    });
    grand+=rowTot;
    const kvar=Math.max(0, realMatchCount(c) - rowTot); tKvar+=kvar;
    rowsHtml+=`<tr><td style="text-align:left"><span class="cdot" style="background:${classColor(c)}"></span>${c.name}</td>${cells}<td><b>${rowTot||''}</b></td><td><b>${kvar||''}</b></td></tr>`;
  });
  let html=`<div class="card"><h2>Matcher per kategori och dag (schemalagda)</h2>
    <p class="small muted">Antal schemalagda matcher per dag och kategori. <b>Kvar</b> = matcher kvar att schemalägga t.o.m. finalen.
    Röd siffra <span style="color:#c0392b;font-weight:700">(n)</span> = förslag på hur många kvarvarande matcher som bör läggas den dagen fram till finalen.</p>
    <div style="overflow-x:auto"><table class="results"><thead><tr><th style="text-align:left">Kategori</th>${days.map(d=>`<th>${d.dow.slice(0,3)}<br>${d.short}</th>`).join("")}<th>Totalt</th><th>Kvar</th></tr></thead><tbody>
    ${rowsHtml}
    <tr style="background:#faf6ec"><td style="text-align:left"><b>Totalt/dag</b></td>${colTot.map(n=>`<td><b>${n||''}</b></td>`).join("")}<td><b>${grand}</b></td><td><b>${tKvar||''}</b></td></tr>
    </tbody></table></div></div>`;

  // 2) Totalt i turneringen och per kategori
  let tPlay=0,tSched=0,tDone=0, r2="";
  classes.forEach(c=>{
    const play=realMatchCount(c);
    const s=all.filter(m=>m.classId===c.id && m.day).length;
    const done=all.filter(m=>m.classId===c.id && m.winner && m.p1 && m.p2 && !isByeMatch(m)).length;
    tPlay+=play;tSched+=s;tDone+=done;
    if(play>0||s>0) r2+=`<tr><td style="text-align:left"><span class="cdot" style="background:${classColor(c)}"></span>${c.name}</td><td>${play}</td><td>${s}</td><td>${done}</td><td>${Math.max(0,play-done)}</td></tr>`;
  });
  html+=`<div class="card"><h2>Antal matcher totalt</h2>
    <p class="small muted">"Att spela" = totalt antal matcher i kategorin (deltagare − 1 + manuella).</p>
    <table class="results"><thead><tr><th style="text-align:left">Kategori</th><th>Att spela</th><th>Schemalagda</th><th>Spelade</th><th>Kvar</th></tr></thead><tbody>
    ${r2}
    <tr style="background:#faf6ec"><td style="text-align:left"><b>Hela turneringen</b></td><td><b>${tPlay}</b></td><td><b>${tSched}</b></td><td><b>${tDone}</b></td><td><b>${Math.max(0,tPlay-tDone)}</b></td></tr>
    </tbody></table></div>`;

  // 3) Matcher/dag som krävs till finalerna
  let r3="";
  classes.forEach(c=>{
    const play=realMatchCount(c); if(play===0) return;
    const fd=c.type==="youth"?youthFinalDay():adultFinalDay();
    const idx=days.findIndex(d=>d.date===fd);
    const daysBefore=idx<0?days.length:idx;
    const beforeFinal=Math.max(0,play-1);
    const perDay=daysBefore>0?Math.ceil(beforeFinal/daysBefore):beforeFinal;
    r3+=`<tr><td style="text-align:left">${c.name}</td><td>${play}</td><td>${idx<0?'–':dayLong(fd)}</td><td>${daysBefore}</td><td><b>${perDay}</b></td></tr>`;
  });
  const totalDays=days.length;
  html+=`<div class="card"><h2>Matcher/dag som krävs till finalerna</h2>
    <p class="small muted">Antal matcher per dag (summa över alla banor) som behöver spelas för att hinna klart före respektive finaldag.</p>
    <table class="results"><thead><tr><th style="text-align:left">Kategori</th><th>Matcher totalt</th><th>Final</th><th>Dagar före final</th><th>Matcher/dag som krävs</th></tr></thead><tbody>
    ${r3}
    <tr style="background:#faf6ec"><td style="text-align:left"><b>Hela turneringen (snitt)</b></td><td><b>${tPlay}</b></td><td>–</td><td><b>${totalDays}</b></td><td><b>${totalDays>0?Math.ceil(tPlay/totalDays):tPlay}</b></td></tr>
    </tbody></table></div>`;

  app.innerHTML=html;
}

// Balanserad trädlayout: final centrerad, jämna avstånd, tydliga vinkellinjer.
function layoutBracketEl(br){
  if(!br) return {width:0,height:0};
  const COLW=210, HGAP=52, VGAP=14, HEADH=24;
  const byRound={};
  br.querySelectorAll('.match').forEach(el=>{ const r=+el.dataset.r,i=+el.dataset.i; (byRound[r]=byRound[r]||[])[i]=el; });
  const rounds=Object.keys(byRound).map(Number).sort((a,b)=>a-b);
  const maxR=rounds[rounds.length-1];
  // 1) sätt bredd, mät höjder
  let maxH=0;
  br.querySelectorAll('.match').forEach(el=>{ el.style.width=COLW+'px'; });
  br.querySelectorAll('.match').forEach(el=>{ maxH=Math.max(maxH, el.offsetHeight); });
  const rowUnit=maxH+VGAP;
  const n0=(byRound[0]||[]).filter(Boolean).length;
  // 2) beräkna vertikala centrum
  const centers={};
  (byRound[0]||[]).forEach((el,i)=>{ if(el) centers['0_'+i]=HEADH + i*rowUnit + rowUnit/2; });
  for(let r=1;r<=maxR;r++){
    (byRound[r]||[]).forEach((el,j)=>{
      if(!el) return;
      const a=centers[(r-1)+'_'+(2*j)], b=centers[(r-1)+'_'+(2*j+1)];
      centers[r+'_'+j] = (a!=null&&b!=null) ? (a+b)/2 : (a!=null?a : (b!=null?b : HEADH+rowUnit/2));
    });
  }
  // 3) positionera matcher (inline position så det funkar även i exporterad bild)
  rounds.forEach(r=>{
    (byRound[r]||[]).forEach((el,i)=>{
      if(!el) return;
      el.style.position='absolute'; el.style.zIndex='1';
      el.style.left=(r*(COLW+HGAP))+'px';
      el.style.top=Math.round(centers[r+'_'+i]-el.offsetHeight/2)+'px';
    });
  });
  // 4) rubriker
  br.querySelectorAll('.rhead').forEach(h=>{ const r=+h.dataset.rh; h.style.position='absolute'; h.style.left=(r*(COLW+HGAP))+'px'; h.style.top='0px'; h.style.width=COLW+'px'; });
  // 5) container-storlek
  const width=(maxR+1)*(COLW+HGAP)-HGAP;
  const height=HEADH + Math.max(1,n0)*rowUnit + 8;
  br.style.width=width+'px'; br.style.height=height+'px';
  // 6) linjer
  const ns='http://www.w3.org/2000/svg';
  const oldsvg=br.querySelector('svg.brlines'); if(oldsvg) oldsvg.remove();
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('class','brlines');
  svg.style.cssText=`position:absolute;left:0;top:0;width:${width}px;height:${height}px;pointer-events:none;z-index:0`;
  const L=(x1,y1,x2,y2)=>{ const l=document.createElementNS(ns,'line'); l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2); l.setAttribute('stroke','#b9b19a'); l.setAttribute('stroke-width','2'); svg.appendChild(l); };
  for(let r=1;r<=maxR;r++){
    (byRound[r]||[]).forEach((el,j)=>{
      if(!el) return;
      const px=r*(COLW+HGAP), py=centers[r+'_'+j];
      const fx=(r-1)*(COLW+HGAP)+COLW, midX=fx+HGAP/2;
      const f0=centers[(r-1)+'_'+(2*j)], f1=centers[(r-1)+'_'+(2*j+1)];
      if(f0!=null && f1!=null){
        L(fx,f0,midX,f0); L(fx,f1,midX,f1); L(midX,f0,midX,f1); L(midX,py,px,py);
      } else {
        const fy=(f0!=null?f0:f1); if(fy!=null){ L(fx,fy,px,py); }
      }
    });
  }
  br.insertBefore(svg, br.firstChild);
  return {width, height};
}
function matchHTML(cls,m,total){
  const sel=ui.swapSel;
  const slotHTML=(p,key)=>{
    let cl="slot", nm=dispName(p);
    if(p===null){ cl+= (m.round===0?" bye":" tbd"); nm=(m.round===0?"BYE":"– vinnare –"); }
    if(m.winner && p && m.winner===p) cl+=" win";
    if(sel && sel.id===m.id && sel.key===key) cl+=" swapsel";
    return `<div class="${cl}"><span class="nm" id="nm_${m.id}_${key}">${nm||""}</span>${m.winner===p?' 🏆':''}</div>`;
  };
  const sched = m.day?`<div class="sched-tag">${matchNoTag(m)}📅 ${dayShort(m.day)} · ${m.time!=null?matchLabel(m):'-'} · Bana ${m.court||'-'}</div>`
                     :(matchNumber(m)!=null?`<div class="sched-tag">${matchNoTag(m)}</div>`:"");
  return `<div class="match" data-r="${m.round}" data-i="${m.index}" style="border-left:5px solid ${classColor(cls)}">
     ${slotHTML(m.p1,"p1")}
     ${slotHTML(m.p2,"p2")}
     ${ (m.p1&&m.p2) ? `<div class="scorerow">
         <input type="text" id="sc_${m.id}" value="${m.score||''}" placeholder="ex. 6-3 6-4">
         <select id="win_${m.id}" class="winsel" title="Välj vinnare">
           <option value="">Vinnare?</option>
           <option value="p1" ${m.winner===m.p1?'selected':''}>${dispName(m.p1)}</option>
           <option value="p2" ${m.winner===m.p2?'selected':''}>${dispName(m.p2)}</option>
         </select>
       </div>`:""}
     ${sched}
   </div>`;
}
// Byt plats på två spelare i omgång 0 (inom samma klass).
function handleSwapClick(cls,m,slot){
  if(m.round!==0 || !m[slot]) return;            // endast riktiga spelare i första omgången
  if(!ui.swapSel){ ui.swapSel={id:m.id,key:slot}; render(); return; }
  if(ui.swapSel.id===m.id && ui.swapSel.key===slot){ ui.swapSel=null; render(); return; }
  const A=cls.matches.find(x=>x.id===ui.swapSel.id), aKey=ui.swapSel.key;
  if(!A){ ui.swapSel=null; render(); return; }
  const tmp=A[aKey]; A[aKey]=m[slot]; m[slot]=tmp;   // byt plats
  [A,m].forEach(x=>{ if(x.winner){ x.winner=null; x.score=""; } clearDownstream(cls,x); });
  ui.swapSel=null;
  resolveByes(cls); recompChampion(cls); save(); render();
}

function allMatches(){ return state.classes.flatMap(c=>c.matches.map(m=>({...m,_cls:c}))); }
function realMatches(){ // riktiga matchobjekt (inte kopior)
  return state.classes.flatMap(c=>c.matches);
}
function findMatch(id){ for(const c of state.classes){ const m=c.matches.find(x=>x.id===id); if(m) return {m,c}; } return null; }

function conflicts(day){
  // returnera set av match-id med bana/tid-krock, spelarkrock (samma tid) eller >3 matcher/dag
  const bad=new Set();
  const ms=realMatches().filter(m=>m.day===day && m.time!=null);
  // bana/tid-krock
  const seen={};
  for(const m of ms){ const k=m.time+"#"+m.court; if(seen[k]){ bad.add(m.id); bad.add(seen[k]); } else seen[k]=m.id; }
  // spelarkrock samma tid (samma person på två banor)
  const byTime={};
  for(const m of ms){ (byTime[m.time]=byTime[m.time]||[]).push(m); }
  for(const t in byTime){
    const pseen={};
    for(const m of byTime[t]) for(const p of playersOf(m)){
      if(pseen[p]){ bad.add(m.id); bad.add(pseen[p]); } else pseen[p]=m.id;
    }
  }
  // fler än 3 matcher samma dag för en person
  const cnt={};
  for(const m of ms) for(const p of playersOf(m)){ (cnt[p]=cnt[p]||[]).push(m.id); }
  for(const p in cnt){ if(cnt[p].length>3) cnt[p].forEach(id=>bad.add(id)); }
  return bad;
}
// Hur många matcher en av matchens spelare redan har den dagen (exkl. matchen själv).
function playerDayCount(day,m){
  const ps=playersOf(m); let mx=0;
  for(const p of ps){
    const c=realMatches().filter(x=>x.day===day&&x.id!==m.id&&x.time!=null&&playersOf(x).includes(p)).length;
    if(c>mx) mx=c;
  }
  return mx;
}
// Spelar någon i matchen redan på tiden t den dagen (annan bana)?
function sameTimeBusy(day,t,m){
  const ps=playersOf(m);
  return realMatches().some(x=>x.day===day&&x.time===t&&x.id!==m.id&&x.time!=null&&
     playersOf(x).some(p=>ps.includes(p)));
}

// Sök i schemat: matcha klassnamn eller deltagarnamn, vald dag eller hela schemat.
function renderSchedSearch(){
  const box=document.getElementById("schedSearchRes"); if(!box) return;
  const q=(ui.schedSearch||"").trim().toLowerCase();
  if(!q){ box.innerHTML=""; return; }
  const scopeAll = ui.schedScope==='all';
  const hits=[];
  for(const c of state.classes) for(const m of c.matches){
    if(!m.day) continue;                          // endast schemalagda matcher
    if(!scopeAll && m.day!==ui.day) continue;
    const clsHit=c.name.toLowerCase().includes(q);
    const plHit=playersOf(m).some(p=>p.toLowerCase().includes(q));
    if(clsHit||plHit) hits.push({m,c});
  }
  hits.sort((a,b)=>{ const da=a.m.day, db=b.m.day; return da<db?-1:da>db?1:((a.m.time||0)-(b.m.time||0)); });
  if(!hits.length){ box.innerHTML=`<p class="small muted" style="margin:10px 0 0">Inga matcher matchar "${ui.schedSearch}" ${scopeAll?'i hela schemat':'på '+dayShort(ui.day)}.</p>`; return; }
  const played=hits.filter(h=>h.m.winner), upcoming=hits.filter(h=>!h.m.winner);
  const table=(list,title)=>{

    let h=`<h3 style="margin:12px 0 4px">${title} <span class="small muted">(${list.length})</span></h3>

    for(const {m,c} of list){

      h+=`<tr><td>${matchNumber(m)??'-'}</td><td><span class="cdot" style="background:${classColor(c)}"></span>${c.name}</td>
        <td>${dayShort(m.day)}</td><td>${m.time!=null?matchLabel(m):'-'}</td><td>${m.court||'-'}</td>
        <td>${vs}</td><td>${m.winner?`<b>${m.score||'WO'}</b> 🏆 ${dispName(m.winner)}`:''}</td></tr>`;
    }
    return h+`</tbody></table>`;
  };
  box.innerHTML = table(upcoming,"Kommande/ospelade") + table(played,"Spelade (med resultat)");
}
function dayTimes(day){
  return [...new Set([...daySlots(day),
     ...realMatches().filter(m=>m.day===day&&m.time!=null).map(m=>m.time)])].sort((a,b)=>a-b);
}
// Hela manuella rutnätet 08:00–21:00 (30 min-steg) + ev. schemalagda tider.
function fullDayTimes(day){
  const out=[]; for(let t=480;t<=1260;t+=30) out.push(t);
  return [...new Set([...out,
     ...realMatches().filter(m=>m.day===day&&m.time!=null).map(m=>m.time)])].sort((a,b)=>a-b);
}
function renderSchedGrid(){
  const wrap=document.getElementById("schedWrap");

  const used=state.classes.filter(c=>c.matches.length);

    : "";

     Array.from({length:courts},(_,i)=>`<th>Bana ${i+1}</th>`).join("")}</tr></thead><tbody>`;
  let prevEnd=null;
  for(const t of times){
    // Visa paus-/lunchluckor i normalläge (i "visa alla tider" är alla rader redan med).
    if(!ui.fullGrid && prevEnd!=null && t>prevEnd){
      const isLunch = prevEnd<780 && t>=780;               // luckan täcker 12–13
      const cl = isLunch ? 'lunch' : 'pausrow';
      const txt= isLunch ? '🍽 Lunchpaus' : '⏸ Paus – ledig lucka (kan schemaläggas manuellt)';
      html+=`<tr><td class="time">${fmtMin(prevEnd)}–${fmtMin(t)}</td><td class="${cl}" colspan="${courts}">${txt}</td></tr>`;
    }
    const lunchRow = ui.fullGrid && (t===720 || t===750);
    html+=`<tr><td class="time">${timeLabel(t, day)}${lunchRow?' 🍽':''}</td>`;
    for(let ct=1;ct<=courts;ct++){

    }
    html+=`</tr>`;
    prevEnd = Math.max(prevEnd||0, t + slotDur(t, day));
  }
  html+=`</tbody></table>`;
  wrap.innerHTML=legend+html;
  bindTileCtrls();
}

/* ----- Schemaläggning ----- */
function dayHasFinalsAllowed(cls,m,day){
  if(!isFinal(cls,m)) return true;
  return cls.type==="youth" ? day===youthFinalDay() : day===adultFinalDay();
}
// Auto: ungdom endast vardagar; senior alla dagar.
function canPlayDayAuto(cls,day){ return cls.type==="youth" ? youthAllowedAuto(day) : true; }
// Försök placera m på dagen. opts.manual = strunta i veckodagsregeln (men varna ej här).
// opts.requireUnused = placera bara om ingen av spelarna redan spelar den dagen.
function placeMatch(m,day,opts={}){
  const cls=getClass(m.classId);
  if(!opts.manual && !canPlayDayAuto(cls,day)) return false;
  if(playerDayCount(day,m) >= 3) return false;                  // max 3 matcher/dag/person
  if(opts.requireUnused && playerDayCount(day,m) > 0) return false;
  const courts=courtsForDay(day);
  for(const t of slotsFor(cls.type, day)){
    if(sameTimeBusy(day,t,m)) continue;                         // ej samma tid på annan bana
    for(let ct=1;ct<=courts;ct++){
      if(realMatches().some(x=>x.day===day&&x.time===t&&x.court===ct&&x.id!==m.id)) continue;
      m.day=day; m.court=ct; m.time=t; return true;
    }
  }
  return false;
}
// Manuell placering (via knappar): tillåt flera matcher/dag (max 3), varna vid avvikelse.
function manualPlace(m,day){
  const cls=getClass(m.classId);
  if(playerDayCount(day,m) >= 3)
    return {ok:false, msg:"En av spelarna har redan 3 matcher den dagen (max 3 tillåts)."};
  if(!placeMatch(m,day,{manual:true}))
    return {ok:false, msg:`Ingen ledig tid på ${dayShort(day)} (banor upptagna eller spelarkrock vid alla tider).`};
  let warn="";
  if(cls.type==="youth" && isWeekend(day))
    warn="Obs: ungdomsklass schemalagd på helg – normalt spelar endast seniorer lör/sön.";
  return {ok:true, warn};
}
// Är alla matcher i en omgång färdigspelade (byes räknas som klara)?
function roundComplete(cls,r){
  const ms=cls.matches.filter(m=>m.round===r);
  return ms.length>0 && ms.every(m=>m.winner);
}
// Auto: spela klart en hel omgång i klassen innan nästa omgång schemaläggs
// (kan stängas av via "Tillåt senare omgångar" i Schema-fliken).
function roundReadyForAuto(cls,m){
  if(state.allowEarlyRounds) return true;
  if(m.manual || m.round===0) return true;
  return roundComplete(cls, m.round-1);
}
function generateDay(day){
  const sortFn=(a,b)=>((a.round==null?99:a.round)-(b.round==null?99:b.round));
  const ok=(m,cls)=>!cls.hidden && dayHasFinalsAllowed(cls,m,day) && canPlayDayAuto(cls,day) && roundReadyForAuto(cls,m);
  // Pass 1: prioritera matcher där ingen spelare redan spelar den dagen (undvik flera/dag).
  realMatches().filter(m=>isReady(m)&&!m.day).sort(sortFn).forEach(m=>{
    const cls=getClass(m.classId);
    if(ok(m,cls)) placeMatch(m,day,{requireUnused:true});
  });
  // Pass 2: fyll resten (upp till 3 matcher/dag/person).
  realMatches().filter(m=>isReady(m)&&!m.day).sort(sortFn).forEach(m=>{
    const cls=getClass(m.classId);
    if(ok(m,cls)) placeMatch(m,day);
  });
}

/* ----- Tab: Deltagarlista (per person, utifrån namn) ----- */
function participantIndex(filterId){
  const map=new Map(); // namn -> Set(klassnamn)
  const classes = filterId ? state.classes.filter(c=>c.id===filterId) : visibleClasses();
  for(const c of classes){
    for(const line of c.participants){
      for(const part of String(line).split("/")){
        const nm=stripRank(part);
        if(!nm) continue;
        if(!map.has(nm)) map.set(nm,new Set());
        map.get(nm).add(c.name);
      }
    }
  }
  return [...map.entries()]
    .map(([name,set])=>({name, classes:[...set]}))
    .sort((a,b)=> a.name.localeCompare(b.name,"sv"));
}
// Byt ut ett individnamn i en sträng (dubbelpar delas på "/"), behåll ev. rank "(n)".
function replaceIndivName(str, oldName, newName){
  if(str==null) return str;
  return String(str).split("/").map(part=>{
    const t=part.trim();
    const rm=t.match(/\s*(\(\d+\))\s*$/);
    const rank=rm?(" "+rm[1]):"";
    return stripRank(t)===oldName ? (newName+rank) : t;
  }).join(" / ");
}
// Döp om en spelare överallt: deltagarlistor, matcher, vinnare, mästare.
function renamePlayer(oldName,newName){
  oldName=(oldName||"").trim(); newName=(newName||"").trim();
  if(!newName || oldName===newName) return;
  for(const c of state.classes){
    c.participants=c.participants.map(p=>replaceIndivName(p,oldName,newName));
    for(const m of c.matches){
      m.p1=replaceIndivName(m.p1,oldName,newName);
      m.p2=replaceIndivName(m.p2,oldName,newName);
      if(m.winner) m.winner=replaceIndivName(m.winner,oldName,newName);
    }
    if(c.champion) c.champion=replaceIndivName(c.champion,oldName,newName);
  }
  save(); render();
}
// Alla riktiga matcher där en person deltar – inkl. matcher där motståndaren
// ännu inte är klar (t.ex. seedad spelare i omgång 2 som väntar på vinnare).
function playerMatches(name, filterId){
  const res=[];
  const classes = filterId ? state.classes.filter(c=>c.id===filterId) : visibleClasses();
  for(const c of classes) for(const m of c.matches){
    if((m.p1 || m.p2) && !isByeMatch(m) && playersOf(m).includes(name)) res.push({m,c});
  }
  return res.sort((a,b)=>{
    const da=(a.m.day||"9"), db=(b.m.day||"9");
    return da<db?-1:da>db?1:((a.m.time||0)-(b.m.time||0));
  });
}
function renderParticipants(){
  const fid=ui.partClass||"";
  const fcls=fid?getClass(fid):null;
  const idx=participantIndex(fid);
  const q=(ui.playerSearch||"").trim().toLowerCase();

       <span class="pill">${idx.length} personer${fcls?` i ${fcls.name}`:''}</span>

    si.oninput=e=>{ ui.playerSearch=e.target.value; ui._sf=true; render(); };
    if(ui._sf){ const el=document.getElementById("playerSearch"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } ui._sf=false; }
    const clr=document.getElementById("clrSearch"); if(clr) clr.onclick=()=>{ ui.playerSearch=""; render(); };
    document.getElementById("printParts").onclick=()=>printParticipants(fid);

  };
  if(!idx.length){
    html+=`<div class="card"><p class="muted">Inga deltagare ${fcls?`i <b>${fcls.name}</b>`:'inlagda ännu'}. Lägg in deltagare under <b>Klasser & deltagare</b>.</p></div>`;
    app.innerHTML=html; bindTop(); return;
  }
  // Sökresultat: matchande deltagares inplanerade matcher
  if(q){
    const matched=idx.filter(r=>r.name.toLowerCase().includes(q));
    html+=`<div class="card"><h2>Sökresultat${fcls?` i ${fcls.name}`:''}</h2>`;
    if(!matched.length) html+=`<p class="muted">Ingen deltagare matchar "${ui.playerSearch}".</p>`;
    for(const r of matched){
      const pm=playerMatches(r.name, fid);
      html+=`<h3 style="margin:14px 0 4px">${r.name} <span class="small muted">(${r.classes.join(", ")})</span></h3>`;
      if(!pm.length){ html+=`<p class="small muted">Inga matcher.</p>`; continue; }
      html+=`<table class="results"><thead><tr><th>Nr</th><th>Klass</th><th>Dag</th><th>Tid</th><th>Bana</th><th>Motstånd</th><th>Resultat</th></tr></thead><tbody>`;
      for(const {m,c} of pm){
        const vs=`${dispName(m.p1)||'<i style="color:#b3aa98">väntar på motståndare</i>'} – ${dispName(m.p2)||'<i style="color:#b3aa98">väntar på motståndare</i>'}`;
        html+=`<tr><td>${matchNumber(m)??'-'}</td><td><span class="cdot" style="background:${classColor(c)}"></span>${c.name} <span class="small muted">(${m.manual?'manuell':roundName(m.round,totalRounds(c))})</span></td>
          <td>${m.day?dayShort(m.day):'<i>ej schemalagd</i>'}</td><td>${m.time!=null?matchLabel(m):'-'}</td><td>${m.court||'-'}</td>
          <td>${vs}</td><td>${m.winner?`${m.score||'WO'} (🏆 ${dispName(m.winner)})`:''}</td></tr>`;
      }
      html+=`</tbody></table>`;
    }
    html+=`</div>`;

  // Full lista med byt-namn
  html+=`<div class="card"><table class="results"><thead>
     <tr><th>Namn</th><th>${fcls?'Klass':'Antal klasser'}</th><th>${fcls?'':'Klasser'}</th><th class="no-print"></th></tr></thead><tbody>`;

    html+=`<tr><td>${r.name}</td><td>${fcls?r.classes.join(", "):r.classes.length}</td><td>${fcls?'':r.classes.join(", ")}</td>

      <button class="btn ghost mini" data-find="${r.name.replace(/"/g,'&quot;')}">🔎 Matcher</button></td></tr>`;
  html+=`</tbody></table></div>`;
  app.innerHTML=html;
  bindTop();
  document.querySelectorAll("[data-rename]").forEach(b=>b.onclick=()=>{
    const old=b.dataset.rename;
    const nn=prompt(`Byt namn på "${old}" – nytt namn (uppdateras i alla klasser, stegar, schema och resultat):`, old);
    if(nn && nn.trim() && nn.trim()!==old) renamePlayer(old, nn.trim());

function resultsHTML(day){
  const played=realMatches().filter(m=>m.day===day&&m.winner&&m.p1&&m.p2);
  const upcoming=realMatches().filter(m=>m.day===day&&!m.winner&&m.p1&&m.p2);
  let h=`<div class="card"><h2>Resultat – ${dayShort(day)}</h2>`;
  if(!played.length) h+=`<p class="muted">Inga färdigspelade matcher registrerade denna dag.</p>`;
  else{
    h+=`<table class="results"><thead><tr><th>Nr</th><th>Tid</th><th>Bana</th><th>Klass</th><th>Match</th><th>Resultat</th><th>Vinnare</th></tr></thead><tbody>`;
    played.sort((a,b)=>(a.time||0)-(b.time||0)).forEach(m=>{
      const c=getClass(m.classId);
      h+=`<tr><td>${matchNumber(m)??'-'}</td><td>${m.time!=null?matchLabel(m):'-'}</td><td>${m.court||'-'}</td><td>${c.name}</td>
        <td>${dispName(m.p1)} – ${dispName(m.p2)}</td><td>${m.score||'WO'}</td><td><b>${dispName(m.winner)}</b></td></tr>`;
    });
    h+=`</tbody></table>`;
  }
  h+=`</div>`;
  if(upcoming.length){
    h+=`<div class="card"><h2>Ospelade matcher kvar denna dag</h2><table class="results"><tbody>`;
    upcoming.sort((a,b)=>(a.time||0)-(b.time||0)).forEach(m=>{
      const c=getClass(m.classId);
      h+=`<tr><td>${matchNumber(m)??'-'}</td><td>${m.time!=null?matchLabel(m):'-'}</td><td>Bana ${m.court||'-'}</td><td>${c.name}</td><td>${dispName(m.p1)} – ${dispName(m.p2)}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
  }
  return h;
}

function printBlankSchedule(){

  html+=`<table class="schedtable" style="width:100%"><thead><tr><th style="width:120px">Tid</th>${

    if(!lunchShown && t>=780){ html+=`<tr><td class="time">12:00–13:00</td><td colspan="${courts}" style="text-align:center">Lunchpaus</td></tr>`; lunchShown=true; }

  doPrint(printHeader("Resultatlista – "+dayLong(day))+resultsHTML(day));
}
function printSchedule(day){
  const courts=courtsForDay(day);
  let html=printHeader("Matchschema – "+dayLong(day));
  html+=`<table class="schedtable" style="width:100%"><thead><tr><th>Tid</th>${
     Array.from({length:courts},(_,i)=>`<th>Bana ${i+1}</th>`).join("")}</tr></thead><tbody>`;
  let prevEnd=null;
  for(const t of dayTimes(day)){
    if(prevEnd!=null && t>prevEnd){
      const isLunch = prevEnd<780 && t>=780;
      html+=`<tr><td class="time">${fmtMin(prevEnd)}–${fmtMin(t)}</td><td colspan="${courts}" style="text-align:center;color:#888;font-style:italic">${isLunch?'Lunchpaus':'Paus'}</td></tr>`;
    }
    html+=`<tr><td class="time">${timeLabel(t, day)}</td>`;
    for(let ct=1;ct<=courts;ct++){
      const here=realMatches().filter(m=>m.day===day&&m.time===t&&m.court===ct);
      html+=`<td>${here.map(m=>{const c=getClass(m.classId);const n=matchNumber(m);return `<div style="border-left:5px solid ${classColor(c)};padding-left:5px;margin:2px 0">${n!=null?`<b>#${n}</b> `:''}<b>${c.name}</b><br>${dispName(m.p1)} – ${dispName(m.p2)}${isFinal(c,m)?' <i>(final)</i>':''}</div>`;}).join("")}</td>`;
    }
    html+=`</tr>`;
    prevEnd = Math.max(prevEnd||0, t + slotDur(t, day));
  }
  html+=`</tbody></table>`;
  doPrint(html);
}
/* ----- Utskrift av stege som träd (en liggande A4 per klass, skalad att passa) ----- */
function printBracketBox(cls,m){
  const rowh=(p,win)=>`<div style="padding:4px 7px;border-bottom:1px solid #ddd;${win?'font-weight:800;color:#2e7d32':''}">${p==null?(m.round===0?'BYE':'—'):dispName(p)}${win?' 🏆':''}</div>`;
  const n=matchNumber(m);
  return `<div class="match" data-r="${m.round}" data-i="${m.index}" style="border:1px solid #bbb;border-left:5px solid ${classColor(cls)};border-radius:6px;background:#fff">
     ${n!=null?`<div style="font-size:10px;font-weight:700;color:#6b6356;padding:2px 7px 0">#${n}</div>`:''}
     ${rowh(m.p1, m.winner&&m.winner===m.p1)}
     ${rowh(m.p2, m.winner&&m.winner===m.p2)}
     ${m.score?`<div style="padding:2px 7px;font-size:11px;color:#555;background:#faf6ec">${m.score}</div>`:''}
   </div>`;
}
function buildPrintBracket(cls){
  const total=totalRounds(cls);
  let html=`<div class="bracket" style="position:relative">`;
  for(let r=0;r<total;r++) html+=`<div class="rhead" data-rh="${r}" style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#6b6356;text-align:center;font-weight:700">${roundName(r,total)}</div>`;
  html+=`<div class="rhead" data-rh="${total}" style="font-size:12px;text-align:center;font-weight:700;color:#6b6356">MÄSTARE</div>`;
  for(let r=0;r<total;r++) cls.matches.filter(m=>m.round===r).sort((a,b)=>a.index-b.index).forEach(m=>{ html+=printBracketBox(cls,m); });
  html+=`<div class="match champbox" data-r="${total}" data-i="0" style="border:2px solid ${classColor(cls)};border-radius:8px;text-align:center;padding:12px;background:#fff">
       <div style="font-size:10px;letter-spacing:2px;color:#8a6d00">🏆 KLUBBMÄSTARE</div>
       <div style="font-size:16px;font-weight:800;margin-top:4px">${dispName(cls.champion)||'–'}</div></div>`;
  html+=`</div>`;
  return html;
}
function printBracketPages(list){
  const PAGE_W=1040, PAGE_H=730, TITLE_H=30;   // ungefärlig utskriftsyta för A4 liggande (px)
  const withBr=list.filter(c=>totalRounds(c));
  if(!withBr.length){ alert("Ingen stege att skriva ut – bygg en stege först."); return; }
  let pages="";
  for(const cls of withBr){
    const meas=document.createElement("div");
    meas.style.cssText="position:fixed;left:-20000px;top:0";
    meas.innerHTML=buildPrintBracket(cls);
    document.body.appendChild(meas);
    const brEl=meas.querySelector(".bracket");
    const size=layoutBracketEl(brEl);
    const natW=size.width||brEl.scrollWidth, natH=size.height||brEl.scrollHeight;
    const inner=brEl.outerHTML;
    document.body.removeChild(meas);
    const scale=Math.min(PAGE_W/natW, (PAGE_H-TITLE_H)/natH);
    const offX=Math.max(0,(PAGE_W - natW*scale)/2);
    pages+=`<div class="brpage">
       <div style="font-family:'Arial Narrow',Arial;color:#b5362b;font-weight:bold;font-size:15px;padding:0 0 6px">Dalarö TK · KM ${tournamentYear()} · Stege – ${cls.name}${cls.champion?` · 🏆 ${dispName(cls.champion)}`:''}</div>
       <div style="position:relative;height:${PAGE_H-TITLE_H}px"><div style="position:absolute;left:${Math.round(offX)}px;top:0;transform:scale(${scale});transform-origin:top left">${inner}</div></div>
     </div>`;
  }
  document.getElementById("printArea").innerHTML=pages;
  window.print();
}
function printOneBracket(cls){ printBracketPages([cls]); }   // stege-fliken
function printBrackets(){ printBracketPages(visibleClasses()); } // "Skriv ut alla stegar"

// Spara en blob på plats användaren väljer (File System Access API) – annars nedladdning.
async function saveBlob(blob, filename){
  if(window.showSaveFilePicker){
    try{
      const ext=filename.split('.').pop();
      const handle=await window.showSaveFilePicker({ suggestedName:filename,
        types:[{description:'Bild', accept:{ ['image/'+(ext==='jpg'?'jpeg':ext)]:['.'+ext] }}] });
      const w=await handle.createWritable(); await w.write(blob); await w.close(); return true;
    }catch(e){ if(e && e.name==='AbortError') return false; /* faller igenom till nedladdning */ }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500); return true;
}
function escXml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function svgText(x,y,txt,o={}){
  return `<text x="${x}" y="${y}" font-family="Arial,Helvetica,sans-serif" font-size="${o.size||13}"`+
    `${o.weight?` font-weight="${o.weight}"`:''}${o.anchor?` text-anchor="${o.anchor}"`:''} fill="${o.fill||'#26211c'}">${escXml(txt)}</text>`;
}
function truncStr(s,n){ s=String(s); return s.length>n ? s.slice(0,n-1)+'…' : s; }
// Bygg stegen som REN SVG (rutor/text/linjer) – rasteriseras utan taint.
function buildBracketSVG(cls){
  const total=totalRounds(cls);
  const COLW=210, HGAP=52, VGAP=16, HEADH=26, CHAMP_H=64, col=classColor(cls);
  const byRound={};
  for(let r=0;r<total;r++) byRound[r]=cls.matches.filter(m=>m.round===r).sort((a,b)=>a.index-b.index);
  const maxR=total;
  const boxInfo=m=>{ const hasNum=matchNumber(m)!=null, hasScore=!!m.score;
    return { hasNum, hasScore, h: 8 + (hasNum?15:0) + 22 + 22 + (hasScore?16:0) }; };
  let maxH=CHAMP_H;
  for(let r=0;r<total;r++) for(const m of byRound[r]) maxH=Math.max(maxH, boxInfo(m).h);
  const rowUnit=maxH+VGAP, n0=byRound[0].length;
  const centers={};
  byRound[0].forEach((m,i)=>{ centers['0_'+i]=HEADH + i*rowUnit + rowUnit/2; });
  for(let r=1;r<total;r++) byRound[r].forEach((m,j)=>{
    const a=centers[(r-1)+'_'+(2*j)], b=centers[(r-1)+'_'+(2*j+1)];
    centers[r+'_'+j]=(a!=null&&b!=null)?(a+b)/2:(a!=null?a:(b!=null?b:HEADH+rowUnit/2));
  });
  centers[maxR+'_0']= byRound[total-1].length? centers[(total-1)+'_0'] : HEADH+rowUnit/2;
  const width=(maxR+1)*(COLW+HGAP)-HGAP, height=HEADH + n0*rowUnit + 8;
  let body="";
  // linjer
  for(let r=1;r<total;r++) byRound[r].forEach((m,j)=>{
    const px=r*(COLW+HGAP), py=centers[r+'_'+j], fx=(r-1)*(COLW+HGAP)+COLW, midX=fx+HGAP/2;
    const f0=centers[(r-1)+'_'+(2*j)], f1=centers[(r-1)+'_'+(2*j+1)];
    const L=(x1,y1,x2,y2)=>{ body+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#b9b19a" stroke-width="2"/>`; };
    if(f0!=null&&f1!=null){ L(fx,f0,midX,f0); L(fx,f1,midX,f1); L(midX,f0,midX,f1); L(midX,py,px,py); }
    else { const fy=f0!=null?f0:f1; if(fy!=null) L(fx,fy,px,py); }
  });
  { const r=maxR, px=r*(COLW+HGAP), py=centers[maxR+'_0'], fx=(r-1)*(COLW+HGAP)+COLW, fy=centers[(total-1)+'_0'];
    if(fy!=null) body+=`<line x1="${fx}" y1="${fy}" x2="${px}" y2="${py}" stroke="#b9b19a" stroke-width="2"/>`; }
  // rubriker
  for(let r=0;r<total;r++) body+=svgText(r*(COLW+HGAP)+COLW/2, 14, roundName(r,total).toUpperCase(), {size:11,weight:'bold',fill:'#6b6356',anchor:'middle'});
  body+=svgText(maxR*(COLW+HGAP)+COLW/2, 14, 'MÄSTARE', {size:11,weight:'bold',fill:'#6b6356',anchor:'middle'});
  // matchrutor
  for(let r=0;r<total;r++) byRound[r].forEach((m,i)=>{
    const x=r*(COLW+HGAP), bi=boxInfo(m), h=bi.h, top=Math.round(centers[r+'_'+i]-h/2);
    body+=`<rect x="${x}" y="${top}" width="${COLW}" height="${h}" rx="6" fill="#fff" stroke="#bbb"/>`;
    body+=`<rect x="${x}" y="${top}" width="5" height="${h}" fill="${col}"/>`;
    let yy=top+4;
    if(bi.hasNum){ yy+=12; body+=svgText(x+9, yy, '#'+matchNumber(m), {size:10,weight:'bold',fill:'#6b6356'}); yy+=3; }
    const p1w=m.winner&&m.winner===m.p1, p2w=m.winner&&m.winner===m.p2;
    yy+=16; body+=svgText(x+9, yy, (m.p1==null?(m.round===0?'BYE':'—'):truncStr(dispName(m.p1),26))+(p1w?' 🏆':''), {size:13,weight:p1w?'bold':'normal',fill:p1w?'#2e7d32':'#26211c'});
    yy+=5; body+=`<line x1="${x+2}" y1="${yy}" x2="${x+COLW-2}" y2="${yy}" stroke="#eee"/>`;
    yy+=17; body+=svgText(x+9, yy, (m.p2==null?(m.round===0?'BYE':'—'):truncStr(dispName(m.p2),26))+(p2w?' 🏆':''), {size:13,weight:p2w?'bold':'normal',fill:p2w?'#2e7d32':'#26211c'});
    if(bi.hasScore){ yy+=15; body+=svgText(x+9, yy, m.score, {size:11,fill:'#555'}); }
  });
  // mästar-box
  { const x=maxR*(COLW+HGAP), cy=centers[maxR+'_0'], top=Math.round(cy-CHAMP_H/2);
    body+=`<rect x="${x}" y="${top}" width="${COLW}" height="${CHAMP_H}" rx="8" fill="#fff" stroke="${col}" stroke-width="2"/>`;
    body+=svgText(x+COLW/2, top+24, '🏆 KLUBBMÄSTARE', {size:10,fill:'#8a6d00',anchor:'middle'});
    body+=svgText(x+COLW/2, top+47, dispName(cls.champion)||'–', {size:16,weight:'bold',anchor:'middle'});
  }
  return {body, width, height};
}
// Skapa en PNG-bild av den valda stegen och spara där användaren väljer.
function exportBracketImage(cls){
  if(!totalRounds(cls)){ alert("Stegen är tom – bygg den först."); return; }
  const PAD=20, TITLE_H=36, SCALE=2;
  const {body, width, height}=buildBracketSVG(cls);
  const W=width+PAD*2, H=height+TITLE_H+PAD;
  const title=`Dalarö TK · KM ${tournamentYear()} · ${cls.name}${cls.champion?' · 🏆 '+dispName(cls.champion):''}`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}">`+
    `<rect width="100%" height="100%" fill="#ffffff"/>`+
    `<text x="${PAD}" y="26" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#b5362b">${escXml(title)}</text>`+
    `<g transform="translate(${PAD},${TITLE_H})">${body}</g></svg>`;
  const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml;charset=utf-8"}));
  const img=new Image();
  img.onload=()=>{
    try{
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(W*SCALE); canvas.height=Math.round(H*SCALE);
      const ctx=canvas.getContext("2d");
      ctx.setTransform(SCALE,0,0,SCALE,0,0);
      ctx.drawImage(img,0,0);
      URL.revokeObjectURL(url);
      canvas.toBlob(b=>{
        if(!b){ alert("Kunde inte skapa bilden."); return; }
        const p=n=>String(n).padStart(2,"0"), d=new Date();
        const stamp=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}`;
        saveBlob(b, `Stege-${cls.name.replace(/[^\wåäöÅÄÖ -]/g,'').trim()}-${stamp}.png`);
      }, "image/png");
    }catch(err){ URL.revokeObjectURL(url); alert("Kunde inte skapa bilden: "+err.message); }
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); alert("Kunde inte rendera stegen till bild."); };
  img.src=url;
}

/* ----- Toolbar / export / import ----- */
document.getElementById("courtsInput").onchange=e=>{
  let v=parseInt(e.target.value,10); if(isNaN(v)||v<1)v=1; if(v>8)v=8;
  state.courts=v; save(); render();
};
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  const p=n=>String(n).padStart(2,"0"), d=new Date();
  const stamp=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}`;
  a.download=`DalaroKM-backup-${stamp}.json`;   // t.ex. DalaroKM-backup-2026-07-04_14-30.json
  a.click();
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ state=normalize(JSON.parse(r.result)); save(); ui.classId=state.classes[0].id; ensureDay(); render(); alert("Importerat!"); }
    catch(err){ alert("Kunde inte läsa filen."); } };
  r.readAsText(f);
};
