<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <title>Personal Gym Coach</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Personal Gym Coach</h1>
      <p class="subtitle">Din personliga gymcoach</p>
      <div class="profile-bar" id="profile-bar"></div>
    </header>

    <section class="form-section">

      <div class="form-group">
        <label>Typ av träning <span class="label-hint">(välj en eller flera)</span></label>
        <div class="type-grid">
          <button class="type-btn active" data-type="vikter">
            <span class="type-icon">🏋️</span>
            <span>Vikter</span>
          </button>
          <button class="type-btn" data-type="kropp">
            <span class="type-icon">💪</span>
            <span>Kropp</span>
          </button>
          <button class="type-btn" data-type="kondition">
            <span class="type-icon">🏃</span>
            <span>Kondition</span>
          </button>
          <button class="type-btn" data-type="rorlighet">
            <span class="type-icon">🧘</span>
            <span>Rörlighet</span>
          </button>
          <button class="type-btn" data-type="core">
            <span class="type-icon">⚡</span>
            <span>Core</span>
          </button>
          <button class="type-btn" data-type="tennis">
            <span class="type-icon">🎾</span>
            <span>Tennis</span>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Passlängd <span class="label-hint">(anpassar set/reps till din tid)</span></label>
        <div class="duration-grid">
          <button class="duration-btn" data-duration="15">15 min</button>
          <button class="duration-btn" data-duration="30">30 min</button>
          <button class="duration-btn" data-duration="45">45 min</button>
          <button class="duration-btn" data-duration="60">60 min</button>
          <button class="duration-btn" data-duration="90">90 min</button>
        </div>
      </div>

      <div class="divider">
        <span>eller ange manuellt</span>
      </div>

      <div class="form-group">
        <label>Fokusområde <span class="label-hint">(valfritt – välj en eller flera)</span></label>
        <div class="focus-grid">
          <button class="focus-btn" data-focus="helkropp">Helkropp</button>
          <button class="focus-btn" data-focus="överkropp">Överkropp</button>
          <button class="focus-btn" data-focus="underkropp">Underkropp</button>
          <button class="focus-btn" data-focus="mage-rygg">Mage/Rygg</button>
        </div>
        <div class="focus-sep"></div>
        <div class="focus-grid">
          <button class="focus-btn" data-focus="bröst">Bröst</button>
          <button class="focus-btn" data-focus="rygg">Rygg</button>
          <button class="focus-btn" data-focus="axlar">Axlar</button>
          <button class="focus-btn" data-focus="armar">Armar</button>
          <button class="focus-btn" data-focus="lår">Lår</button>
          <button class="focus-btn" data-focus="rumpa">Rumpa</button>
          <button class="focus-btn" data-focus="vader">Vader</button>
          <button class="focus-btn" data-focus="mage">Mage</button>
        </div>
      </div>

      <div class="form-group">
        <label for="exercise-count">Antal övningar</label>
        <input
          type="number"
          id="exercise-count"
          min="1"
          max="30"
          value="8"
          placeholder="1–30"
          inputmode="numeric"
          autocomplete="off"
        />
        <p class="count-hint" id="count-hint"></p>
      </div>

      <button class="generate-btn" id="generate-btn">Generera träningspass</button>
    </section>

    <section class="results-section" id="results" style="display:none">
      <div class="results-header">
        <h2 id="results-title">Ditt träningspass</h2>
        <button class="regenerate-btn" id="regenerate-btn">Ny variation</button>
      </div>
      <div class="exercise-list" id="exercise-list"></div>
      <div class="summary" id="summary"></div>
      <div class="results-footer">
        <button class="save-btn" id="save-btn">Spara pass</button>
      </div>
    </section>
  </div>

  <div class="modal-overlay" id="profile-modal" style="display:none">
    <div class="modal">

      <div id="profile-list-view">
        <h2>Profiler</h2>
        <div id="profile-list-container" class="profile-list-container"></div>
        <button class="modal-action-btn" id="show-create-profile-btn">+ Skapa ny profil</button>
        <div class="modal-footer-row">
          <button class="modal-skip-btn" id="profile-close-btn">Stäng</button>
        </div>
      </div>

      <div id="profile-create-view" style="display:none">
        <h2>Logga in</h2>
        <p>Ange din e-postadress. Finns ett befintligt konto loggas du in automatiskt.</p>
        <input type="email" id="profile-email-input" placeholder="din@epost.se" maxlength="100" autocomplete="email" inputmode="email">
        <div id="profile-alias-row" style="display:none">
          <input type="text" id="profile-alias-input" placeholder="Alias / Visningsnamn" maxlength="50" autocomplete="nickname">
        </div>
        <p class="profile-create-error" id="profile-create-error"></p>
        <div class="modal-actions">
          <button class="modal-submit-btn" id="profile-submit-btn">Logga in</button>
          <button class="modal-skip-btn" id="profile-create-cancel-btn">Tillbaka</button>
        </div>
      </div>

    </div>
  </div>

  <div class="modal-overlay" id="stats-modal" style="display:none">
    <div class="modal modal-wide">
      <div class="stats-modal-header">
        <h2 id="stats-title">Statistik</h2>
        <button class="modal-close-btn" id="stats-close-btn">✕</button>
      </div>
      <div id="stats-content" class="stats-content"></div>
    </div>
  </div>

  <div class="modal-overlay" id="edit-workout-modal" style="display:none">
    <div class="modal modal-wide">
      <div class="stats-modal-header">
        <h2 id="edit-workout-title">Redigera pass</h2>
        <button class="modal-close-btn" id="edit-workout-close-btn">✕</button>
      </div>
      <div id="edit-workout-content" class="edit-workout-content stats-content"></div>
      <div class="modal-actions" style="margin-top:1rem">
        <button class="modal-submit-btn" id="edit-workout-save-btn">Spara ändringar</button>
        <button class="modal-skip-btn" id="edit-workout-cancel-btn">Avbryt</button>
      </div>
    </div>
  </div>

  <input type="file" id="bg-file-input" accept="image/*" style="display:none">
  <script src="app.js"></script>
</body>
</html>
