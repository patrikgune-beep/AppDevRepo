<script>
(function(){
  var D = JSON.parse(document.getElementById('kv-data').textContent);
  var OWN = 'Thessén & Ek (egen personal)';
  var fmt0 = new Intl.NumberFormat('sv-SE',{maximumFractionDigits:0});
  var fmt2 = new Intl.NumberFormat('sv-SE',{minimumFractionDigits:2,maximumFractionDigits:2});
  function kr(v){ return fmt0.format(Math.round(v)) + ' kr'; }
  function k2(v){ return v==null ? '' : fmt2.format(v); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function r2(v){ return Math.round(v*100)/100; }
  function fmtDate(d){ var p=d.split('-'); return +p[2]+'/'+(+p[1])+' '+p[0]; }

  var supById = {}; D.suppliers.forEach(function(s){ supById[s.id]=s; });
  var ueById = {}; D.ue.forEach(function(u){
    u.lineSum = u.lines.reduce(function(a,l){return a+l.amount;},0);
    u.cost = r2(u.lineSum + (u.rounding||0));
    u.billed = 0; u.billedIn = []; ueById[u.id]=u;
  });
  D.invoices.forEach(function(inv){
    inv.lines.forEach(function(l){
      if(l.ue){ var u=ueById[l.ue]; u.billed=r2(u.billed+l.amount); u.billedIn.push({inv:inv.id, amount:l.amount, kind:inv.kind}); }
    });
    inv.calc = r2(inv.lines.reduce(function(a,l){return a+l.amount;},0));
    inv.total = r2(inv.exMoms + inv.moms + (inv.rounding||0));
  });
  D.ue.forEach(function(u){ u.markup = u.billed - u.cost; u.rate = u.cost ? u.markup/u.cost : 0; });

  /* Flat list of cost rows. Every row carries amount ex moms and origin. */
  var rows = [];
  D.invoices.forEach(function(inv){
    var sup = supById[inv.supplier];
    inv.lines.forEach(function(l){
      if(l.ue) return;
      rows.push({ supplier:inv.supplier, source: inv.supplier==='thessen'? OWN : sup.short, inv:inv.id, kind:inv.kind,
        text:l.text, desc:l.desc, qty:l.qty, unit:l.unit, price:l.price, amount:l.amount, moment:l.moment, slag:l.slag });
    });
  });
  D.ue.forEach(function(u){
    var kinds = u.billedIn.map(function(b){return b.kind;}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(' + ');
    var invs = u.billedIn.map(function(b){return b.inv;}).join(', ');
    u.lines.forEach(function(l){
      var share = u.lineSum ? l.amount/u.lineSum : 0;
      rows.push({ supplier:'thessen', source:u.short, ue:u.id, inv:invs, kind:kinds, text:l.text, desc:l.desc, qty:l.qty, unit:l.unit, price:l.price,
        amount:l.amount, moment:l.moment, slag:l.slag });
      rows.push({ supplier:'thessen', source:u.short, ue:u.id, inv:invs, kind:kinds, paslag:true, text:'Påslag på '+l.text,
        amount: u.markup*share, moment:l.moment, slag:'Påslag UE (12 %)', baseSlag:l.slag });
    });
    if(u.rounding){
      rows.push({ supplier:'thessen', source:u.short, ue:u.id, inv:invs, kind:kinds, text:'Öresavrundning', amount:u.rounding, moment:u.lines[0].moment, slag:'Försäkring & avgifter' });
    }
  });

  var B = D.budget;
  function postFor(r){
    var s = r.baseSlag || r.slag;
    return (B.slagToPost && B.slagToPost[s]) || (B.momentToPost && B.momentToPost[r.moment]) || 'Ej kopplad';
  }
  rows.forEach(function(r){
    r.post = postFor(r);
    if(r.ue){ var u = ueById[r.ue]; r.ataShare = u.billed ? u.billedIn.filter(function(b){return b.kind==='ÄTA';}).reduce(function(a,b){return a+b.amount;},0)/u.billed : 0; }
    else r.ataShare = r.kind==='ÄTA' ? 1 : 0;
  });

  function sum(list){ return list.reduce(function(a,r){return a+r.amount;},0); }
  function groupSum(list,key){ var m={}; list.forEach(function(r){ m[r[key]]=(m[r[key]]||0)+r.amount; }); return m; }

  var totEx = D.invoices.reduce(function(a,i){return a+i.exMoms;},0);
  var totMoms = D.invoices.reduce(function(a,i){return a+i.moms;},0);
  var totInkl = D.invoices.reduce(function(a,i){return a+i.total;},0);
  var totRot = D.invoices.reduce(function(a,i){return a+(i.rot||0);},0);
  var totPay = D.invoices.reduce(function(a,i){return a+i.toPay;},0);
  var totMarkup = D.ue.reduce(function(a,u){return a+u.markup;},0);
  var rowsTotal = sum(rows);
  var reconciled = Math.abs(rowsTotal - totEx) < 0.05 && D.invoices.every(function(i){return Math.abs(i.calc-i.exMoms)<0.05;});

  document.getElementById('meta').innerHTML =
    '<span>Uppdaterad '+fmtDate(D.updated)+'</span><span>'+D.invoices.length+' fakturor · '+D.ue.length+' underlag</span>'+
    (reconciled ? '<span class="tag ok">Avstämt mot fakturor</span>' : '<span class="tag bad">Avstämning avviker</span>');

  /* ---------- Tabs ---------- */
  var tabs = [{id:'sammanstallning', label:'Sammanställning'}];
  D.suppliers.forEach(function(s){
    var n = D.invoices.filter(function(i){return i.supplier===s.id;}).length;
    tabs.push({id:'lev-'+s.id, label:s.short, sub:n+' fakt.'});
  });
  tabs.push({id:'detaljer', label:'Detaljer'});
  tabs.push({id:'avtal', label:'Avtalskontroll'});
  tabs.push({id:'nybudget', label:'Ny budget'});
  tabs.push({id:'uppdatera', label:'Lägg till faktura'});

  var nav = document.getElementById('tabs');
  var view = document.getElementById('view');
  nav.innerHTML = tabs.map(function(t){
    return '<button role="tab" id="tab-'+t.id+'" data-tab="'+t.id+'" aria-selected="false">'+esc(t.label)+(t.sub?'<span class="sub">'+t.sub+'</span>':'')+'</button>';
  }).join('');
  nav.addEventListener('click',function(e){ var b=e.target.closest('button[data-tab]'); if(b) show(b.dataset.tab); });

  var current, vatMode = 'inkl';
  try{ vatMode = localStorage.getItem('kv71-vat') || 'inkl'; }catch(e){}
  function show(id){
    if(!tabs.some(function(t){return t.id===id;})) id='sammanstallning';
    current=id;
    Array.prototype.forEach.call(nav.children,function(b){ b.setAttribute('aria-selected', b.dataset.tab===id?'true':'false'); });
    if(id==='sammanstallning') view.innerHTML = renderSummary();
    else if(id==='detaljer') view.innerHTML = renderDetails();
    else if(id==='uppdatera') view.innerHTML = renderHowTo();
    else if(id==='avtal') view.innerHTML = renderContract();
    else if(id==='nybudget'){ view.innerHTML = renderNewBudget(); bindNewBudget(); }
    else view.innerHTML = renderSupplier(id.slice(4));
    try{ localStorage.setItem('kv71-tab', id); }catch(e){}
    if(id==='detaljer') bindDetails();
    if(id==='sammanstallning') view.querySelectorAll('[data-vat]').forEach(function(c){
      c.addEventListener('click',function(){ vatMode=c.dataset.vat; try{localStorage.setItem('kv71-vat',vatMode);}catch(e){} show('sammanstallning'); });
    });
  }

  /* ---------- Sammanställning ---------- */
  function renderSummary(){
    var b = B, hasBudget = b.received && b.posts && b.posts.length>0;
    var inkl = vatMode==='inkl';
    var bf = b.vatIncluded ? (inkl?1:1/1.25) : (inkl?1.25:1);   // offer → display
    var af = inkl ? 1.25 : 1;                                   // actual (exkl.) → display
    var byPost = groupSum(rows,'post');
    var posts = hasBudget ? b.posts.map(function(p){return p.name;}) : [];
    Object.keys(byPost).forEach(function(p){ if(posts.indexOf(p)<0) posts.push(p); });
    var budgetOf = {}; if(hasBudget) b.posts.forEach(function(p){ budgetOf[p.name]=p.amount; });
    var inclOf = {}; if(hasBudget) b.posts.forEach(function(p){ inclOf[p.name]=p.incl; });
    var budgetTot = hasBudget ? b.posts.reduce(function(a,p){return a+p.amount;},0) : null; // as stated in offer
    var ata = D.invoices.filter(function(i){return i.kind==='ÄTA';}).reduce(function(a,i){return a+i.exMoms;},0);

    var h = '<section class="panel">';
    if(!hasBudget){
      h += '<div class="banner"><div><p><b>Budget saknas.</b> '+esc(b.note)+'</p></div></div>';
    }
    h += '<div class="kpis">'+
      kpi('Fakturerat inkl. moms', kr(totInkl), 'exkl. moms '+kr(totEx)+' · varav ÄTA '+kr(ata*1.25)+' inkl.') +
      (hasBudget ? kpi('Offert inkl. moms', kr(budgetTot), 'före ROT · '+esc(b.source.split(',')[0])) : kpi('Budget','Saknas','skicka offerten i chatten','missing')) +
      (hasBudget ? (function(){
        var work = b.posts.filter(function(p){ return p.name.indexOf('schablon')<0 && p.amount>0; });
        var wb = work.reduce(function(a,p){return a+p.amount;},0);
        var wa = work.reduce(function(a,p){return a+(byPost[p.name]||0);},0)*1.25;
        return kpi('Förbrukat av entreprenaden', fmt0.format(wa/wb*100)+' %', kr(wa)+' av '+kr(wb)+', utan schabloner och konsulter');
      })() : '') +
      kpi('ROT-avdrag', '−'+kr(totRot), (hasBudget&&b.rot? 'beviljat · offerten räknar med −'+kr(b.rot) : 'på faktura 132354')) +
      kpi('Att betala totalt', kr(totPay), 'efter ROT, inkl. moms') +
      '</div>';

    // Offert mot utfall
    h += '<div class="block"><div class="head"><div><h2>Offert mot utfall per offertpost</h2><p class="muted" style="margin:4px 0 0;font-size:13px">'+esc(b.source||'')+'. Påslaget räknas på samma post som raden det hör till.</p></div>'+
      '<div class="filters" role="group" aria-label="Moms"><button class="chip" data-vat="inkl" aria-pressed="'+inkl+'">Inkl. moms</button><button class="chip" data-vat="exkl" aria-pressed="'+(!inkl)+'">Exkl. moms</button></div></div>'+
      '<div class="card scroll"><table><thead><tr><th>Offertpost</th><th class="n">Offert</th><th class="n">Utfall</th><th class="n">Kvar</th><th style="width:24%">Förbrukat</th></tr></thead><tbody>';
    var sumB=0, sumA=0;
    posts.forEach(function(p){
      var a = (byPost[p]||0)*af, bv = budgetOf[p]!=null ? budgetOf[p]*bf : null;
      sumA += a; if(bv) sumB += bv;
      var left = bv==null ? null : bv - a;
      var pct = bv ? a/bv*100 : (a>0?Infinity:0);
      var over = pct>100;
      var barW = Math.min(pct,100);
      h += '<tr><td>'+esc(p)+(inclOf[p]?'<span class="desc">'+esc(inclOf[p])+'</span>':'')+'</td>'+
        '<td class="n">'+(bv==null?'<span class="faint">—</span>':kr(bv))+'</td>'+
        '<td class="n">'+(a?kr(a):'<span class="faint">0</span>')+'</td>'+
        '<td class="n">'+(left==null?'<span class="faint">—</span>':'<span class="'+(left<0?'diff-pos':'')+'">'+(left<0?'−'+kr(-left):kr(left))+'</span>')+'</td>'+
        '<td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><i style="width:'+barW.toFixed(1)+'%;'+(over?'background:var(--bad)':'')+'"></i></div><span class="num '+(over?'diff-pos':'faint')+'" style="min-width:44px">'+(isFinite(pct)?fmt0.format(pct)+' %':(a?'utanför':''))+'</span></div></td></tr>';
    });
    h += '<tr class="total"><td>Totalt</td><td class="n">'+(hasBudget?kr(sumB):'—')+'</td><td class="n">'+kr(sumA)+'</td><td class="n">'+(hasBudget?kr(sumB-sumA):'—')+'</td><td class="num">'+(hasBudget?fmt0.format(sumA/sumB*100)+' %':'')+'</td></tr>';
    if(hasBudget && b.rot){
      h += '<tr><td>ROT-avdrag</td><td class="n">−'+kr(b.rot)+'</td><td class="n">−'+kr(totRot)+'</td><td class="n">'+kr(b.rot-totRot)+' outnyttjat</td><td></td></tr>';
    }
    h += '</tbody></table></div>';
    if(hasBudget && b.rates){
      h += '<div class="card scroll"><table><thead><tr><th>Avtalat pris</th><th class="n">Offert</th><th class="n">Fakturerat</th><th>Kommentar</th></tr></thead><tbody>';
      b.rates.forEach(function(r){
        var ok = typeof r.offer==='number' ? r.billed<=r.offer : r.billed===r.offer;
        h += '<tr><td>'+esc(r.what)+'</td><td class="n">'+(typeof r.offer==='number'?kr(r.offer)+'/'+(r.what.indexOf('dag')>0?'dag':'h'):esc(r.offer))+'</td><td class="n">'+(typeof r.billed==='number'?kr(r.billed):esc(r.billed))+'</td><td><span class="tag '+(ok?'ok':'bad')+'">'+(ok?'OK':'Över')+'</span> <span class="muted">'+esc(r.note)+'</span></td></tr>';
      });
      h += '</tbody></table></div><p class="faint" style="margin:0;font-size:12.5px">Timpriserna i offerten är inkl. moms.</p>';
    }
    h += '</div>';

    // Per leverantör + per kostnadsslag
    var bySource = groupSum(rows.filter(function(r){return !r.paslag;}),'source');
    h += '<div class="grid2">';
    h += '<div class="block"><div class="head"><h2>Per fakturerande leverantör</h2></div><div class="card scroll"><table><thead><tr><th>Leverantör</th><th class="n">Exkl. moms</th><th class="n">Inkl. moms</th><th class="n">Att betala</th></tr></thead><tbody>';
    D.suppliers.forEach(function(s){
      var inv = D.invoices.filter(function(i){return i.supplier===s.id;});
      h += '<tr><td>'+esc(s.name)+'<span class="desc">'+esc(s.role)+' · '+inv.length+' fakturor</span></td><td class="n">'+kr(inv.reduce(function(a,i){return a+i.exMoms;},0))+'</td><td class="n">'+kr(inv.reduce(function(a,i){return a+i.total;},0))+'</td><td class="n">'+kr(inv.reduce(function(a,i){return a+i.toPay;},0))+'</td></tr>';
    });
    h += '<tr class="total"><td>Totalt</td><td class="n">'+kr(totEx)+'</td><td class="n">'+kr(totInkl)+'</td><td class="n">'+kr(totPay)+'</td></tr></tbody></table></div></div>';

    h += '<div class="block"><div class="head"><h2>Vem har utfört arbetet</h2><span class="muted">exkl. moms</span></div><div class="card scroll"><table><thead><tr><th>Utförare</th><th class="n">Kostnad</th><th class="n">Andel</th></tr></thead><tbody>';
    Object.keys(bySource).sort(function(a,b){return bySource[b]-bySource[a];}).forEach(function(s){

  /* ---------- Ny budget ---------- */
  var NB = D.newBudget, NB_KEY = 'kv71-nybudget', NB_OPEN = 'kv71-nb-open';
  var nbOv = {}, nbStatus = 'local', nbDoc = null, nbSaving = false, nbDirty = false, nbTimer = null, nbOpen = {}, nbResetArm = false;
  try{ nbOv = JSON.parse(localStorage.getItem(NB_KEY)||'{}') || {}; }catch(e){ nbOv = {}; }
  try{ nbOpen = JSON.parse(localStorage.getItem(NB_OPEN)||'{}') || {}; }catch(e){ nbOpen = {}; }
  var nbRowById = {}; NB.rows.forEach(function(r){ nbRowById[r.id]=r; });

  function nbW(row, r){
    if(row.actual==='arkitekt') return r.supplier==='arkitekt' ? 1 : 0;
    if(row.actual==='ata') return r.supplier!=='arkitekt' ? r.ataShare : 0;
    if(row.post) return (r.supplier!=='arkitekt' && r.post===row.post) ? 1-r.ataShare : 0;
    return 0;
  }
  function nbSpent(row){ return rows.reduce(function(a,r){ return a + r.amount*nbW(row,r); },0)*1.25; }
  function nbSpentBreakdown(row){
    var m = {};
    rows.forEach(function(r){ var w = nbW(row,r); if(!w) return; var k = r.source+' · '+(r.paslag?'Påslag 12 %':r.slag); m[k]=(m[k]||0)+r.amount*w*1.25; });
    return Object.keys(m).map(function(k){return {k:k,v:m[k]};}).filter(function(x){return Math.abs(x.v)>=0.5;}).sort(function(x,y){return y.v-x.v;});
  }
  function nbLo(rowId, lineId){ return ((nbOv._l||{})[rowId]||{})[lineId] || {}; }
  function nbSubs(rowId, lineId){ return ((nbOv._s||{})[rowId]||{})[lineId] || []; }
  function nbSubAmt(x){ return (x.qty!=null && x.price!=null) ? x.qty*x.price : (x.amount||0); }
  function nbCAlts(rowId, g){ return ((nbOv._ca||{})[rowId]||{})[g] || []; }
  function nbAlt(row, g){
    var sel = ((nbOv._alt||{})[row.id]||{})[g];
    if(sel && (row.items.some(function(i){return i.id===sel && i.group===g;}) || nbCAlts(row.id,g).some(function(c){return c.id===sel;}))) return sel;
    for(var i=0;i<row.items.length;i++) if(row.items[i].group===g) return row.items[i].id;
  }
  function nbLine(row, it){
    var o = nbLo(row.id, it.id), subs = nbSubs(row.id, it.id);
    var q = o.qty!=null ? o.qty : it.qty, pr = o.price!=null ? o.price : it.price;
    var amt = o.amount!=null ? o.amount : ((o.qty!=null||o.price!=null) && q!=null && pr!=null ? q*pr : it.amount);
    if(subs.length) amt = subs.reduce(function(a,x){return a+nbSubAmt(x);},0);
    var on = it.group ? nbAlt(row, it.group)===it.id : !o.off;
    return {q:q, p:pr, a:amt, on:on, subs:subs, changed: o.qty!=null||o.price!=null||o.amount!=null||!!o.off||subs.length>0};
  }
  function nbCustom(rowId){ return ((nbOv._c||{})[rowId]) || []; }
  function nbKalkyl(row){
    var t = 0, seen = {};
    (row.items||[]).forEach(function(it){ var l = nbLine(row,it); if(l.on) t += l.a;
      if(it.group && !seen[it.group]){ seen[it.group]=1; var sel = nbAlt(row, it.group); nbCAlts(row.id, it.group).forEach(function(c){ if(c.id===sel) t += nbSubs(row.id,c.id).length ? nbSubs(row.id,c.id).reduce(function(a,x){return a+nbSubAmt(x);},0) : (c.amount||0); }); } });
    nbCustom(row.id).forEach(function(c){ t += c.amount||0; });
    return t;
  }
  function nbCalc(){
    var out = NB.rows.map(function(row){
      var spent = nbSpent(row), kal = nbKalkyl(row), ov = nbOv[row.id] || {};
      var o = {row:row, spent:spent, kal:kal, hasSpent: spent>0.5};
      if(o.hasSpent){ o.remDefault = Math.max(0, kal-spent); o.rem = ov.rem!=null ? ov.rem : o.remDefault; o.adj = spent + o.rem; o.changed = ov.rem!=null; }
      else { o.adjDefault = kal; o.adj = ov.adj!=null ? ov.adj : kal; o.rem = o.adj; o.changed = ov.adj!=null; }
      return o;
    });
    var assigned = out.reduce(function(a,o){return a+o.spent;},0);
    return {rows:out, leftover: totEx*1.25 - assigned};
  }
  function nbNum(v){ return v==null ? '' : fmt0.format(Math.round(v)); }
  function nbDec(v){ return v==null ? '' : fmt2.format(v).replace(/,00$/,''); }
  function nbIn(attrs, val, changed, cls){

  function nbSubRows(row, lineId){
    var h = '';
    nbSubs(row.id, lineId).forEach(function(x){
      var A = 'data-r="'+row.id+'" data-l="'+lineId+'" data-s="'+x.id+'"';

        '<td class="n">'+nbIn(A+' data-f="sqty"', nbDec(x.qty), false, 'sm')+'</td><td></td>'+
        '<td class="n">'+nbIn(A+' data-f="sprice"', nbDec(x.price), false, 'sm')+'</td><td class="n faint">delrad</td>'+
        '<td class="n">'+(x.qty!=null&&x.price!=null ? '<span class="num">'+kr(nbSubAmt(x))+'</span>' : nbIn(A+' data-f="samount"', nbNum(x.amount), false))+'</td>'+
        '<td><button class="nbreset" data-sdel="'+row.id+'|'+lineId+'|'+x.id+'" title="Ta bort delraden" aria-label="Ta bort delraden">×</button></td></tr>';
    });
    if(nbSubs(row.id, lineId).length) h += '<tr class="subrow"><td></td><td colspan="7"><button class="linkbtn" data-sadd="'+row.id+'|'+lineId+'">+ delrad</button></td></tr>';
    return h;
  }
  function nbLineRow(row, it, l, sel){
    var A = 'data-r="'+row.id+'" data-l="'+it.id+'"', hasSubs = l.subs.length>0, lo = nbLo(row.id,it.id);
    var h = '<tr class="'+(l.on?'':'off')+(it.group?' alt':'')+'"><td>'+sel+'</td><td>'+(it.alt?'<span class="tag">'+esc(it.alt)+'</span> ':'')+esc(it.text)+(it.desc?'<span class="desc">'+esc(it.desc)+'</span>':'')+
      (hasSubs?'':'<button class="linkbtn" data-sadd="'+row.id+'|'+it.id+'">Dela upp</button>')+'</td>'+
      '<td class="n">'+(!hasSubs && (it.qty!=null||it.price!=null) ? nbIn(A+' data-f="qty"', nbDec(l.q), lo.qty!=null, 'sm') : '')+'</td>'+
      '<td class="faint">'+esc(it.unit||'')+'</td>'+

  function nbParse(v){ var t = String(v).replace(/\s| |kr/g,''); if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g,''); t = t.replace(',', '.').replace('−','-'); var n = parseFloat(t); return isFinite(n) ? n : null; }
  function nbL(rowId, lineId){ nbOv._l = nbOv._l||{}; nbOv._l[rowId] = nbOv._l[rowId]||{}; nbOv._l[rowId][lineId] = nbOv._l[rowId][lineId]||{}; return nbOv._l[rowId][lineId]; }
  function nbCleanL(rowId, lineId){ var o = nbOv._l && nbOv._l[rowId]; if(!o) return; if(o[lineId] && !Object.keys(o[lineId]).length) delete o[lineId]; if(!Object.keys(o).length) delete nbOv._l[rowId]; if(nbOv._l && !Object.keys(nbOv._l).length) delete nbOv._l; }
  function nbDelSubs(r, l){ if(nbOv._s && nbOv._s[r]){ delete nbOv._s[r][l]; if(!Object.keys(nbOv._s[r]).length) delete nbOv._s[r]; if(!Object.keys(nbOv._s).length) delete nbOv._s; } }
  function bindNewBudget(){
    view.querySelectorAll('input.nbin, input.nbtext').forEach(function(inp){
      inp.addEventListener('focus', function(){ if(inp.classList.contains('nbin')) inp.select(); });
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter') inp.blur(); });
      inp.addEventListener('change', function(){
        var f = inp.dataset.f, r = inp.dataset.r, l = inp.dataset.l, c = inp.dataset.c;
        if(f==='ctext'){ var cl = nbCustom(r).filter(function(x){return x.id===c;})[0]; if(cl){ cl.text = inp.value.slice(0,200); nbChanged(); } return; }
        if(f==='catext'){ var ca = nbCAlts(r, inp.dataset.g).filter(function(x){return x.id===c;})[0]; if(ca){ ca.text = inp.value.slice(0,200); nbChanged(); } return; }
        var sx = f && f.charAt(0)==='s' && f!=='stext' || f==='stext' ? nbSubs(r, l).filter(function(x){return x.id===inp.dataset.s;})[0] : null;
        if(f==='stext'){ if(sx){ sx.text = inp.value.slice(0,200); nbChanged(); } return; }
        if((f==='sqty'||f==='sprice') && inp.value.trim()===''){ if(sx){ delete sx[f.slice(1)]; nbChanged(); } return; }
        var n = nbParse(inp.value);
        if(n==null){ nbRender(); return; }
        if(f==='rem') nbOv[r] = {rem:Math.round(n)};
        else if(f==='adj') nbOv[r] = {adj:Math.round(n)};
        else if(f==='rot') nbOv.rot = {adj:Math.round(n)};
        else if(f==='qty' || f==='price'){ var o = nbL(r,l); o[f] = n; delete o.amount; }
        else if(f==='amount'){ nbL(r,l).amount = Math.round(n*100)/100; }
        else if(f==='camount'){ var cm = nbCustom(r).filter(function(x){return x.id===c;})[0]; if(cm) cm.amount = Math.round(n); }
        else if(f==='caamount'){ var cx = nbCAlts(r, inp.dataset.g).filter(function(x){return x.id===c;})[0]; if(cx) cx.amount = Math.round(n); }
        else if(f==='sqty' || f==='sprice'){ if(sx){ sx[f.slice(1)] = n; if(sx.qty!=null && sx.price!=null) delete sx.amount; } }
        else if(f==='samount'){ if(sx) sx.amount = Math.round(n*100)/100; }
        nbChanged();
      });
    });
    view.querySelectorAll('input[data-f="on"]').forEach(function(cb){
      cb.addEventListener('change', function(){ var o = nbL(cb.dataset.r, cb.dataset.l); if(cb.checked) delete o.off; else o.off = true; nbCleanL(cb.dataset.r, cb.dataset.l); nbChanged(); });
    });
    view.querySelectorAll('input[data-f="alt"]').forEach(function(rb){
      rb.addEventListener('change', function(){ nbOv._alt = nbOv._alt||{}; nbOv._alt[rb.dataset.r] = nbOv._alt[rb.dataset.r]||{}; nbOv._alt[rb.dataset.r][rb.dataset.g] = rb.dataset.l; nbChanged(); });
    });
    view.querySelectorAll('[data-reset]').forEach(function(b){ b.addEventListener('click', function(){ delete nbOv[b.dataset.reset]; nbChanged(); }); });
    view.querySelectorAll('[data-lreset]').forEach(function(b){ b.addEventListener('click', function(){ var p = b.dataset.lreset.split('|'); if(nbOv._l && nbOv._l[p[0]]) delete nbOv._l[p[0]][p[1]]; nbCleanL(p[0], p[1]); nbDelSubs(p[0], p[1]); nbChanged(); }); });
    view.querySelectorAll('[data-sadd]').forEach(function(b){ b.addEventListener('click', function(){
      var p = b.dataset.sadd.split('|'), r = p[0], l = p[1], cur = nbSubs(r, l), row = nbRowById[r];
      var start = 0;
      if(!cur.length){ var it = row.items.filter(function(x){return x.id===l;})[0]; if(it) start = nbLine(row, it).a; else { var ca = Object.keys((nbOv._ca||{})[r]||{}).reduce(function(acc,g){ return acc.concat(nbCAlts(r,g)); },[]).filter(function(x){return x.id===l;})[0]; start = ca ? (ca.amount||0) : 0; } }
      nbOv._s = nbOv._s||{}; nbOv._s[r] = nbOv._s[r]||{};
      nbOv._s[r][l] = cur.concat([{id:'s'+Date.now().toString(36), text: cur.length ? 'Delrad' : 'Del 1', amount: Math.round(start*100)/100}]);
      nbChanged(); }); });
    view.querySelectorAll('[data-sdel]').forEach(function(b){ b.addEventListener('click', function(){ var p = b.dataset.sdel.split('|'); nbOv._s[p[0]][p[1]] = nbSubs(p[0],p[1]).filter(function(x){return x.id!==p[2];}); if(!nbOv._s[p[0]][p[1]].length) nbDelSubs(p[0],p[1]); nbChanged(); }); });
    view.querySelectorAll('[data-caadd]').forEach(function(b){ b.addEventListener('click', function(){ var p = b.dataset.caadd.split('|'); nbOv._ca = nbOv._ca||{}; nbOv._ca[p[0]] = nbOv._ca[p[0]]||{}; nbOv._ca[p[0]][p[1]] = nbCAlts(p[0],p[1]).concat([{id:'a'+Date.now().toString(36), text:'Eget alternativ', amount:0}]); nbChanged(); }); });
    view.querySelectorAll('[data-cadel]').forEach(function(b){ b.addEventListener('click', function(){ var p = b.dataset.cadel.split('|'); nbOv._ca[p[0]][p[1]] = nbCAlts(p[0],p[1]).filter(function(x){return x.id!==p[2];}); if(!nbOv._ca[p[0]][p[1]].length) delete nbOv._ca[p[0]][p[1]]; if(!Object.keys(nbOv._ca[p[0]]).length) delete nbOv._ca[p[0]]; if(!Object.keys(nbOv._ca).length) delete nbOv._ca; nbDelSubs(p[0],p[2]); nbChanged(); }); });
    view.querySelectorAll('[data-cdel]').forEach(function(b){ b.addEventListener('click', function(){ var p = b.dataset.cdel.split('|'); nbOv._c[p[0]] = nbCustom(p[0]).filter(function(x){return x.id!==p[1];}); if(!nbOv._c[p[0]].length) delete nbOv._c[p[0]]; if(!Object.keys(nbOv._c).length) delete nbOv._c; nbChanged(); }); });
    view.querySelectorAll('[data-cadd]').forEach(function(b){ b.addEventListener('click', function(){ var r = b.dataset.cadd; nbOv._c = nbOv._c||{}; nbOv._c[r] = nbCustom(r).concat([{id:'c'+Date.now().toString(36), text:'Ny rad', amount:0}]); nbChanged(); }); });
    view.querySelectorAll('[data-tog]').forEach(function(b){ b.addEventListener('click', function(){ var r = b.dataset.tog; if(nbOpen[r]) delete nbOpen[r]; else nbOpen[r] = 1; try{ localStorage.setItem(NB_OPEN, JSON.stringify(nbOpen)); }catch(e){} nbRender(); }); });
    view.querySelectorAll('[data-openall]').forEach(function(b){ b.addEventListener('click', function(){ var all = NB.rows.every(function(r){return nbOpen[r.id];}); nbOpen = {}; if(!all) NB.rows.forEach(function(r){ if((r.items&&r.items.length)||r.actual) nbOpen[r.id]=1; }); try{ localStorage.setItem(NB_OPEN, JSON.stringify(nbOpen)); }catch(e){} nbRender(); }); });
    view.querySelectorAll('[data-resetall]').forEach(function(b){ b.addEventListener('click', function(){ if(!nbResetArm){ nbResetArm = true; nbRender(); setTimeout(function(){ if(nbResetArm){ nbResetArm=false; nbRender(); } }, 4000); return; } nbResetArm = false; nbOv = {}; nbChanged(); }); });
  }

    if(nbDoc){ nbDirty = true; clearTimeout(nbTimer); nbTimer = setTimeout(nbSave, 600); }
  }
  function nbSetStatus(s){ nbStatus = s; var el = document.getElementById('nb-status'); if(el){ var m={db:['ok','Sparas i appen'],saving:['','Sparar…'],readonly:['warn','Endast läsning, ändringar sparas inte'],error:['bad','Kunde inte spara']}[s]; if(m){ el.className='tag '+m[0]; el.textContent=m[1]; } } }
  function nbSave(){
    if(!nbDoc || nbSaving || !nbDirty) return;
    nbSaving = true; nbDirty = false; nbSetStatus('saving');
    nbDoc.set({ values: nbOv }).then(function(){ nbSaving=false; nbSetStatus('db'); if(nbDirty) nbSave(); },
      function(e){ nbSaving=false; nbSetStatus(e && e.code==='invalid_argument' ? 'readonly' : 'error'); });
  }
  if(window.claude && typeof window.claude.use==='function'){
    window.claude.use('db').then(function(db){
      if(!db) return;
      try{ nbDoc = db.doc('budget/justeringar'); }catch(e){ return; }
      nbStatus = 'db';
      nbDoc.onSnapshot(function(snap){
        if(snap.metadata && snap.metadata.hasPendingWrites) return;
        if(snap.exists){ var d = snap.data(); var v = d && d.values; if(v && typeof v==='object' && !nbDirty && !nbSaving){ nbOv = JSON.parse(JSON.stringify(v)); try{ localStorage.setItem(NB_KEY, JSON.stringify(nbOv)); }catch(e){} } }
        var a = document.activeElement; if(!(a && a.classList && (a.classList.contains('nbin')||a.classList.contains('nbtext')))) nbRender(); else nbSetStatus(nbStatus);
      }, function(){ nbSetStatus('error'); });
    }, function(){});
  }

  /* ---------- Avtalskontroll ---------- */
  function renderContract(){
    var C = D.contract, R = C.rates, VAT = 1.25;
    var own = [];   // own lines on Thessén invoices
    D.invoices.forEach(function(i){ if(i.supplier!=='thessen') return;
      i.lines.forEach(function(l){ if(!l.ue) own.push({inv:i.nr, l:l}); }); });
    function invList(a){ return a.filter(function(v,i,x){return x.indexOf(v)===i;}).join(', '); }
    var terms = [];   // {term, offer, billed, status, diff (exkl.), where}

    // 1. Timpris egen personal
    var lab = own.filter(function(o){ return o.l.slag==='Arbete' && o.l.unit==='h'; });
    var labBad = lab.filter(function(o){ return Math.abs(o.l.price-R.hantverkare)>0.005; });
    var labH = lab.reduce(function(a,o){return a+o.l.qty;},0);
    terms.push({term:'Timpris snickare/hantverkare', offer:kr(R.hantverkare*VAT)+'/h inkl. ('+kr(R.hantverkare)+' exkl.)',
      billed: labBad.length ? labBad.map(function(o){return o.l.price+' kr';}).join(', ') : kr(R.hantverkare)+'/h exkl. på alla '+lab.length+' rader ('+fmt2.format(labH).replace(/,00$/,'')+' h)',
      status: labBad.length?'dev':'ok', diff: labBad.reduce(function(a,o){return a+(o.l.price-R.hantverkare)*o.l.qty;},0), where: invList(lab.map(function(o){return o.inv;}))});

    // 2. Arbetsledning
    var al = own.filter(function(o){ return o.l.slag==='Arbetsledning'; });
    var alH = al.reduce(function(a,o){return a+o.l.qty;},0);
    var alDiff = al.reduce(function(a,o){return a+(o.l.price-R.arbetsledare)*o.l.qty;},0);
    terms.push({term:'Timpris arbetsledare', offer:kr(R.arbetsledare*VAT)+'/h inkl. ('+kr(R.arbetsledare)+' exkl.)',
      billed: kr(680)+'/h exkl. på '+fmt2.format(alH).replace(/,00$/,'')+' h', status: alDiff>0?'dev':(alDiff<0?'fav':'ok'), diff: alDiff, where: invList(al.map(function(o){return o.inv;}))});

    // 3. Bil per dag, egen
    var car = own.filter(function(o){ return /Servicebil/.test(o.l.text) && o.l.unit==='dag'; });
    var carDays = car.reduce(function(a,o){return a+o.l.qty;},0);
    var carBad = car.filter(function(o){ return Math.abs(o.l.price-R.bilDag)>0.005; });
    terms.push({term:'Bilersättning Thessén', offer:kr(R.bilDag*VAT)+'/dag inkl. ('+kr(R.bilDag)+' exkl.)',
      billed: carBad.length? 'avvikande pris på '+carBad.length+' rader' : kr(R.bilDag)+'/dag på '+carDays+' dagar', status: carBad.length?'dev':'ok',
      diff: carBad.reduce(function(a,o){return a+(o.l.price-R.bilDag)*o.l.qty;},0), where: invList(car.map(function(o){return o.inv;}))});

    // 4. P-avgift
    var pa = own.filter(function(o){ return /^P[- ]avgift/i.test(o.l.text); });
    var paMin = Math.min.apply(null, pa.map(function(o){return o.l.price;}));
    var paHigh = pa.filter(function(o){ return o.l.price>paMin; });
    var byRate = {}; pa.forEach(function(o){ (byRate[o.l.price]=byRate[o.l.price]||[]).push(o.inv); });
    terms.push({term:'P-avgift', offer:'Enligt gällande zon',
      billed: Object.keys(byRate).map(function(r){return r+' kr/h ('+invList(byRate[r])+')';}).join(' · '),
      status: paHigh.length?'check':'ok', diff: paHigh.reduce(function(a,o){return a+(o.l.price-paMin)*o.l.qty;},0), where:'Skillnad mot lägsta taxan '+paMin+' kr/h'});

    // 5. Påslag UE/material
    var mk = D.ue.map(function(u){ return {u:u, ok: Math.abs(u.rate-R.markup)<0.0005}; });
    var mkBad = mk.filter(function(m){return !m.ok;});
    var mkSum = D.ue.reduce(function(a,u){return a+u.markup;},0);
    terms.push({term:'Påslag på UE och material', offer: fmt0.format(R.markup*100)+' %',
      billed: mkBad.length ? mkBad.map(function(m){return m.u.nr+': '+fmt2.format(m.u.rate*100)+' %';}).join(', ') : '12,00 % på alla '+D.ue.length+' underlag, totalt '+kr(mkSum)+' exkl.',
      status: mkBad.length?'dev':'ok', diff: mkBad.reduce(function(a,m){return a+(m.u.rate-R.markup)*m.u.cost;},0), where: 'Alla vidarefakturerade underlag'});

    // 6. UE-bil med påslag mot avtalad bilersättning
    var ueCar = []; D.ue.forEach(function(u){ u.lines.forEach(function(l){ if(/Servicebil/.test(l.text)) ueCar.push({u:u,l:l,eff:l.price*(1+u.rate)}); }); });
    var ueCarN = ueCar.reduce(function(a,c){return a+c.l.qty;},0);
    var ueCarDiff = ueCar.reduce(function(a,c){return a+Math.max(0,c.eff-R.bilDag)*c.l.qty;},0);
    terms.push({term:'Servicebil hos underleverantörer', offer:'Ej reglerat. Thesséns egen bil '+kr(R.bilDag)+' exkl.',
      billed: ueCarN+' bilar: Hard Workers 475 + 12 % = 532 kr, Genchel 450 + 12 % = 504 kr', status:'gap', diff: ueCarDiff, where:'Merkostnad mot 500 kr/dag'});

    // 7. Underlag
    var noDoc = own.filter(function(o){ return /underlag|inte beskrivet/i.test(o.l.desc||''); });
    terms.push({term:'Timmar och material ska styrkas', offer:'Timmar och kopior på material/UE',
      billed: noDoc.length ? noDoc.map(function(o){return o.inv+': '+o.l.text+' ('+kr(o.l.amount)+')';}).join(' · ') : 'Alla rader har underlag',
      status: noDoc.length?'dev':'ok', diff: noDoc.reduce(function(a,o){return a+o.l.amount;},0), where: invList(noDoc.map(function(o){return o.inv;})), claim:true});

    // 8. Fakturaintervall och betalningsvillkor
    var dates = D.invoices.filter(function(i){return i.supplier==='thessen';}).map(function(i){return i.date;}).filter(function(v,i,a){return a.indexOf(v)===i;}).sort();
    var gaps = []; for(var k=1;k<dates.length;k++) gaps.push((new Date(dates[k])-new Date(dates[k-1]))/864e5);
    var minGap = gaps.length?Math.min.apply(null,gaps):null;
    terms.push({term:'Fakturering tidigast var 14:e dag', offer: R.invoiceIntervalDays+' dagar',
      billed: dates.map(fmtDate).join(', ')+' · kortast '+minGap+' dagar', status: minGap!=null&&minGap<R.invoiceIntervalDays?'dev':'ok', diff:0, where:'Fakturadatum'});
    var pd = D.invoices.filter(function(i){return i.supplier==='thessen';}).map(function(i){return {nr:i.nr, d:(new Date(i.due)-new Date(i.date))/864e5};});
    var pdShort = pd.filter(function(x){return x.d<R.paymentDays;});
    terms.push({term:'Betalningsvillkor', offer: R.paymentDays+' dagar netto',
      billed: pdShort.length? pdShort.map(function(x){return x.nr+': '+x.d+' dagar';}).join(', ') : 'Alla minst '+R.paymentDays+' dagar (132370: 30)', status: pdShort.length?'dev':'ok', diff:0, where:'Förfallodatum'});

    // Effektiva timpriser
    var groups = [];
    function grp(name, who, hours, cost, ref, note){ if(hours>0) groups.push({name:name, who:who, h:hours, cost:cost, ref:ref, note:note}); }
    var ownLab = lab; grp('Snickare / hantverkare','Thessén & Ek', labH, ownLab.reduce(function(a,o){return a+o.l.amount;},0), R.hantverkare, 'Avtalat');
    grp('Arbetsledare','Thessén & Ek', alH, al.reduce(function(a,o){return a+o.l.amount;},0), R.arbetsledare, 'Avtalat');
    function ueHours(re, slag){ var h=0,c=0; D.ue.forEach(function(u){ if(!re.test(u.vendor)) return; u.lines.forEach(function(l){ if(l.slag===slag && /tim/.test(l.unit)){ h+=l.qty; c+=l.amount*(1+u.rate);} }); }); return [h,c]; }
    var hw = ueHours(/Hard Workers/,'Arbete'); grp('Rivare','Hard Workers (UE)', hw[0], hw[1], R.hantverkare, 'UE-pris ej reglerat');
    var ge = ueHours(/Genchel/,'Arbete'); grp('Elektriker','Genchel (UE)', ge[0], ge[1], R.hantverkare, 'UE-pris ej reglerat');
    var en = ueHours(/Engblom/,'Arvode'); grp('Konstruktör','Engblom (UE)', en[0], en[1], null, 'Ingår ej i offerten');
    var ark = D.invoices.filter(function(i){return i.supplier==='arkitekt';}); 
    grp('Arkitekt','Viktor Erlandsson', ark.reduce(function(a,i){return a+i.lines.reduce(function(b,l){return b+l.qty;},0);},0), ark.reduce(function(a,i){return a+i.exMoms;},0), null, 'Eget uppdrag, utanför offerten');

    // Summering
    var fav = terms.filter(function(t){return t.status==='fav';}).reduce(function(a,t){return a-t.diff;},0);
    var devPrice = terms.filter(function(t){return t.status==='dev'||t.status==='check'||t.status==='gap';}).reduce(function(a,t){return a+Math.max(0,t.diff);},0);
    var man = C.manual||[];
    var manCheck = man.filter(function(m){return m.status==='check';}).reduce(function(a,m){return a+m.amount;},0);
    var nDev = terms.filter(function(t){return t.status!=='ok'&&t.status!=='fav';}).length + man.length;

    var ST = {ok:['ok','Enligt avtal'], fav:['ok','Till din fördel'], dev:['bad','Avviker'], check:['warn','Kontrollera'], gap:['','Ej reglerat']};
    var h = '<section class="panel">';
    h += '<div class="block"><div class="head"><div><div class="eyebrow">'+esc(C.source)+'</div><h2 style="font-size:24px;margin-top:4px">Fakturerat mot offertens villkor</h2></div></div>';
    h += '<div class="kpis">'+
      kpi('Avvikelser mot villkoren', kr(devPrice*VAT), 'inkl. moms: taxor, UE-bilar, rader utan underlag') +
      kpi('Att kontrollera', kr(manCheck*VAT), 'inkl. moms: bilar, planeringstid, dubbla dagar, arkitekt') +
      kpi('Till din fördel', kr(fav*VAT), 'arbetsledning 680 kr/h i stället för 700') +
      kpi('Punkter att ta upp', String(nDev), 'avvikelser och frågor nedan') +
      '</div>';
    h += '<p class="muted" style="margin:0;max-width:75ch">Thessén följer avtalade timpriser och påslag. Prisavvikelserna är små. Merkostnaderna kommer främst av antal timmar och av poster som offerten inte reglerar, framför allt underleverantörernas timpriser och bilar.</p></div>';

    // Villkorstabell
    h += '<div class="block"><div class="head"><h2>Villkor för villkor</h2><span class="muted">avvikelse exkl. moms</span></div><div class="card scroll"><table><thead><tr><th>Villkor</th><th>Offert</th><th>Fakturerat</th><th>Status</th><th class="n">Avvikelse</th></tr></thead><tbody>';
    terms.forEach(function(t){
      var st = ST[t.status];
      h += '<tr><td><b>'+esc(t.term)+'</b><span class="desc">'+esc(t.where)+'</span></td><td>'+esc(t.offer)+'</td><td>'+esc(t.billed)+'</td><td><span class="tag '+st[0]+'">'+st[1]+'</span></td>'+
        '<td class="n">'+(Math.abs(t.diff)<0.5?'<span class="faint">0</span>':'<span class="'+(t.diff>0?'diff-pos':'diff-neg')+'">'+(t.diff>0?'+':'−')+k2(Math.abs(t.diff))+'</span>')+'</td></tr>';
    });
    h += '</tbody></table></div></div>';

    // Effektiva timpriser
    h += '<div class="block"><div class="head"><div><h2>Effektivt timpris per yrkesgrupp</h2><p class="muted" style="margin:4px 0 0;font-size:13px">Inklusive Thesséns påslag. Jämfört med offertens snickarpris 520 kr/h exkl. (650 inkl.) där inget annat är avtalat.</p></div></div>';
    h += '<div class="card scroll"><table><thead><tr><th>Yrkesgrupp</th><th class="n">Timmar</th><th class="n">Kostnad exkl.</th><th class="n">Kr/h exkl.</th><th class="n">Kr/h inkl.</th><th class="n">Offert kr/h inkl.</th><th class="n">Skillnad totalt</th><th>Avtal</th></tr></thead><tbody>';
    var gh=0, gc=0;
    groups.forEach(function(g){
      var per = g.cost/g.h, d = g.ref!=null ? (per-g.ref)*g.h : null; gh+=g.h; gc+=g.cost;
      h += '<tr><td><b>'+esc(g.name)+'</b><span class="desc">'+esc(g.who)+'</span></td><td class="n">'+fmt2.format(g.h).replace(/,00$/,'')+'</td><td class="n">'+kr(g.cost)+'</td><td class="n">'+k2(per)+'</td><td class="n"><b>'+kr(per*VAT)+'</b></td>'+
        '<td class="n">'+(g.ref!=null?kr(g.ref*VAT):'<span class="faint">—</span>')+'</td>'+
        '<td class="n">'+(d==null?'<span class="faint">—</span>':(Math.abs(d)<1?'<span class="faint">0</span>':'<span class="'+(d>0?'diff-pos':'diff-neg')+'">'+(d>0?'+':'−')+kr(Math.abs(d)*VAT)+'</span>'))+'</td>'+
        '<td><span class="tag '+(g.note==='Avtalat'?'ok':'')+'">'+esc(g.note)+'</span></td></tr>';
    });
    h += '<tr class="total"><td>Totalt</td><td class="n">'+fmt0.format(gh)+'</td><td class="n">'+kr(gc)+'</td><td class="n">'+k2(gc/gh)+'</td><td class="n">'+kr(gc/gh*VAT)+'</td><td></td><td></td><td></td></tr>';
    h += '</tbody></table></div><p class="faint" style="margin:0;font-size:12.5px">Skillnad totalt är inkl. moms. Rivare via Hard Workers är billigare än Thesséns egen personal. Elektrikern kostar 78 kr/h mer än offertens snickarpris, men offerten sätter inget pris för el.</p></div>';

    // Manuella fynd
    h += '<div class="block"><div class="head"><h2>Poster att reklamera eller fråga om</h2><span class="muted">belopp exkl. moms om inget annat anges</span></div><div class="card checks">';
    man.forEach(function(m){
      var st = ST[m.status];
      h += '<div class="check"><span class="tag '+st[0]+'">'+st[1]+'</span><div><p class="t">'+esc(m.title)+' <span class="muted" style="font-weight:500">· '+esc(m.where)+' · '+kr(m.amount)+'</span></p><p class="muted">'+esc(m.text)+'</p></div></div>';
    });
    noDoc.forEach(function(o){
      h += '<div class="check"><span class="tag bad">Avviker</span><div><p class="t">'+esc(o.inv)+': '+esc(o.l.text)+' <span class="muted" style="font-weight:500">· '+kr(o.l.amount)+'</span></p><p class="muted">'+esc(o.l.desc)+'. Offerten kräver att timmar redovisas och att material styrks med kopior. Begär underlag innan du betalar raden.</p></div></div>';
    });
    h += '</div></div>';

    // Vad offerten inte reglerar
    h += '<div class="block"><div class="head"><h2>Det offerten inte reglerar</h2></div><div class="card" style="padding:14px 16px;display:grid;gap:8px;max-width:80ch">'+
      '<p style="margin:0"><b>Timpris för underleverantörer.</b> Bara snickare, målare och arbetsledare har avtalat pris. El, rör, ventilation och rivning via underleverantör debiteras till självkostnad plus 12 %. Begär att Genchel och kommande rörfirma redovisar timpris i förväg.</p>'+
      '<p style="margin:0"><b>Antal bilar och parkering per dag.</b> Bara priset per bil är avtalat, inte hur många bilar som får debiteras per dag.</p>'+
      '<p style="margin:0"><b>Takpris.</b> Arbetet går på löpande räkning och offerten är en uppskattning. Det finns inget tak för överskridanden.</p>'+
      '</div></div>';

    h += '<div class="block"><div class="head"><h2>Offertens villkor, ordagrant</h2></div><div class="card checks">';
    C.quotes.forEach(function(q){ h += '<div class="check" style="grid-template-columns:1fr"><p class="muted">”'+esc(q)+'”</p></div>'; });
    h += '</div></div>';
    return h + '</section>';
  }

  /* ---------- Så uppdaterar du ---------- */
  function renderHowTo(){
    return '<section class="panel"><div class="block" style="max-width:68ch"><h2>Lägga till nya fakturor</h2>'+
      '<p>Appen uppdateras via chatten med Claude. Ladda upp den nya fakturan som PDF och skriv till exempel <code>Ny faktura från Thessén</code>. Bilagorna från underleverantörerna läses också.</p>'+
      '<p>Claude lägger in fakturan, delar upp underlagen på arbetsmoment och kostnadsslag, räknar ut påslaget och stämmer av raderna mot fakturans total. Sedan publiceras en ny version på samma länk.</p>'+
      '<p>Varje rad kopplas till en post i offerten. Arbetsledning, förbrukningsmaterial, transporter, bil, parkering och maskinhyra räknas som Allmänna kostnader, precis som i offerten. Övriga rader kopplas via arbetsmomentet.</p>'+
      '<p class="muted">Kopplingen till arbetsmoment och offertpost är Claudes bedömning utifrån fakturatexterna. Säg till om något ska ligga på en annan post.</p>'+
      '<div class="card" style="padding:14px 16px;display:grid;gap:6px"><span class="eyebrow">Senast inlästa</span>'+
      D.invoices.slice().sort(function(a,b){return a.date<b.date?1:-1;}).map(function(i){return '<div style="display:flex;justify-content:space-between;gap:12px"><span>'+esc(supById[i.supplier].short)+' '+esc(i.nr)+'</span><span class="num muted">'+fmtDate(i.date)+'</span></div>';}).join('')+
      '</div></div></section>';
  }

  var start = 'sammanstallning';
  try{ start = (location.hash||'').slice(1) || localStorage.getItem('kv71-tab') || start; }catch(e){}
  show(start);
})();
</script>
