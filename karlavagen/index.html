<script>
(function(){
  var D = JSON.parse(document.getElementById('kv-data').textContent);
  var OWN = 'Thessén & Ek (egen personal)';
  var fmt0 = new Intl.NumberFormat('sv-SE',{maximumFractionDigits:0});
  var fmt2 = new Intl.NumberFormat('sv-SE',{minimumFractionDigits:2,maximumFractionDigits:2});
  function kr(v){ return fmt0.format(Math.round(v)) + ' kr'; }
  function k2(v){ return v==null ? '' : fmt2.format(v); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function r2(v){ return Math.round(v*100)/100; }
  function fmtDate(d){ var p=d.split('-'); return +p[2]+'/'+(+p[1])+' '+p[0]; }

  var BASE_INV = D.invoices.slice(), BASE_SUP = D.suppliers.slice(), BASE_UE = D.ue.slice(), added = [], hiddenBase = [];
  var UE_FULL = {}; BASE_INV.forEach(function(inv){ inv.lines.forEach(function(l){ if(l.ue) UE_FULL[l.ue] = (UE_FULL[l.ue]||0) + l.amount; }); });
  var supById, ueById, rows, totEx, totMoms, totInkl, totRot, totPay, totMarkup, rowsTotal, reconciled;
  var B = D.budget;
  function postFor(r){
    if(r.nbRow){ var nr = (D.newBudget.rows||[]).filter(function(x){return x.id===r.nbRow;})[0]; if(nr) return nr.post || (nr.actual==='arkitekt' ? 'Utanför offerten' : nr.name); }
    var s = r.baseSlag || r.slag;
    return (B.slagToPost && B.slagToPost[s]) || (B.momentToPost && B.momentToPost[r.moment]) || 'Ej kopplad';
  }
  function sum(list){ return list.reduce(function(a,r){return a+r.amount;},0); }
  function groupSum(list,key){ var m={}; list.forEach(function(r){ m[r[key]]=(m[r[key]]||0)+r.amount; }); return m; }
  function slugify(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'lev'; }
  function addedSupplier(doc){ if(doc.supplierId && doc.supplierId!=='ny') return doc.supplierId; return 'x-'+slugify(doc.supplierName); }
  function toInv(doc){
    var lines = (doc.lines||[]).filter(function(l){ return l && (l.text || l.amount); }).map(function(l){
      return { text:l.text||'Rad', amount:Number(l.amount)||0, qty:l.qty, unit:l.unit, price:l.price, moment:'Tillagd faktura', slag:l.slag||'Ospecificerat', nbRow:l.post||doc.post||null };
    });
    var lineSum = lines.reduce(function(a,l){return a+l.amount;},0), ex = Number(doc.exMoms)||0;
    if(Math.abs(ex - lineSum) >= 0.5) lines.push({ text: lines.length ? 'Ej fördelat på rader' : 'Hela fakturan (ej uppdelad)', amount: r2(ex-lineSum), moment:'Tillagd faktura', slag:'Ospecificerat', nbRow: doc.post||null });
    var moms = Number(doc.moms)||0, rnd = Number(doc.rounding)||0, rot = Number(doc.rot)||0;
    return { id:'x-'+doc._id, docId:doc._id, added:true, supplier:addedSupplier(doc), nr:doc.nr||'–', date:doc.date||'', due:doc.due||doc.date||'', kind:doc.kind==='ÄTA'?'ÄTA':'Grund',
      project:doc.project||'Tillagd faktura', exMoms:ex, moms:moms, rounding:rnd, rot:rot, toPay: doc.toPay!=null && doc.toPay!=='' ? Number(doc.toPay) : r2(ex+moms+rnd-rot),
      note: doc.note||'', pdf: doc.pdf||null, pdfName: doc.pdfName||'', pdfType: doc.pdfType||'', lines: lines };
  }
  function baseVisible(){ return hiddenBase.length < BASE_INV.length; }
  function compute(){
    D.invoices = BASE_INV.filter(function(i){ return hiddenBase.indexOf(i.id)<0; }).concat(added.map(toInv));
    var sups = BASE_SUP.slice();
    added.forEach(function(doc){ var id = addedSupplier(doc); if(!sups.some(function(x){return x.id===id;})) sups.push({ id:id, name:doc.supplierName||'Ny leverantör', short:doc.supplierName||'Ny leverantör', role:'Tillagd leverantör', orgnr:'–', contact:'–' }); });
    D.suppliers = sups;
    supById = {}; D.suppliers.forEach(function(s){ supById[s.id]=s; });
    ueById = {}; BASE_UE.forEach(function(u){
      u.lineSum = u.lines.reduce(function(a,l){return a+l.amount;},0);
      u.fullCost = r2(u.lineSum + (u.rounding||0)); u.cost = u.fullCost;
      u.billed = 0; u.billedIn = []; ueById[u.id]=u;
    });
    D.invoices.forEach(function(inv){
      inv.lines.forEach(function(l){
        if(l.ue){ var u=ueById[l.ue]; u.billed=r2(u.billed+l.amount); u.billedIn.push({inv:inv.id, amount:l.amount, kind:inv.kind}); }
      });
      inv.calc = r2(inv.lines.reduce(function(a,l){return a+l.amount;},0));
      inv.total = r2(inv.exMoms + inv.moms + (inv.rounding||0));
    });
    BASE_UE.forEach(function(u){ u.scale = UE_FULL[u.id] ? u.billed/UE_FULL[u.id] : 0; u.cost = r2(u.fullCost*u.scale); });
    D.ue = BASE_UE.filter(function(u){ return u.billed > 0; });
    D.ue.forEach(function(u){ u.markup = u.billed - u.cost; u.rate = u.cost ? u.markup/u.cost : 0; });

    /* Flat list of cost rows. Every row carries amount ex moms and origin. */
    rows = [];
    D.invoices.forEach(function(inv){
      var sup = supById[inv.supplier];
      inv.lines.forEach(function(l){
        if(l.ue) return;
        rows.push({ supplier:inv.supplier, source: inv.supplier==='thessen'? OWN : sup.short, inv:inv.id, kind:inv.kind,
          text:l.text, desc:l.desc, qty:l.qty, unit:l.unit, price:l.price, amount:l.amount, moment:l.moment, slag:l.slag, nbRow:l.nbRow, added:inv.added });
      });
    });
    D.ue.forEach(function(u){
      var kinds = u.billedIn.map(function(b){return b.kind;}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(' + ');
      var invs = u.billedIn.map(function(b){return b.inv;}).join(', ');
      u.lines.forEach(function(l){
        var share = u.lineSum ? l.amount/u.lineSum : 0;
        rows.push({ supplier:'thessen', source:u.short, ue:u.id, inv:invs, kind:kinds, text:l.text, desc:l.desc, qty:l.qty, unit:l.unit, price:l.price,
          amount:l.amount*u.scale, moment:l.moment, slag:l.slag });
        rows.push({ supplier:'thessen', source:u.short, ue:u.id, inv:invs, kind:kinds, paslag:true, text:'Påslag på '+l.text,
          amount: u.markup*share, moment:l.moment, slag:'Påslag UE (12 %)', baseSlag:l.slag });
      });
      if(u.rounding){
        rows.push({ supplier:'thessen', source:u.short, ue:u.id, inv:invs, kind:kinds, text:'Öresavrundning', amount:u.rounding*u.scale, moment:u.lines[0].moment, slag:'Försäkring & avgifter' });
      }
    });


    totEx = D.invoices.reduce(function(a,i){return a+i.exMoms;},0);
    totMoms = D.invoices.reduce(function(a,i){return a+i.moms;},0);
    totInkl = D.invoices.reduce(function(a,i){return a+i.total;},0);
    totRot = D.invoices.reduce(function(a,i){return a+(i.rot||0);},0);
    totPay = D.invoices.reduce(function(a,i){return a+i.toPay;},0);
    totMarkup = D.ue.reduce(function(a,u){return a+u.markup;},0);
    rowsTotal = sum(rows);
    reconciled = Math.abs(rowsTotal - totEx) < 0.05 && D.invoices.every(function(i){return Math.abs(i.calc-i.exMoms)<0.05;});
    rows.forEach(function(r){
      r.post = postFor(r);
      if(r.ue){ var u = ueById[r.ue]; r.ataShare = u.billed ? u.billedIn.filter(function(b){return b.kind==='ÄTA';}).reduce(function(a,b){return a+b.amount;},0)/u.billed : 0; }
      else r.ataShare = r.kind==='ÄTA' ? 1 : 0;
    });
    totEx = D.invoices.reduce(function(a,i){return a+i.exMoms;},0);
  }
  function updateMeta(){
  document.getElementById('meta').innerHTML =
    '<span>Uppdaterad '+fmtDate(D.updated)+'</span><span>'+D.invoices.length+' fakturor · '+D.ue.length+' underlag</span>'+
    (reconciled ? '<span class="tag ok">Avstämt mot fakturor</span>' : '<span class="tag bad">Avstämning avviker</span>');
  }
  compute(); updateMeta();

  /* ---------- Tabs ---------- */
  var tabs;
  function buildTabs(){
  tabs = [{id:'sammanstallning', label:'Sammanställning'}];
  D.suppliers.forEach(function(s){
    var n = D.invoices.filter(function(i){return i.supplier===s.id;}).length;
    tabs.push({id:'lev-'+s.id, label:s.short, sub:n+' fakt.'});
  });
  tabs.push({id:'detaljer', label:'Detaljer'});
  tabs.push({id:'avtal', label:'Avtalskontroll'});
  tabs.push({id:'nybudget', label:'Ny budget'});

    return '<button role="tab" id="tab-'+t.id+'" data-tab="'+t.id+'" aria-selected="'+(t.id===current)+'">'+esc(t.label)+(t.sub?'<span class="sub">'+t.sub+'</span>':'')+'</button>';

  var nav = document.getElementById('tabs');

  var vatMode = 'inkl';

  function show(id){
    if(!tabs.some(function(t){return t.id===id;})) id='sammanstallning';
    current=id;
    Array.prototype.forEach.call(nav.children,function(b){ b.setAttribute('aria-selected', b.dataset.tab===id?'true':'false'); });
    if(id==='sammanstallning') view.innerHTML = renderSummary();
    else if(id==='detaljer') view.innerHTML = renderDetails();
    else if(id==='uppdatera'){ view.innerHTML = renderAdd(); bindAdd(); }
    else if(id==='avtal') view.innerHTML = renderContract();
    else if(id==='nybudget'){ view.innerHTML = renderNewBudget(); bindNewBudget(); }
    else if(id==='fraga'){ view.innerHTML = renderAsk(); bindAsk(); }
    else view.innerHTML = renderSupplier(id.slice(4));
    try{ localStorage.setItem('kv71-tab', id); }catch(e){}
    if(id==='detaljer') bindDetails();
    if(id==='sammanstallning') bindReset();
    if(id==='sammanstallning') view.querySelectorAll('[data-vat]').forEach(function(c){
      c.addEventListener('click',function(){ vatMode=c.dataset.vat; try{localStorage.setItem('kv71-vat',vatMode);}catch(e){} show('sammanstallning'); });
    });
  }

  /* ---------- Sammanställning ---------- */

      (hasBudget ? kpi('Offert inkl. moms', kr(budgetTot), 'före ROT · '+esc(b.source.split(',')[0])) : kpi('Budget','Saknas','skicka offerten i chatten','missing')) +
      (hasBudget ? (function(){
        var work = b.posts.filter(function(p){ return p.name.indexOf('schablon')<0 && p.amount>0; });
        var wb = work.reduce(function(a,p){return a+p.amount;},0);
        var wa = work.reduce(function(a,p){return a+(byPost[p.name]||0);},0)*1.25;
        return kpi('Förbrukat av entreprenaden', fmt0.format(wa/wb*100)+' %', kr(wa)+' av '+kr(wb)+', utan schabloner och konsulter');
      })() : '') +

    // Offert mot utfall

      '<div class="filters" role="group" aria-label="Moms"><button class="chip" data-vat="inkl" aria-pressed="'+inkl+'">Inkl. moms</button><button class="chip" data-vat="exkl" aria-pressed="'+(!inkl)+'">Exkl. moms</button></div></div>'+
      '<div class="card scroll"><table><thead><tr><th>Offertpost</th><th class="n">Offert</th><th class="n">Utfall</th><th class="n">Kvar</th><th style="width:24%">Förbrukat</th></tr></thead><tbody>';
    var sumB=0, sumA=0;
    posts.forEach(function(p){
      var a = (byPost[p]||0)*af, bv = budgetOf[p]!=null ? budgetOf[p]*bf : null;
      sumA += a; if(bv) sumB += bv;
      var left = bv==null ? null : bv - a;

      var over = pct>100;
      var barW = Math.min(pct,100);

        '<td class="n">'+(a?kr(a):'<span class="faint">0</span>')+'</td>'+
        '<td class="n">'+(left==null?'<span class="faint">—</span>':'<span class="'+(left<0?'diff-pos':'')+'">'+(left<0?'−'+kr(-left):kr(left))+'</span>')+'</td>'+
        '<td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><i style="width:'+barW.toFixed(1)+'%;'+(over?'background:var(--bad)':'')+'"></i></div><span class="num '+(over?'diff-pos':'faint')+'" style="min-width:44px">'+(isFinite(pct)?fmt0.format(pct)+' %':(a?'utanför':''))+'</span></div></td></tr>';

    D.suppliers.forEach(function(s){

    });
    h += '<tr class="total"><td>Totalt</td><td class="n">'+kr(totEx)+'</td><td class="n">'+kr(totInkl)+'</td><td class="n">'+kr(totPay)+'</td></tr></tbody></table></div></div>';

    h += '<div class="block"><div class="head"><h2>Vem har utfört arbetet</h2><span class="muted">exkl. moms</span></div><div class="card scroll"><table><thead><tr><th>Utförare</th><th class="n">Kostnad</th><th class="n">Andel</th></tr></thead><tbody>';
    Object.keys(bySource).sort(function(a,b){return bySource[b]-bySource[a];}).forEach(function(s){
      h += '<tr><td>'+esc(s)+'</td><td class="n">'+kr(bySource[s])+'</td><td class="n">'+fmt0.format(totEx?bySource[s]/totEx*100:0)+' %</td></tr>';
    });
    h += '<tr class="paslag"><td>Påslag Thessén på UE och material</td><td class="n">'+kr(totMarkup)+'</td><td class="n">'+fmt0.format(totEx?totMarkup/totEx*100:0)+' %</td></tr>';
    h += '<tr class="total"><td>Totalt</td><td class="n">'+kr(totEx)+'</td><td class="n">100 %</td></tr></tbody></table></div></div>';
    h += '</div>';

    // Fakturaförteckning
    var today = D.updated;
    h += '<div class="block"><div class="head"><h2>Alla fakturor</h2><span class="muted">sorterat på fakturadatum</span></div><div class="card scroll"><table><thead><tr><th>Datum</th><th>Leverantör</th><th>Nr</th><th>Typ</th><th class="n">Exkl. moms</th><th class="n">Inkl. moms</th><th class="n">Att betala</th><th>Förfaller</th></tr></thead><tbody>';
    D.invoices.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(i){
      var dueTag = i.due < today ? '<span class="tag">'+fmtDate(i.due)+'</span>' : '<span class="tag warn">'+fmtDate(i.due)+'</span>';
      h += '<tr><td class="num" style="text-align:left">'+fmtDate(i.date)+'</td><td>'+esc(supById[i.supplier].short)+'</td><td>'+esc(i.nr)+(i.added?' <span class="tag ue">Tillagd</span>':'')+'</td><td><span class="tag '+(i.kind==='ÄTA'?'ata':'grund')+'">'+i.kind+'</span></td><td class="n">'+kr(i.exMoms)+'</td><td class="n">'+kr(i.total)+'</td><td class="n">'+kr(i.toPay)+'</td><td>'+dueTag+'</td></tr>';
    });
    h += '</tbody></table></div><p class="faint" style="margin:0;font-size:12.5px">Gul förfallodag = ligger efter '+fmtDate(today)+'. Betalstatus registreras inte i appen.</p></div>';

    // Att kontrollera
    if(baseVisible()){
    h += '<div class="block"><div class="head"><h2>Att kontrollera</h2></div><div class="card checks">';

      h += '<div class="check"><span class="tag '+(c.level==='warn'?'warn':'')+'">'+(c.level==='warn'?'Åtgärd':'Info')+'</span><div><p class="t">'+esc(c.title)+'</p><p class="muted">'+esc(c.text)+'</p></div></div>';

  function kpi(label,v,s,cls){ return '<div class="kpi '+(cls||'')+'"><span class="eyebrow">'+label+'</span><span class="v">'+v+'</span><span class="s">'+s+'</span></div>'; }

  /* ---------- Leverantörsflik ---------- */
  function renderSupplier(sid){
    var s = supById[sid];
    var inv = D.invoices.filter(function(i){return i.supplier===sid;}).sort(function(a,b){return a.date<b.date?-1:1;});
    var ex = inv.reduce(function(a,i){return a+i.exMoms;},0), tot = inv.reduce(function(a,i){return a+i.total;},0), pay = inv.reduce(function(a,i){return a+i.toPay;},0);
    var h = '<section class="panel"><div class="block"><div class="head"><div><div class="eyebrow">'+esc(s.role)+' · org.nr '+esc(s.orgnr)+' · ref. '+esc(s.contact)+'</div><h2 style="font-size:24px;margin-top:4px">'+esc(s.name)+'</h2></div></div>';
    h += '<div class="kpis">'+kpi('Exkl. moms',kr(ex),inv.length+' fakturor')+kpi('Inkl. moms',kr(tot),'moms '+kr(tot-ex))+kpi('Att betala',kr(pay),'efter ROT-avdrag');

      D.ue.forEach(function(u){
        h += '<tr><td>'+esc(u.vendor)+'<span class="desc">'+esc(u.period)+'</span></td><td>'+esc(u.nr)+'</td><td class="num" style="text-align:left">'+fmtDate(u.date)+'</td><td class="n">'+k2(u.cost)+'</td><td class="n">'+k2(u.billed)+'</td><td class="n">'+fmt2.format(u.rate*100)+' %</td><td>'+u.billedIn.map(function(b){return esc(b.inv)+' <span class="tag '+(b.kind==='ÄTA'?'ata':'grund')+'">'+b.kind+'</span>';}).join('<br>')+'</td></tr>';

  function invoiceCard(i, open){

      if(l.ue){
        var u = ueById[l.ue];

        h += '<tr><td>'+esc(l.text)+' <span class="tag ue">UE</span>'+

    return h;

  /* ---------- Detaljer ---------- */

  function nbParse(v){ var t = String(v).replace(/\s| |kr/g,''); if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g,''); t = t.replace(',', '.').replace('−','-'); var n = parseFloat(t); return isFinite(n) ? n : null; }

  /* ---------- Avtalskontroll ---------- */
  function renderContract(){
    var C = D.contract, R = C.rates, VAT = 1.25;
    var own = [];   // own lines on Thessén invoices
    D.invoices.forEach(function(i){ if(i.supplier!=='thessen') return;
      i.lines.forEach(function(l){ if(!l.ue) own.push({inv:i.nr, l:l}); }); });
    function invList(a){ return a.filter(function(v,i,x){return x.indexOf(v)===i;}).join(', '); }
    var terms = [];   // {term, offer, billed, status, diff (exkl.), where}

    // 1. Timpris egen personal
    var lab = own.filter(function(o){ return o.l.slag==='Arbete' && o.l.unit==='h'; });
    var labBad = lab.filter(function(o){ return Math.abs(o.l.price-R.hantverkare)>0.005; });
    var labH = lab.reduce(function(a,o){return a+o.l.qty;},0);
    terms.push({term:'Timpris snickare/hantverkare', offer:kr(R.hantverkare*VAT)+'/h inkl. ('+kr(R.hantverkare)+' exkl.)',
      billed: labBad.length ? labBad.map(function(o){return o.l.price+' kr';}).join(', ') : kr(R.hantverkare)+'/h exkl. på alla '+lab.length+' rader ('+fmt2.format(labH).replace(/,00$/,'')+' h)',
      status: labBad.length?'dev':'ok', diff: labBad.reduce(function(a,o){return a+(o.l.price-R.hantverkare)*o.l.qty;},0), where: invList(lab.map(function(o){return o.inv;}))});

    // 2. Arbetsledning

    var alH = al.reduce(function(a,o){return a+o.l.qty;},0);
    var alDiff = al.reduce(function(a,o){return a+(o.l.price-R.arbetsledare)*o.l.qty;},0);
    terms.push({term:'Timpris arbetsledare', offer:kr(R.arbetsledare*VAT)+'/h inkl. ('+kr(R.arbetsledare)+' exkl.)',
      billed: kr(680)+'/h exkl. på '+fmt2.format(alH).replace(/,00$/,'')+' h', status: alDiff>0?'dev':(alDiff<0?'fav':'ok'), diff: alDiff, where: invList(al.map(function(o){return o.inv;}))});

    // 3. Bil per dag, egen

    var carDays = car.reduce(function(a,o){return a+o.l.qty;},0);
    var carBad = car.filter(function(o){ return Math.abs(o.l.price-R.bilDag)>0.005; });

      billed: carBad.length? 'avvikande pris på '+carBad.length+' rader' : kr(R.bilDag)+'/dag på '+carDays+' dagar', status: carBad.length?'dev':'ok',
      diff: carBad.reduce(function(a,o){return a+(o.l.price-R.bilDag)*o.l.qty;},0), where: invList(car.map(function(o){return o.inv;}))});

    // 4. P-avgift
    var pa = own.filter(function(o){ return /^P[- ]avgift/i.test(o.l.text); });
    var paMin = pa.length ? Math.min.apply(null, pa.map(function(o){return o.l.price;})) : 0;
    var paHigh = pa.filter(function(o){ return o.l.price>paMin; });
    var byRate = {}; pa.forEach(function(o){ (byRate[o.l.price]=byRate[o.l.price]||[]).push(o.inv); });
    terms.push({term:'P-avgift', offer:'Enligt gällande zon',
      billed: Object.keys(byRate).map(function(r){return r+' kr/h ('+invList(byRate[r])+')';}).join(' · '),
      status: paHigh.length?'check':'ok', diff: paHigh.reduce(function(a,o){return a+(o.l.price-paMin)*o.l.qty;},0), where:'Skillnad mot lägsta taxan '+paMin+' kr/h'});

    // Effektiva timpriser
    var groups = [];
    function grp(name, who, hours, cost, ref, note){ if(hours>0) groups.push({name:name, who:who, h:hours, cost:cost, ref:ref, note:note}); }
    var ownLab = lab; grp('Snickare / hantverkare','Thessén & Ek', labH, ownLab.reduce(function(a,o){return a+o.l.amount;},0), R.hantverkare, 'Avtalat');

    function ueHours(re, slag){ var h=0,c=0; D.ue.forEach(function(u){ if(!re.test(u.vendor)) return; u.lines.forEach(function(l){ if(l.slag===slag && /tim/.test(l.unit)){ h+=l.qty; c+=l.amount*(1+u.rate);} }); }); return [h,c]; }
    var hw = ueHours(/Hard Workers/,'Arbete'); grp('Rivare','Hard Workers (UE)', hw[0], hw[1], R.hantverkare, 'UE-pris ej reglerat');

    var ark = D.invoices.filter(function(i){return i.supplier==='arkitekt';}); 
    grp('Arkitekt','Viktor Erlandsson', ark.reduce(function(a,i){return a+i.lines.reduce(function(b,l){return b+l.qty;},0);},0), ark.reduce(function(a,i){return a+i.exMoms;},0), null, 'Eget uppdrag, utanför offerten');

    // Summering

  function pdfPages(doc){

    var ps = [];
    for(var i=1;i<=doc.numPages;i++) ps.push(doc.getPage(i).then(function(pg){ return pg.getTextContent().then(function(tc){
      var t = tc.items.map(function(x){return x.str;}).join(' ').replace(/\s+/g,' ').trim();
      return { n: pg.pageNumber, text: t, scanned: t.replace(/\s/g,'').length < 60 };
    }); }));

  function renderPage(doc, n, width){
    return doc.getPage(n).then(function(pg){
      var vp0 = pg.getViewport({scale:1}), vp = pg.getViewport({scale: width/vp0.width}), c = document.createElement('canvas');
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);

    }); });

    view.querySelectorAll('[data-goto]').forEach(function(b){ b.addEventListener('click', function(){ show(b.dataset.goto); window.scrollTo(0,0); }); });
    bindReset();
    var cl = document.getElementById('inv-close'); if(cl) cl.addEventListener('click', function(){ invReview = null; addRender(); });
    if(invReview) renderPdfPreview();
  }
  function invValidate(f){
    if(f.supplierId==='ny' && !String(f.supplierName||'').trim()) return 'Ange leverantörens namn.';
    if(!String(f.nr||'').trim()) return 'Ange fakturanummer.';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date||'')) return 'Ange fakturadatum.';
    if(numv(f.exMoms)==='') return 'Ange belopp exkl. moms.';
    return '';
  }
  function invSave(){
    var err = invValidate(invForm); if(err){ invSetMsg(err,'bad'); return; }
    if(!invDb){ invSetMsg('Kan inte spara i den här vyn.','bad'); return; }
    var dup = dupInfo(invForm, invQIdx);
    if(dup && !invDupArm){ invDupArm = true; invSetMsg(dup+'. Klicka Spara igen för att spara ändå.','bad'); return; }
    invDupArm = false;
    invBusy = true; invSetMsg('Sparar…'); var f = invForm;
    var up = (invFile && invAssets) ? invAssets.upload(invFile, {type: invFile.type || 'application/pdf'}) : Promise.resolve(null);
    up.then(function(res){
      var doc = { supplierId:f.supplierId, supplierName: f.supplierId==='ny' ? String(f.supplierName).trim() : ((BASE_SUP.filter(function(x){return x.id===f.supplierId;})[0]||{}).name || f.supplierName || ''),
        nr:String(f.nr).trim(), date:f.date, due:f.due||'', kind:f.kind, project:f.project||'', note:f.note||'', post:f.post||'',
        exMoms:numv(f.exMoms), moms:numv(f.moms)===''?0:numv(f.moms), rounding:numv(f.rounding)===''?0:numv(f.rounding), rot:numv(f.rot)===''?0:numv(f.rot), toPay:numv(f.toPay),
        lines: f.lines.filter(function(l){ return String(l.text||'').trim() || numv(l.amount)!==''; }).map(function(l){ return {text:String(l.text||'').trim().slice(0,200), amount:numv(l.amount)===''?0:numv(l.amount), post:l.post||'', slag:l.slag||'Ospecificerat'}; }),
        pdf: res ? res.id : (f.pdf||null), pdfName: res ? invFile.name : (f.pdfName||''), pdfType: res ? (invFile.type||'application/pdf') : (f.pdfType||''),
        updatedAt: new Date().toISOString() };
      if(doc.supplierId!=='thessen' && doc.supplierId!=='arkitekt' && doc.supplierId!=='ny'){ doc.supplierId = 'ny'; }
      var ref = invEditing ? invDb.collection('fakturor').doc(invEditing) : invDb.collection('fakturor').doc();
      if(!invEditing) doc.createdAt = doc.updatedAt;
      return ref.set(invEditing ? Object.assign({createdAt: (added.filter(function(x){return x._id===invEditing;})[0]||{}).createdAt||doc.updatedAt}, doc) : doc).then(function(){ return ref.id; });
    }).then(function(id){
      invBusy = false; var wasEdit = !!invEditing; invEditing = null; invFile = null; invForm = blankForm();
      if(!wasEdit && invQIdx>=0 && invQueue[invQIdx]){
        invQueue[invQIdx].status = 'sparad'; invQueue[invQIdx].form = null;
        var savedName = invQueue[invQIdx].file.name, nx = nextDraft(); invQIdx = -1;
        if(nx>=0){ loadDraft(nx); var m = document.getElementById('inv-msg'); invMsg = '<p class="diff-neg" style="margin:0">'+esc(savedName)+' är sparad.</p>' + invMsg; }
        else { invReview = id; invSetMsg('Fakturan är sparad. Alla filer i kön är klara.','ok'); }
      } else { invReview = id; invSetMsg(wasEdit ? 'Ändringarna är sparade.' : 'Fakturan är sparad och räknas nu in i appen.','ok'); }
      addRender();
    }).catch(function(e){
      invBusy = false; var c = e && e.code;
      invSetMsg({too_large:'Filen är för stor (max 20 MB).', unsupported_type:'Filtypen stöds inte. Använd PDF, PNG, JPEG eller WebP.', quota_or_state:'Lagringen är full.', invalid_argument:'Du har inte behörighet att spara i appen.', not_granted:'Uppladdning är inte tillåten i den här vyn.'}[c] || 'Det gick inte att spara. Försök igen.','bad'); addRender();
    });
  }
  function invDelete(id){
    var d = added.filter(function(x){return x._id===id;})[0]; if(!d || !invDb) return;
    invDb.collection('fakturor').doc(id).delete().then(function(){
      if(d.pdf && invAssets) invAssets.delete(d.pdf).catch(function(){});
      if(invReview===id) invReview = null; invSetMsg('Fakturan är borttagen.','ok');
    }, function(){ invSetMsg('Det gick inte att ta bort fakturan.','bad'); addRender(); });
  }
  var invQueue = [], invQIdx = -1, invQRunning = false, invQStop = false, invDupArm = false, invQSeq = 0;
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function formFromJson(j, posts, slags){
    var f = blankForm(), name = String(j.leverantor||'');
    if(/thess/i.test(name)) f.supplierId = 'thessen'; else if(/erlandsson|artefacts|str design/i.test(name)) f.supplierId = 'arkitekt'; else if(name){ f.supplierId = 'ny'; f.supplierName = name; }
    var ds = function(v){ return /^\d{4}-\d{2}-\d{2}$/.test(String(v||'')) ? String(v) : ''; };
    var nv = function(v){ var n = Number(v); return isFinite(n) && v!==null && v!=='' ? nbDec(n) : ''; };
    f.nr = String(j.fakturanummer||''); f.date = ds(j.fakturadatum); f.due = ds(j.forfallodatum); f.kind = j.typ==='ÄTA'?'ÄTA':'Grund';
    f.project = String(j.projekt||''); f.exMoms = nv(j.exklMoms); f.moms = nv(j.moms); f.rounding = nv(j.oresavrundning); f.rot = nv(j.rotAvdrag); f.toPay = nv(j.attBetala);
    var ids = posts.map(function(x){return x.id;});
    f.lines = (Array.isArray(j.rader)?j.rader:[]).slice(0,30).map(function(r){ return { text:String(r.text||'').slice(0,200), amount: nv(r.belopp), post: ids.indexOf(r.post)>=0 ? r.post : '', slag: slags.indexOf(r.slag)>=0 ? r.slag : 'Ospecificerat' }; });
    if(Array.isArray(j.bilagor) && j.bilagor.length) f.note = 'Bilagor: ' + j.bilagor.slice(0,20).map(function(x){ return String(x.leverantor||'?')+' '+String(x.nummer||'')+(isFinite(Number(x.exklMoms))&&x.exklMoms!==null?' ('+nbNum(Number(x.exklMoms))+' kr exkl.)':''); }).join('; ');
    return f;
  }
  function extractFile(file, progress){
    var isImg = /^image\//.test(file.type), posts = invPosts(), slags = slagOpts(), info = '';
    var prompt = function(text){ return 'Du läser en faktura för renoveringen av Karlavägen 71. Huvudentreprenör är Thessén & Ek, arkitekt Viktor Erlandsson & Artefacts AB.\n'+
      'Returnera ENBART ett JSON-objekt: {"leverantor":string,"fakturanummer":string,"fakturadatum":"YYYY-MM-DD","forfallodatum":"YYYY-MM-DD","typ":"Grund"|"ÄTA","projekt":string,"exklMoms":number,"moms":number,"oresavrundning":number,"rotAvdrag":number,"attBetala":number,'+
      '"rader":[{"text":string,"belopp":number,"post":string,"slag":string}]}.\n'+
      'Belopp i kronor som tal (punkt som decimaltecken). Radbelopp exkl. moms. rotAvdrag som positivt tal, 0 om inget. typ = "ÄTA" om fakturan avser ÄTA/tilläggsarbeten, annars "Grund".\n'+
      'Läs ALLA sidor, även bilagor. Raderna ska vara fakturans egna rader (inte bilagornas). Slå ihop rader av samma slag och moment, högst 15 rader. Raderna ska tillsammans bli exklMoms.\n'+
      'Lägg till fältet "bilagor": [{"leverantor":string,"nummer":string,"exklMoms":number}] för underleverantörsfakturor och kvitton som bifogas, och fältet "sidor": antal sidor du har läst.\n'+
      'post = id för den post i Ny budget som raden bäst hör till, eller "" om oklart. Poster: '+posts.map(function(p){return p.id+' = '+p.name;}).join('; ')+'.\n'+
      'Regler: arbetsledning, förbrukningsmaterial, transporter, servicebil, parkering och maskinhyra hör till allm. Arbeten i en ÄTA hör till respektive ÄTA-post, eller ata1 om ingen annan passar. Arkitektarvode hör till ark.\n'+
      'slag = en av: '+slags.join(', ')+'.\n'+
      (text ? '\nFAKTURANS TEXT:\n'+text.slice(0,180000) : '\nFakturan finns i bifogade bilder.'); };
    var go = function(text, imgs){
      var opts = { modelTier:'default' }; if(imgs && imgs.length) opts.images = imgs;
      progress('Claude läser…');
      return invSample.json(prompt(text), opts);
    };
    var p;
    if(isImg){ info = '1 bild'; p = invImgOk ? go('', [file]) : Promise.reject({code:'images_unavailable'}); }
    else p = file.arrayBuffer().then(pdfDoc).then(function(doc){
      return pdfPages(doc).then(function(pages){
        var textPages = pages.filter(function(x){return !x.scanned;}), scanPages = pages.filter(function(x){return x.scanned;}).map(function(x){return x.n;});
        var text = textPages.map(function(x){return '--- Sida '+x.n+' av '+doc.numPages+' ---\n'+x.text;}).join('\n');
        if(text.length > 180000) text = text.slice(0,180000);
        info = doc.numPages+' sidor: '+textPages.length+' med text'+(scanPages.length?', '+scanPages.length+' inskannade (sidorna '+scanPages.join(', ')+')':'');
        if(scanPages.length && !invImgOk){
          info += '. De inskannade sidorna kan inte skickas som bild här och ingår inte';
          if(!textPages.length) throw {code:'images_unavailable'};
          return go(text);
        }
        if(!scanPages.length) return go(text);
        progress('Förbereder '+scanPages.length+' inskannade sidor…');
        return pagesToImages(doc, scanPages, invImgMax).then(function(imgs){
          info += ', skickade som '+imgs.length+' bild'+(imgs.length>1?'er':'');
          return go(text + '\n\nSidorna '+scanPages.join(', ')+' är inskannade och bifogas som bilder i sidordning'+(imgs.length<scanPages.length?' (flera sidor per bild)':'')+'.', imgs);
        });
      });
    });
    return p.then(function(j){ if(!j || typeof j!=='object') throw {code:'invalid_json'}; return { form: formFromJson(j, posts, slags), info: info }; });
  }
  function extractErr(e){
    var c = e && e.code;
    return {images_unavailable:'Filen saknar läsbar text och bilder kan inte skickas här.', not_granted:'Claude får inte användas i den här vyn.', rate_limited:'För många förfrågningar just nu.', invalid_json:'Claude kunde inte tolka fakturan.', cancelled:'Avbrutet.'}[c] || ('Kunde inte läsa filen'+(e&&e.message&&!c?' ('+e.message+')':'')+'.');
  }
  function supName(f){ return f.supplierId==='ny' ? String(f.supplierName||'').trim() : ((BASE_SUP.filter(function(x){return x.id===f.supplierId;})[0]||{}).name || ''); }
  function dupInfo(f, selfIdx){
    var nr = String(f.nr||'').trim().toLowerCase(); if(!nr) return '';
    var sid = f.supplierId==='ny' ? 'x-'+slugify(f.supplierName) : f.supplierId, hits = [];
    D.invoices.forEach(function(i){ if(String(i.nr).trim().toLowerCase()===nr && i.supplier===sid && !(invEditing && i.docId===invEditing)) hits.push((i.added?'tillagd':'inläst')+' faktura '+i.nr); });
    invQueue.forEach(function(q,k){ if(k!==selfIdx && q.form && q.status!=='sparad' && String(q.form.nr||'').trim().toLowerCase()===nr && (q.form.supplierId==='ny' ? 'x-'+slugify(q.form.supplierName) : q.form.supplierId)===sid) hits.push('även i kön ('+q.file.name+')'); });
    return hits.length ? 'Möjlig dubblett: '+hits.join(', ') : '';
  }
  function loadDraft(i){
    if(invQIdx>=0 && invQueue[invQIdx] && invQueue[invQIdx].status!=='sparad'){ readForm(); invQueue[invQIdx].form = clone(invForm); }
    var q = invQueue[i]; if(!q) return;
    invQIdx = i; invEditing = null; invFile = q.file; invDupArm = false;
    invForm = q.form ? clone(q.form) : blankForm();
    var d = dupInfo(invForm, i);
    invSetMsg(q.status==='klar' ? ('Utkast '+(i+1)+' av '+invQueue.length+' ('+q.info+'). Granska och spara.'+(d?' '+d+'.':'')) : q.status==='fel' ? q.err+' Fyll i fälten själv eller läs ut igen.' : 'Filen är inte utläst än.', d?'bad':(q.status==='fel'?'bad':'ok'));
  }
  function nextDraft(){
    for(var k=0;k<invQueue.length;k++){ var j = (invQIdx+1+k) % invQueue.length; if(invQueue[j].status==='klar' || invQueue[j].status==='fel') return j; }
    for(var m=0;m<invQueue.length;m++) if(invQueue[m].status==='väntar' || invQueue[m].status==='läser') return m;
    return -1;
  }
  function renderQueue(){
    if(!invQueue.length) return '';
    var st = {väntar:['','Väntar'], läser:['warn','Läser…'], klar:['ok','Klar att granska'], fel:['bad','Fel'], sparad:['ue','Sparad']};
    var nWait = invQueue.filter(function(q){return q.status==='väntar'||q.status==='fel';}).length, nSaved = invQueue.filter(function(q){return q.status==='sparad';}).length;
    var h = '<div class="nblwrap"><table class="nbl"><thead><tr><th>Fil</th><th>Status</th><th>Utläst</th><th></th></tr></thead><tbody>';
    invQueue.forEach(function(q,i){
      var f = q.form, d = f ? dupInfo(f, i) : '', s = st[q.status];
      h += '<tr'+(i===invQIdx?' class="qcur"':'')+'><td>'+(i===invQIdx?'<b>▸ ':'')+esc(q.file.name)+(i===invQIdx?'</b>':'')+'<span class="desc">'+(q.info?esc(q.info):Math.round(q.file.size/1024)+' kB')+'</span></td>'+
        '<td><span class="tag '+s[0]+'">'+s[1]+'</span>'+(q.status==='läser'&&q.prog?'<span class="desc">'+esc(q.prog)+'</span>':'')+(q.status==='fel'?'<span class="desc">'+esc(q.err)+'</span>':'')+'</td>'+
        '<td>'+(f ? esc(supName(f)||'?')+' '+esc(f.nr||'')+(f.exMoms!==''?' · '+esc(f.exMoms)+' kr exkl.':'')+(d?'<span class="desc diff-pos">'+esc(d)+'</span>':'') : '<span class="faint">–</span>')+'</td>'+
        '<td style="white-space:nowrap">'+(q.status!=='sparad' && i!==invQIdx ? '<button class="chip" data-qload="'+i+'">Granska</button> ' : '')+
          (q.status==='fel' && invSample ? '<button class="chip" data-qretry="'+i+'">Läs ut igen</button> ' : '')+
          (q.status!=='läser' && q.status!=='sparad' ? '<button class="nbreset" data-qdel="'+i+'" aria-label="Ta bort ur kön">×</button>' : '')+'</td></tr>';
    });
    h += '</tbody></table></div><div class="addrow">'+
      (invSample && nWait ? '<button class="chip askgo" id="inv-runq" '+(invQRunning?'disabled':'')+'>'+(invQRunning?'Läser…':'Läs ut '+(nWait>1?'alla '+nWait:'filen')+' med Claude')+'</button>' : '')+
      (invQRunning ? '<button class="chip" id="inv-stopq">Stoppa efter pågående</button>' : '')+
      '<button class="chip" id="inv-clearq" '+(invQRunning?'disabled':'')+'>Töm kön</button>'+
      '<span class="faint">'+invQueue.length+' filer · '+nSaved+' sparade</span></div>';
    return h;
  }
  function queueRender(){ var el = document.getElementById('inv-queue'); if(el){ el.innerHTML = renderQueue(); bindQueue(); } }
  function bindQueue(){
    var box = document.getElementById('inv-queue'); if(!box) return;
    box.querySelectorAll('[data-qload]').forEach(function(b){ b.addEventListener('click', function(){ loadDraft(+b.dataset.qload); addRender(); window.scrollTo(0, (document.getElementById('inv-form')||{}).offsetTop||0); }); });
    box.querySelectorAll('[data-qretry]').forEach(function(b){ b.addEventListener('click', function(){ var q = invQueue[+b.dataset.qretry]; q.status = 'väntar'; q.err = ''; runQueue(); }); });
    box.querySelectorAll('[data-qdel]').forEach(function(b){ b.addEventListener('click', function(){ var i = +b.dataset.qdel; if(i===invQIdx){ invQIdx = -1; invFile = null; invForm = blankForm(); invSetMsg(''); } else if(i<invQIdx) invQIdx--; invQueue.splice(i,1); addRender(); }); });
    var r = document.getElementById('inv-runq'); if(r) r.addEventListener('click', function(){ readForm(); runQueue(); });
    var sp = document.getElementById('inv-stopq'); if(sp) sp.addEventListener('click', function(){ invQStop = true; sp.disabled = true; sp.textContent = 'Stoppar…'; });
    var c = document.getElementById('inv-clearq'); if(c) c.addEventListener('click', function(){ invQueue = []; invQIdx = -1; invFile = null; if(!invEditing){ invForm = blankForm(); } invSetMsg(''); addRender(); });
  }
  function userTyping(){ var a = document.activeElement; return a && view.contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.id!=='inv-file'; }
  function runQueue(){
    if(invQRunning || !invSample) return;
    invQRunning = true; invQStop = false;
    if(current==='uppdatera' && !userTyping()) addRender(); else queueRender();
    var step = function(){
      var i = -1; for(var k=0;k<invQueue.length;k++) if(invQueue[k].status==='väntar'){ i = k; break; }
      if(i<0 || invQStop){ invQRunning = false; invQStop = false; if(current==='uppdatera' && !userTyping()) addRender(); else queueRender(); return; }
      var q = invQueue[i]; q.status = 'läser'; q.prog = 'Läser filen…'; queueRender();
      extractFile(q.file, function(t){ q.prog = t; queueRender(); }).then(function(res){
        q.status = 'klar'; q.form = res.form; q.info = res.info;
        if(invQIdx<0 || invQIdx===i){ var load = invQIdx<0 || !userTyping(); if(load){ invQIdx = -1; loadDraft(i); if(current==='uppdatera') addRender(); } else queueRender(); }
        else queueRender();
      }, function(e){ q.status = 'fel'; q.err = extractErr(e); if(invQIdx===i) invSetMsg(q.err+' Fyll i fälten själv eller läs ut igen.','bad'); queueRender(); })
      .then(step);
    };
    step();
  }
  function addFilesToQueue(files){
    var bad = [];
    Array.prototype.forEach.call(files, function(f){
      if(f.size > 20*1024*1024){ bad.push(f.name+' (över 20 MB)'); return; }
      if(!/pdf|png|jpe?g|webp/i.test(f.type||f.name)){ bad.push(f.name+' (filtypen stöds inte)'); return; }
      if(invQueue.some(function(q){ return q.file.name===f.name && q.file.size===f.size && q.status!=='sparad'; })){ bad.push(f.name+' (redan i kön)'); return; }
      invQueue.push({ id: ++invQSeq, file: f, status: 'väntar', form: null, info: '', err: '' });
    });
    if(invQIdx<0 && !invEditing){ var first = -1; for(var k=0;k<invQueue.length;k++) if(invQueue[k].status!=='sparad'){ first = k; break; } if(first>=0){ invQIdx = first; invFile = invQueue[first].file; } }
    invSetMsg(bad.length ? 'Hoppade över: '+bad.join(', ')+'.' : (invSample ? 'Filerna ligger i kön. Klicka "Läs ut" för att låta Claude fylla i uppgifterna.' : 'Filerna ligger i kön. Fyll i uppgifterna för varje faktura.'), bad.length?'bad':'');
  }

  function onAddedChange(){
    compute(); updateMeta(); buildTabs();
    var a = document.activeElement, typing = a && view.contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName);
    if(current==='uppdatera'){ var l = document.getElementById('inv-list'); if(typing && l){ l.innerHTML = renderAddedList(); bindAdd(); } else addRender(); }
    else if(!typing) show(current);
  }
  if(window.claude && typeof window.claude.use==='function'){
    window.claude.use('db').then(function(db){
      if(!db){ invState = 'off'; addRender(); return; }
      invDb = db; invState = 'on';
      db.doc('installningar/fakturor').onSnapshot(function(snap){
        if(snap.metadata && snap.metadata.hasPendingWrites) return;
        var d = snap.exists ? snap.data() : null; hiddenBase = (d && Array.isArray(d.dolda)) ? d.dolda.filter(function(x){return typeof x==='string';}) : [];
        onAddedChange();
      }, function(){});
      db.collection('fakturor').onSnapshot(function(snap){
        added = snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
        onAddedChange();
      }, function(){ invState = 'off'; addRender(); });
      addRender();
    }, function(){ invState = 'off'; addRender(); });
    window.claude.use('assets').then(function(a){ invAssets = a || null; addRender(); }, function(){});
    window.claude.use('sample').then(function(fn){ invSample = fn || null; if(fn && fn.limits) fn.limits().then(function(l){ invImgOk = !!(l && l.images); invImgMax = (l && l.images && l.images.maxCount) || 5; }, function(){}); addRender(); }, function(){});
  } else invState = 'off';

  var start = 'sammanstallning';
  try{ start = (location.hash||'').slice(1) || localStorage.getItem('kv71-tab') || start; }catch(e){}
  show(start);
})();
