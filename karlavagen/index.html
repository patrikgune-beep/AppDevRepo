  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141a1b; --surface:#1c2426; --surface-2:#242d2f; --line:#324043;
  --ink:#e7ebe8; --ink-2:#a7b1ae; --ink-3:#77827f;
  --accent:#e0a14f; --accent-soft:#3a2d1b;
  --good:#7cc08c; --good-soft:#1f3326; --bad:#ec8b78; --bad-soft:#3d2320;
  --warn:#e3bb57; --warn-soft:#3a3017;
  --ata:#a9a8e8; --ata-soft:#2a2a45;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,36px);font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font:600 11px/1.2 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
header.top .meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.tag{display:inline-block;font:600 11px/1 var(--body);padding:4px 7px;border-radius:4px;letter-spacing:.03em;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.ata{background:var(--ata-soft);color:var(--ata)}
.tag.grund{background:var(--surface-2);color:var(--ink-2)}
.tag.ue{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:24px;scrollbar-width:none}
nav.tabs button{font:600 14px/1 var(--body);color:var(--ink-2);background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px 11px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs .sub{font-weight:500;color:var(--ink-3);margin-left:6px;font-size:12px}

section.panel{display:grid;gap:28px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:grid;gap:4px;align-content:start}
.kpi .v{font:700 24px/1.15 var(--display);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink-2)}
.kpi.missing .v{color:var(--warn)}

.block{display:grid;gap:12px}
.block>.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11.5px/1.3 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0;background:var(--surface-2)}
tr.sub td{background:var(--surface-2);font-weight:600}
tr.paslag td{color:var(--accent)}
td .desc{display:block;font-size:12.5px;color:var(--ink-2)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);position:relative;min-width:90px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.diff-pos{color:var(--bad);font-weight:600} .diff-neg{color:var(--good);font-weight:600}

.banner{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner b{color:var(--warn)}
.banner p{margin:0}

.checks{display:grid;gap:0}
.check{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check p{margin:0;font-size:14px}
.check .t{font-weight:600}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px;align-items:start}

details.inv{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
details.inv>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
details.inv>summary::-webkit-details-marker{display:none}
details.inv>summary .l{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
details.inv>summary .nr{font:700 17px/1.2 var(--display)}
details.inv>summary .amt{font:700 18px/1.2 var(--display);font-variant-numeric:tabular-nums;text-align:right}
details.inv>summary .amt small{display:block;font:500 12px/1.3 var(--body);color:var(--ink-2)}
details.inv>summary::before{content:"";grid-column:1/-1;display:none}
details.inv[open]>summary{border-bottom:1px solid var(--line)}
.chev{display:inline-block;transition:transform .15s;color:var(--ink-3)}
details[open]>summary .chev{transform:rotate(90deg)}
.invbody{padding:6px 4px 12px}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;padding:10px 12px 4px;font-size:13px;color:var(--ink-2)}
.facts b{color:var(--ink);font-weight:600}
details.ue{margin:0}
details.ue>summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center;color:var(--accent);font-size:12.5px;font-weight:600;margin-top:4px}
details.ue>summary::-webkit-details-marker{display:none}
.uebox{margin:8px 0 4px;border-left:2px solid var(--accent-soft);padding-left:10px}
.uebox table{font-size:13px}
.uebox td,.uebox th{padding:5px 8px}

.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px/1 var(--body);padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{display:grid;gap:10px}
.group>h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.foot{font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:14px}
code{font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
@media (max-width:560px){

  td,th{padding:8px 8px}
  .kpi .v{font-size:21px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

<script>
(function(){
  var D = JSON.parse(document.getElementById('kv-data').textContent);
  var OWN = 'Thessén & Ek (egen personal)';
  var fmt0 = new Intl.NumberFormat('sv-SE',{maximumFractionDigits:0});
  var fmt2 = new Intl.NumberFormat('sv-SE',{minimumFractionDigits:2,maximumFractionDigits:2});
  function kr(v){ return fmt0.format(Math.round(v)) + ' kr'; }
  function k2(v){ return v==null ? '' : fmt2.format(v); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function r2(v){ return Math.round(v*100)/100; }
  function fmtDate(d){ var p=d.split('-'); return +p[2]+'/'+(+p[1])+' '+p[0]; }

  var supById = {}; D.suppliers.forEach(function(s){ supById[s.id]=s; });
  var ueById = {}; D.ue.forEach(function(u){
    u.lineSum = u.lines.reduce(function(a,l){return a+l.amount;},0);
    u.cost = r2(u.lineSum + (u.rounding||0));
    u.billed = 0; u.billedIn = []; ueById[u.id]=u;
  });
  D.invoices.forEach(function(inv){
    inv.lines.forEach(function(l){
      if(l.ue){ var u=ueById[l.ue]; u.billed=r2(u.billed+l.amount); u.billedIn.push({inv:inv.id, amount:l.amount, kind:inv.kind}); }
    });
    inv.calc = r2(inv.lines.reduce(function(a,l){return a+l.amount;},0));
    inv.total = r2(inv.exMoms + inv.moms + (inv.rounding||0));
  });
  D.ue.forEach(function(u){ u.markup = u.billed - u.cost; u.rate = u.cost ? u.markup/u.cost : 0; });

  /* Flat list of cost rows. Every row carries amount ex moms and origin. */
  var rows = [];
  D.invoices.forEach(function(inv){
    var sup = supById[inv.supplier];
    inv.lines.forEach(function(l){
      if(l.ue) return;
      rows.push({ supplier:inv.supplier, source: inv.supplier==='thessen'? OWN : sup.short, inv:inv.id, kind:inv.kind,
        text:l.text, desc:l.desc, qty:l.qty, unit:l.unit, price:l.price, amount:l.amount, moment:l.moment, slag:l.slag });
    });
  });
  D.ue.forEach(function(u){
    var kinds = u.billedIn.map(function(b){return b.kind;}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(' + ');
    var invs = u.billedIn.map(function(b){return b.inv;}).join(', ');
    u.lines.forEach(function(l){
      var share = u.lineSum ? l.amount/u.lineSum : 0;
      rows.push({ supplier:'thessen', source:u.short, ue:u.id, inv:invs, kind:kinds, text:l.text, desc:l.desc, qty:l.qty, unit:l.unit, price:l.price,
        amount:l.amount, moment:l.moment, slag:l.slag });
      rows.push({ supplier:'thessen', source:u.short, ue:u.id, inv:invs, kind:kinds, paslag:true, text:'Påslag på '+l.text,
        amount: u.markup*share, moment:l.moment, slag:'Påslag UE (12 %)', baseSlag:l.slag });
    });
    if(u.rounding){
      rows.push({ supplier:'thessen', source:u.short, ue:u.id, inv:invs, kind:kinds, text:'Öresavrundning', amount:u.rounding, moment:u.lines[0].moment, slag:'Försäkring & avgifter' });
    }
  });

  var B = D.budget;
  function postFor(r){
    var s = r.baseSlag || r.slag;
    return (B.slagToPost && B.slagToPost[s]) || (B.momentToPost && B.momentToPost[r.moment]) || 'Ej kopplad';
  }
  rows.forEach(function(r){ r.post = postFor(r); });

  function sum(list){ return list.reduce(function(a,r){return a+r.amount;},0); }
  function groupSum(list,key){ var m={}; list.forEach(function(r){ m[r[key]]=(m[r[key]]||0)+r.amount; }); return m; }

  var totEx = D.invoices.reduce(function(a,i){return a+i.exMoms;},0);
  var totMoms = D.invoices.reduce(function(a,i){return a+i.moms;},0);
  var totInkl = D.invoices.reduce(function(a,i){return a+i.total;},0);
  var totRot = D.invoices.reduce(function(a,i){return a+(i.rot||0);},0);
  var totPay = D.invoices.reduce(function(a,i){return a+i.toPay;},0);
  var totMarkup = D.ue.reduce(function(a,u){return a+u.markup;},0);
  var rowsTotal = sum(rows);
  var reconciled = Math.abs(rowsTotal - totEx) < 0.05 && D.invoices.every(function(i){return Math.abs(i.calc-i.exMoms)<0.05;});

  document.getElementById('meta').innerHTML =
    '<span>Uppdaterad '+fmtDate(D.updated)+'</span><span>'+D.invoices.length+' fakturor · '+D.ue.length+' underlag</span>'+
    (reconciled ? '<span class="tag ok">Avstämt mot fakturor</span>' : '<span class="tag bad">Avstämning avviker</span>');

  /* ---------- Tabs ---------- */
  var tabs = [{id:'sammanstallning', label:'Sammanställning'}];
  D.suppliers.forEach(function(s){
    var n = D.invoices.filter(function(i){return i.supplier===s.id;}).length;
    tabs.push({id:'lev-'+s.id, label:s.short, sub:n+' fakt.'});
  });
  tabs.push({id:'detaljer', label:'Detaljer'});
  tabs.push({id:'uppdatera', label:'Lägg till faktura'});

  var nav = document.getElementById('tabs');
  var view = document.getElementById('view');
  nav.innerHTML = tabs.map(function(t){
    return '<button role="tab" id="tab-'+t.id+'" data-tab="'+t.id+'" aria-selected="false">'+esc(t.label)+(t.sub?'<span class="sub">'+t.sub+'</span>':'')+'</button>';
  }).join('');
  nav.addEventListener('click',function(e){ var b=e.target.closest('button[data-tab]'); if(b) show(b.dataset.tab); });

  var current, vatMode = 'inkl';
  try{ vatMode = localStorage.getItem('kv71-vat') || 'inkl'; }catch(e){}
  function show(id){
    if(!tabs.some(function(t){return t.id===id;})) id='sammanstallning';
    current=id;
    Array.prototype.forEach.call(nav.children,function(b){ b.setAttribute('aria-selected', b.dataset.tab===id?'true':'false'); });
    if(id==='sammanstallning') view.innerHTML = renderSummary();
    else if(id==='detaljer') view.innerHTML = renderDetails();
    else if(id==='uppdatera') view.innerHTML = renderHowTo();
    else view.innerHTML = renderSupplier(id.slice(4));
    try{ localStorage.setItem('kv71-tab', id); }catch(e){}
    if(id==='detaljer') bindDetails();
    if(id==='sammanstallning') view.querySelectorAll('[data-vat]').forEach(function(c){
      c.addEventListener('click',function(){ vatMode=c.dataset.vat; try{localStorage.setItem('kv71-vat',vatMode);}catch(e){} show('sammanstallning'); });
    });
  }

  /* ---------- Sammanställning ---------- */
  function renderSummary(){
    var b = B, hasBudget = b.received && b.posts && b.posts.length>0;
    var inkl = vatMode==='inkl';
    var bf = b.vatIncluded ? (inkl?1:1/1.25) : (inkl?1.25:1);   // offer → display
    var af = inkl ? 1.25 : 1;                                   // actual (exkl.) → display
    var byPost = groupSum(rows,'post');
    var posts = hasBudget ? b.posts.map(function(p){return p.name;}) : [];
    Object.keys(byPost).forEach(function(p){ if(posts.indexOf(p)<0) posts.push(p); });
    var budgetOf = {}; if(hasBudget) b.posts.forEach(function(p){ budgetOf[p.name]=p.amount; });
    var inclOf = {}; if(hasBudget) b.posts.forEach(function(p){ inclOf[p.name]=p.incl; });
    var budgetTot = hasBudget ? b.posts.reduce(function(a,p){return a+p.amount;},0) : null; // as stated in offer
    var ata = D.invoices.filter(function(i){return i.kind==='ÄTA';}).reduce(function(a,i){return a+i.exMoms;},0);

    var h = '<section class="panel">';
    if(!hasBudget){
      h += '<div class="banner"><div><p><b>Budget saknas.</b> '+esc(b.note)+'</p></div></div>';
    }
    h += '<div class="kpis">'+
      kpi('Fakturerat inkl. moms', kr(totInkl), 'exkl. moms '+kr(totEx)+' · varav ÄTA '+kr(ata*1.25)+' inkl.') +
      (hasBudget ? kpi('Offert inkl. moms', kr(budgetTot), 'före ROT · '+esc(b.source.split(',')[0])) : kpi('Budget','Saknas','skicka offerten i chatten','missing')) +
      (hasBudget ? kpi('Förbrukat av offerten', fmt0.format(totInkl/budgetTot*100)+' %', 'kvar '+kr(budgetTot-totInkl)+' inkl. moms') : '') +
      kpi('ROT-avdrag', '−'+kr(totRot), (hasBudget&&b.rot? 'offerten räknar med −'+kr(b.rot) : 'på faktura 132354')) +
      kpi('Att betala totalt', kr(totPay), 'efter ROT, inkl. moms') +
      '</div>';

    // Offert mot utfall
    h += '<div class="block"><div class="head"><div><h2>Offert mot utfall per offertpost</h2><p class="muted" style="margin:4px 0 0;font-size:13px">'+esc(b.source||'')+'. Påslaget räknas på samma post som raden det hör till.</p></div>'+
      '<div class="filters" role="group" aria-label="Moms"><button class="chip" data-vat="inkl" aria-pressed="'+inkl+'">Inkl. moms</button><button class="chip" data-vat="exkl" aria-pressed="'+(!inkl)+'">Exkl. moms</button></div></div>'+
      '<div class="card scroll"><table><thead><tr><th>Offertpost</th><th class="n">Offert</th><th class="n">Utfall</th><th class="n">Kvar</th><th style="width:24%">Förbrukat</th></tr></thead><tbody>';
    var sumB=0, sumA=0;
    posts.forEach(function(p){
      var a = (byPost[p]||0)*af, bv = budgetOf[p]!=null ? budgetOf[p]*bf : null;
      sumA += a; if(bv) sumB += bv;
      var left = bv==null ? null : bv - a;
      var pct = bv ? a/bv*100 : (a>0?Infinity:0);
      var over = pct>100;
      var barW = Math.min(pct,100);
      h += '<tr><td>'+esc(p)+(inclOf[p]?'<span class="desc">'+esc(inclOf[p])+'</span>':'')+'</td>'+
        '<td class="n">'+(bv==null?'<span class="faint">—</span>':kr(bv))+'</td>'+
        '<td class="n">'+(a?kr(a):'<span class="faint">0</span>')+'</td>'+
        '<td class="n">'+(left==null?'<span class="faint">—</span>':'<span class="'+(left<0?'diff-pos':'')+'">'+(left<0?'−'+kr(-left):kr(left))+'</span>')+'</td>'+
        '<td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><i style="width:'+barW.toFixed(1)+'%;'+(over?'background:var(--bad)':'')+'"></i></div><span class="num '+(over?'diff-pos':'faint')+'" style="min-width:44px">'+(isFinite(pct)?fmt0.format(pct)+' %':(a?'utanför':''))+'</span></div></td></tr>';
    });
    h += '<tr class="total"><td>Totalt</td><td class="n">'+(hasBudget?kr(sumB):'—')+'</td><td class="n">'+kr(sumA)+'</td><td class="n">'+(hasBudget?kr(sumB-sumA):'—')+'</td><td class="num">'+(hasBudget?fmt0.format(sumA/sumB*100)+' %':'')+'</td></tr>';
    if(hasBudget && b.rot){
      h += '<tr><td>ROT-avdrag</td><td class="n">−'+kr(b.rot)+'</td><td class="n">−'+kr(totRot)+'</td><td class="n">'+kr(b.rot-totRot)+' outnyttjat</td><td></td></tr>';
    }
    h += '</tbody></table></div>';
    if(hasBudget && b.rates){
      h += '<div class="card scroll"><table><thead><tr><th>Avtalat pris</th><th class="n">Offert</th><th class="n">Fakturerat</th><th>Kommentar</th></tr></thead><tbody>';
      b.rates.forEach(function(r){
        var ok = typeof r.offer==='number' ? r.billed<=r.offer : r.billed===r.offer;
        h += '<tr><td>'+esc(r.what)+'</td><td class="n">'+(typeof r.offer==='number'?kr(r.offer)+'/'+(r.what.indexOf('dag')>0?'dag':'h'):esc(r.offer))+'</td><td class="n">'+(typeof r.billed==='number'?kr(r.billed):esc(r.billed))+'</td><td><span class="tag '+(ok?'ok':'bad')+'">'+(ok?'OK':'Över')+'</span> <span class="muted">'+esc(r.note)+'</span></td></tr>';
      });
      h += '</tbody></table></div><p class="faint" style="margin:0;font-size:12.5px">Timpriserna i offerten är inkl. moms.</p>';
    }
    h += '</div>';

    // Per leverantör + per kostnadsslag
    var bySource = groupSum(rows.filter(function(r){return !r.paslag;}),'source');
    h += '<div class="grid2">';
    h += '<div class="block"><div class="head"><h2>Per fakturerande leverantör</h2></div><div class="card scroll"><table><thead><tr><th>Leverantör</th><th class="n">Exkl. moms</th><th class="n">Inkl. moms</th><th class="n">Att betala</th></tr></thead><tbody>';
    D.suppliers.forEach(function(s){
      var inv = D.invoices.filter(function(i){return i.supplier===s.id;});
      h += '<tr><td>'+esc(s.name)+'<span class="desc">'+esc(s.role)+' · '+inv.length+' fakturor</span></td><td class="n">'+kr(inv.reduce(function(a,i){return a+i.exMoms;},0))+'</td><td class="n">'+kr(inv.reduce(function(a,i){return a+i.total;},0))+'</td><td class="n">'+kr(inv.reduce(function(a,i){return a+i.toPay;},0))+'</td></tr>';
    });
    h += '<tr class="total"><td>Totalt</td><td class="n">'+kr(totEx)+'</td><td class="n">'+kr(totInkl)+'</td><td class="n">'+kr(totPay)+'</td></tr></tbody></table></div></div>';

    h += '<div class="block"><div class="head"><h2>Vem har utfört arbetet</h2><span class="muted">exkl. moms</span></div><div class="card scroll"><table><thead><tr><th>Utförare</th><th class="n">Kostnad</th><th class="n">Andel</th></tr></thead><tbody>';
    Object.keys(bySource).sort(function(a,b){return bySource[b]-bySource[a];}).forEach(function(s){
      h += '<tr><td>'+esc(s)+'</td><td class="n">'+kr(bySource[s])+'</td><td class="n">'+fmt0.format(bySource[s]/totEx*100)+' %</td></tr>';
    });
    h += '<tr class="paslag"><td>Påslag Thessén på UE och material</td><td class="n">'+kr(totMarkup)+'</td><td class="n">'+fmt0.format(totMarkup/totEx*100)+' %</td></tr>';
    h += '<tr class="total"><td>Totalt</td><td class="n">'+kr(totEx)+'</td><td class="n">100 %</td></tr></tbody></table></div></div>';
    h += '</div>';

    // Fakturaförteckning
    var today = D.updated;
    h += '<div class="block"><div class="head"><h2>Alla fakturor</h2><span class="muted">sorterat på fakturadatum</span></div><div class="card scroll"><table><thead><tr><th>Datum</th><th>Leverantör</th><th>Nr</th><th>Typ</th><th class="n">Exkl. moms</th><th class="n">Inkl. moms</th><th class="n">Att betala</th><th>Förfaller</th></tr></thead><tbody>';
    D.invoices.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(i){
      var dueTag = i.due < today ? '<span class="tag">'+fmtDate(i.due)+'</span>' : '<span class="tag warn">'+fmtDate(i.due)+'</span>';
      h += '<tr><td class="num" style="text-align:left">'+fmtDate(i.date)+'</td><td>'+esc(supById[i.supplier].short)+'</td><td>'+esc(i.nr)+'</td><td><span class="tag '+(i.kind==='ÄTA'?'ata':'grund')+'">'+i.kind+'</span></td><td class="n">'+kr(i.exMoms)+'</td><td class="n">'+kr(i.total)+'</td><td class="n">'+kr(i.toPay)+'</td><td>'+dueTag+'</td></tr>';
    });
    h += '</tbody></table></div><p class="faint" style="margin:0;font-size:12.5px">Gul förfallodag = ligger efter '+fmtDate(today)+'. Betalstatus registreras inte i appen.</p></div>';

    // Att kontrollera
    h += '<div class="block"><div class="head"><h2>Att kontrollera</h2></div><div class="card checks">';
    D.checks.forEach(function(c){
      h += '<div class="check"><span class="tag '+(c.level==='warn'?'warn':'')+'">'+(c.level==='warn'?'Åtgärd':'Info')+'</span><div><p class="t">'+esc(c.title)+'</p><p class="muted">'+esc(c.text)+'</p></div></div>';
    });
    h += '</div></div>';
    h += '<p class="foot">Alla belopp i SEK. Utfall per arbetsmoment och utförare räknas exkl. moms. Påslaget fördelas på samma moment som den rad det hör till.</p>';
    return h + '</section>';
  }
  function kpi(label,v,s,cls){ return '<div class="kpi '+(cls||'')+'"><span class="eyebrow">'+label+'</span><span class="v">'+v+'</span><span class="s">'+s+'</span></div>'; }

  /* ---------- Leverantörsflik ---------- */
  function renderSupplier(sid){
    var s = supById[sid];
    var inv = D.invoices.filter(function(i){return i.supplier===sid;}).sort(function(a,b){return a.date<b.date?-1:1;});
    var ex = inv.reduce(function(a,i){return a+i.exMoms;},0), tot = inv.reduce(function(a,i){return a+i.total;},0), pay = inv.reduce(function(a,i){return a+i.toPay;},0);
    var h = '<section class="panel"><div class="block"><div class="head"><div><div class="eyebrow">'+esc(s.role)+' · org.nr '+esc(s.orgnr)+' · ref. '+esc(s.contact)+'</div><h2 style="font-size:24px;margin-top:4px">'+esc(s.name)+'</h2></div></div>';
    h += '<div class="kpis">'+kpi('Exkl. moms',kr(ex),inv.length+' fakturor')+kpi('Inkl. moms',kr(tot),'moms '+kr(tot-ex))+kpi('Att betala',kr(pay),'efter ROT-avdrag');
    if(sid==='thessen'){
      var ueb = D.ue.reduce(function(a,u){return a+u.billed;},0);
      h += kpi('Vidarefakturerat',kr(ueb),'varav påslag '+kr(totMarkup));
    }
    h += '</div></div><div class="block">';
    inv.forEach(function(i, idx){ h += invoiceCard(i, idx===inv.length-1); });
    h += '</div>';
    if(sid==='thessen'){
      h += '<div class="block"><div class="head"><h2>Underleverantörsfakturor</h2><span class="muted">bilagor som Thessén vidarefakturerat</span></div><div class="card scroll"><table><thead><tr><th>Underleverantör</th><th>Nr</th><th>Datum</th><th class="n">Kostnad UE</th><th class="n">Fakturerat</th><th class="n">Påslag</th><th>På Thessén-faktura</th></tr></thead><tbody>';
      D.ue.forEach(function(u){
        h += '<tr><td>'+esc(u.vendor)+'<span class="desc">'+esc(u.period)+'</span></td><td>'+esc(u.nr)+'</td><td class="num" style="text-align:left">'+fmtDate(u.date)+'</td><td class="n">'+k2(u.cost)+'</td><td class="n">'+k2(u.billed)+'</td><td class="n">'+fmt2.format(u.rate*100)+' %</td><td>'+u.billedIn.map(function(b){return esc(b.inv)+' <span class="tag '+(b.kind==='ÄTA'?'ata':'grund')+'">'+b.kind+'</span>';}).join('<br>')+'</td></tr>';
      });
      var c = D.ue.reduce(function(a,u){return a+u.cost;},0), bl = D.ue.reduce(function(a,u){return a+u.billed;},0);
      h += '<tr class="total"><td colspan="3">Totalt</td><td class="n">'+k2(c)+'</td><td class="n">'+k2(bl)+'</td><td class="n">'+fmt2.format((bl/c-1)*100)+' %</td><td></td></tr></tbody></table></div></div>';
    }
    return h + '</section>';
  }

  function invoiceCard(i, open){
    var ok = Math.abs(i.calc - i.exMoms) < 0.05;
    var h = '<details class="inv"'+(open?' open':'')+'><summary><div class="l"><span class="chev">▸</span><span class="nr">Faktura '+esc(i.nr)+'</span><span class="tag '+(i.kind==='ÄTA'?'ata':'grund')+'">'+i.kind+'</span><span class="muted">'+fmtDate(i.date)+'</span>'+(ok?'':'<span class="tag bad">Rader ≠ total</span>')+'</div>'+
      '<div class="amt">'+kr(i.toPay)+'<small>exkl. moms '+kr(i.exMoms)+'</small></div></summary><div class="invbody">';
    h += '<div class="facts"><span>Projekt <b>'+esc(i.project)+'</b></span><span>Förfaller <b>'+fmtDate(i.due)+'</b></span><span>Moms <b>'+k2(i.moms)+'</b></span>'+(i.rot?'<span>ROT-avdrag <b>−'+k2(i.rot)+'</b></span>':'')+(i.rounding?'<span>Öresavrundning <b>'+k2(i.rounding)+'</b></span>':'')+'</div>';
    h += '<div class="scroll"><table><thead><tr><th>Rad</th><th class="n">Antal</th><th class="n">À-pris</th><th class="n">Belopp</th><th>Arbetsmoment</th></tr></thead><tbody>';
    i.lines.forEach(function(l){
      if(l.ue){
        var u = ueById[l.ue];
        var share = u.billed ? l.amount/u.billed : 1;
        h += '<tr><td>'+esc(l.text)+' <span class="tag ue">UE</span>'+
          '<details class="ue"><summary>Visa underlag · kostnad '+k2(u.cost*share)+' + påslag '+k2(u.markup*share)+'</summary><div class="uebox">'+ueTable(u)+'</div></details></td>'+
          '<td class="n"></td><td class="n"></td><td class="n">'+k2(l.amount)+'</td><td>'+esc(momentsOf(u))+'</td></tr>';
      } else {
        h += '<tr><td>'+esc(l.text)+(l.desc?'<span class="desc">'+esc(l.desc)+'</span>':'')+'</td><td class="n">'+(l.qty!=null?fmt2.format(l.qty).replace(/,00$/,'')+' '+esc(l.unit||''):'')+'</td><td class="n">'+k2(l.price)+'</td><td class="n">'+k2(l.amount)+'</td><td>'+esc(l.moment)+'</td></tr>';
      }
    });
    h += '<tr class="total"><td>Summa exkl. moms</td><td></td><td></td><td class="n">'+k2(i.exMoms)+'</td><td></td></tr></tbody></table></div></div></details>';
    return h;
  }
  function momentsOf(u){ return u.lines.map(function(l){return l.moment;}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(', '); }
  function ueTable(u){
    var h = '<p class="muted" style="margin:4px 0 6px;font-size:12.5px"><b>'+esc(u.vendor)+'</b> nr '+esc(u.nr)+' · '+fmtDate(u.date)+' · '+esc(u.period)+'<br>'+esc(u.desc)+'</p><div class="scroll"><table><tbody>';
    u.lines.forEach(function(l){
      h += '<tr><td>'+esc(l.text)+(l.desc?'<span class="desc">'+esc(l.desc)+'</span>':'')+'</td><td class="n">'+(l.qty!=null?fmt2.format(l.qty).replace(/,00$/,'')+' '+esc(l.unit||''):'')+'</td><td class="n">'+k2(l.amount)+'</td><td class="faint">'+esc(l.slag)+'</td></tr>';
    });
    if(u.rounding) h += '<tr><td>Öresavrundning</td><td></td><td class="n">'+k2(u.rounding)+'</td><td></td></tr>';
    h += '<tr class="sub"><td>Kostnad UE exkl. moms</td><td></td><td class="n">'+k2(u.cost)+'</td><td></td></tr>';
    h += '<tr class="paslag"><td>Påslag Thessén '+fmt2.format(u.rate*100)+' %</td><td></td><td class="n">'+k2(u.markup)+'</td><td></td></tr>';
    h += '<tr class="sub"><td>Vidarefakturerat</td><td></td><td class="n">'+k2(u.billed)+'</td><td></td></tr>';
    return h + '</tbody></table></div>';
  }

  /* ---------- Detaljer ---------- */
  var detailFilter = 'Alla';
  function renderDetails(){
    var list = detailFilter==='Alla' ? rows : rows.filter(function(r){return r.moment===detailFilter;});
    var tot = sum(list);
    var sources = [OWN,'Hard Workers','Beijer','HLL','Sortera / Big Bag','Engblom (konstruktör)','Arkitekt V. Erlandsson'];
    rows.forEach(function(r){ if(sources.indexOf(r.source)<0) sources.push(r.source); });
    sources = sources.filter(function(s){ return list.some(function(r){return r.source===s;}); });

    var h = '<section class="panel">';
    h += '<div class="block"><div class="head"><h2>Detaljer per kostnadsslag och utförare</h2><span class="muted">exkl. moms · '+kr(tot)+'</span></div>';
    h += '<div class="filters" role="group" aria-label="Filtrera på arbetsmoment">';
    ['Alla'].concat(D.moments).forEach(function(m){
      if(m!=='Alla' && !rows.some(function(r){return r.moment===m;})) return;
      h += '<button class="chip" data-moment="'+esc(m)+'" aria-pressed="'+(m===detailFilter)+'">'+esc(m)+'</button>';
    });
    h += '</div>';

    // Matrix
    h += '<div class="card scroll"><table><thead><tr><th>Kostnadsslag</th>';
    sources.forEach(function(s){ h += '<th class="n">'+esc(s.replace(' (egen personal)',' egen'))+'</th>'; });
    h += '<th class="n">Totalt</th><th class="n">Andel</th></tr></thead><tbody>';
    D.slag.forEach(function(sl){
      var r = list.filter(function(x){return x.slag===sl;}); if(!r.length) return;
      var rs = sum(r);
      h += '<tr'+(sl.indexOf('Påslag')===0?' class="paslag"':'')+'><td>'+esc(sl)+'</td>';
      sources.forEach(function(s){ var v = sum(r.filter(function(x){return x.source===s;})); h += '<td class="n">'+(v?kr(v):'<span class="faint">·</span>')+'</td>'; });
      h += '<td class="n"><b>'+kr(rs)+'</b></td><td class="n">'+fmt0.format(rs/tot*100)+' %</td></tr>';
    });
    h += '<tr class="total"><td>Totalt</td>';
    sources.forEach(function(s){ h += '<td class="n">'+kr(sum(list.filter(function(x){return x.source===s;})))+'</td>'; });
    h += '<td class="n">'+kr(tot)+'</td><td class="n">100 %</td></tr></tbody></table></div></div>';

    // Per leverantör → underleverantör
    D.suppliers.forEach(function(s){
      var sl = list.filter(function(r){return r.supplier===s.id;}); if(!sl.length) return;
      h += '<div class="group"><h3 style="font-size:19px">'+esc(s.name)+' <span class="muted" style="font:500 14px var(--body)">'+kr(sum(sl))+'</span></h3>';
      var subs = [];
      sl.forEach(function(r){ if(subs.indexOf(r.source)<0) subs.push(r.source); });
      subs.forEach(function(src){
        var sr = sl.filter(function(r){return r.source===src;});
        var isUE = sr.some(function(r){return r.ue;});
        h += '<div class="card"><div style="padding:12px 14px 4px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h3>'+esc(src)+' '+(isUE?'<span class="tag ue">Underleverantör</span>':'')+'</h3><span class="num"><b>'+kr(sum(sr))+'</b></span></div>';
        h += '<div class="scroll"><table><thead><tr><th>Rad</th><th>Faktura</th><th>Arbetsmoment</th><th>Kostnadsslag</th><th>Offertpost</th><th class="n">Antal</th><th class="n">Belopp</th></tr></thead><tbody>';
        var byUe = {};
        sr.forEach(function(r){
          if(r.paslag){ var k=r.ue; byUe[k]=(byUe[k]||0)+r.amount; return; }
          h += '<tr><td>'+esc(r.text)+(r.desc?'<span class="desc">'+esc(r.desc)+'</span>':'')+'</td><td class="faint">'+esc(r.ue?ueById[r.ue].nr+' → '+r.inv:r.inv)+'</td><td>'+esc(r.moment)+'</td><td>'+esc(r.slag)+'</td><td class="faint">'+esc(r.post)+'</td><td class="n">'+(r.qty!=null?fmt2.format(r.qty).replace(/,00$/,'')+' '+esc(r.unit||''):'')+'</td><td class="n">'+k2(r.amount)+'</td></tr>';
        });
        Object.keys(byUe).forEach(function(k){
          h += '<tr class="paslag"><td>Påslag Thessén 12 % på '+esc(ueById[k].nr)+'</td><td class="faint">→ '+esc(ueById[k].billedIn.map(function(b){return b.inv;}).join(', '))+'</td><td></td><td>Påslag UE (12 %)</td><td></td><td></td><td class="n">'+k2(byUe[k])+'</td></tr>';
        });
        h += '</tbody></table></div></div>';
      });
      h += '</div>';
    });
    return h + '</section>';
  }
  function bindDetails(){
    view.querySelectorAll('.chip').forEach(function(c){
      c.addEventListener('click',function(){ detailFilter=c.dataset.moment; show('detaljer'); });
    });
  }

  /* ---------- Så uppdaterar du ---------- */
  function renderHowTo(){
    return '<section class="panel"><div class="block" style="max-width:68ch"><h2>Lägga till nya fakturor</h2>'+
      '<p>Appen uppdateras via chatten med Claude. Ladda upp den nya fakturan som PDF och skriv till exempel <code>Ny faktura från Thessén</code>. Bilagorna från underleverantörerna läses också.</p>'+
      '<p>Claude lägger in fakturan, delar upp underlagen på arbetsmoment och kostnadsslag, räknar ut påslaget och stämmer av raderna mot fakturans total. Sedan publiceras en ny version på samma länk.</p>'+
      '<p>Varje rad kopplas till en post i offerten. Arbetsledning, förbrukningsmaterial, transporter, bil, parkering och maskinhyra räknas som Allmänna kostnader, precis som i offerten. Övriga rader kopplas via arbetsmomentet.</p>'+
      '<p class="muted">Kopplingen till arbetsmoment och offertpost är Claudes bedömning utifrån fakturatexterna. Säg till om något ska ligga på en annan post.</p>'+
      '<div class="card" style="padding:14px 16px;display:grid;gap:6px"><span class="eyebrow">Senast inlästa</span>'+
      D.invoices.slice().sort(function(a,b){return a.date<b.date?1:-1;}).map(function(i){return '<div style="display:flex;justify-content:space-between;gap:12px"><span>'+esc(supById[i.supplier].short)+' '+esc(i.nr)+'</span><span class="num muted">'+fmtDate(i.date)+'</span></div>';}).join('')+
      '</div></div></section>';
  }

  var start = 'sammanstallning';
  try{ start = (location.hash||'').slice(1) || localStorage.getItem('kv71-tab') || start; }catch(e){}
  show(start);
})();
</script>
<!--ARTIFACT-END-->
</body>
</html>
