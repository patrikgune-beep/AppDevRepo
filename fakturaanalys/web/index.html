<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fakturaanalys Bygg</title>
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fakturor">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">Fakturaanalys <span>Bygg</span></div>
    <nav id="tabs">
      <button data-tab="projekt" class="active">Projekt</button>
      <button data-tab="analys">Analys</button>
      <button data-tab="jamfor">Jämför</button>
      <button data-tab="fraga">Fråga</button>
      <button data-tab="installningar" aria-label="Inställningar">⚙︎</button>
    </nav>
  </header>

  <main id="app">
    <!-- PROJEKT & UNDERLAG -->
    <section id="tab-projekt" class="tab active">
      <div class="cols">
        <aside class="panel">
          <h2>Projekt</h2>
          <ul id="project-list" class="list"></ul>
          <button id="sync-all" class="ghost full" type="button" hidden>⟳ Uppdatera alla projekt</button>
          <form id="project-form" class="stack">
            <input name="name" placeholder="Nytt projekt, t.ex. Karlavägen 71" required>
            <input name="description" placeholder="Beskrivning (valfri)">
            <button>Skapa projekt</button>
          </form>
        </aside>
        <div class="panel grow" id="project-detail">
          <p class="muted">Välj eller skapa ett projekt.</p>
        </div>
      </div>
    </section>

    <!-- ANALYS -->
    <section id="tab-analys" class="tab">
      <div class="panel">
        <div class="filters" id="analys-filters"></div>
      </div>
      <div id="analys-out"></div>
    </section>

    <!-- JÄMFÖR -->
    <section id="tab-jamfor" class="tab">
      <div class="panel">
        <h2>Jämför à-priser mellan projekt</h2>
        <p class="muted">Pris för beställaren exkl. moms, inklusive entreprenörens påslag. Leverantörens eget pris visas separat.</p>
        <div class="filters">
          <label>Jämför
            <select id="cmp-dim">
              <option value="trade">Yrke (timpris)</option>
              <option value="material_type">Material</option>
            </select>
          </label>
          <label>Värde <select id="cmp-value"></select></label>
          <div class="field">Projekt <div id="cmp-projects" class="chips"></div></div>
          <button id="cmp-run">Jämför</button>
        </div>
      </div>
      <div id="cmp-out"></div>
    </section>

    <!-- FRÅGA -->
    <section id="tab-fraga" class="tab">
      <div class="panel">
        <h2>Ställ en fråga om underlaget</h2>
        <div class="filters" id="ask-filters"></div>
        <form id="ask-form" class="ask">
          <textarea id="ask-q" rows="3" placeholder="Skriv din fråga om underlaget …"></textarea>
          <button id="ask-btn">Fråga</button>
        </form>
      </div>
      <div id="ask-log"></div>
      <div class="panel" id="my-questions"></div>
    </section>
    <!-- INSTÄLLNINGAR -->
    <section id="tab-installningar" class="tab">
      <div id="settings-out"></div>
    </section>
  </main>

  <dialog id="file-dialog" class="file-dialog">
    <div class="row" style="justify-content:space-between"><b id="file-title"></b><button id="file-close" type="button" class="small">Stäng</button></div>
    <div id="file-frame"></div>
  </dialog>
  <dialog id="confirm-dialog">
    <form method="dialog" class="stack">
      <p id="confirm-text"></p>
      <div class="row"><button value="ok" id="confirm-ok">Ta bort</button><button value="cancel" class="ghost">Avbryt</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="boot" class="boot"><span class="spinner"></span> Startar…</div>

  <dialog id="line-dialog">
    <form method="dialog" id="line-form" class="stack">
      <h3>Ändra klassificering</h3>
      <p id="line-desc" class="muted"></p>
      <label>Kostnadstyp <select name="cost_category"></select></label>
      <label>Yrke <select name="trade"></select></label>
      <label>Material <input name="material_type" placeholder="t.ex. betong"></label>
      <label>Enhet <input name="unit" placeholder="h, st, m2, m3 ..."></label>
      <div class="row"><button value="save">Spara</button><button value="cancel" class="ghost">Avbryt</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
